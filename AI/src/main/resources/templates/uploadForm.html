<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>식물 진단 서비스</title>
</head>
<body>
<h2>🌱 식물 사진 업로드 (위치 기반 정확도 향상)</h2>
<form th:action="@{/diagnose}" method="post" enctype="multipart/form-data">
    <label for="plantImage">식물 사진 선택:</label>
    <input type="file" id="plantImage" name="image" accept="image/*" required><br><br>

    <p style="font-size: 0.9em; color: gray;">
        * 진단 정확도 향상을 위해 대한민국 위치 정보가 API로 함께 전송됩니다.
    </p>

    <button type="submit">AI 진단 시작</button>
</form>
<div th:if="${error}" style="color: red; margin-top: 10px;">
    <p th:text="${error}"></p>
</div>
</body>
</html>
