<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>전체 강의 - UrbanGreen</title>
  <link rel="stylesheet" href="/css/lecture/lecture.css">
  <link rel="stylesheet" href="/css/header.css">
  <link rel="stylesheet" href="/css/footer.css">
</head>
<body>

<div th:replace="fragments/header :: header"></div>

<section class="page-header">
  <div class="page-header-content">
    <h1>전체 강의</h1>
    <p>귀농을 위한 다양한 작물재배 강의를 만나보세요</p>
  </div>
</section>

<section class="filter-section">
  <div class="filter-container">
    <div class="search-row">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" placeholder="강의 검색..." id="searchInput">
      </div>
    </div>

    <div class="filter-row">
      <button class="filter-tag active" data-category="all">전체</button>
      <button class="filter-tag" data-category="GARDENING">텃밭</button>
      <button class="filter-tag" data-category="FIELD">노지</button>
      <button class="filter-tag" data-category="HOUSE">하우스</button>

      <div class="filter-divider"></div>

      <button class="filter-tag active" data-sub_category="all">전체</button>
      <button class="filter-tag" data-sub_category="SEED">모종</button>
      <button class="filter-tag" data-sub_category="GROW">재배</button>
      <button class="filter-tag" data-sub_category="SHIP">출하</button>
    </div>
  </div>
</section>

<section class="courses-content">
  <div class="courses-header">
    <div class="courses-count">
      총 <strong id="courseCount"></strong>개의 강의
    </div>
    <select class="sort-select" id="sortSelect">
      <option value="newest">최신순</option>
      <option value="oldest">과거순</option>
      <option value="popular">인기순</option>
    </select>
  </div>

  <div class="courses-grid" id="coursesGrid">
  </div>

  <div class="pagination" id="pagination">
  </div>
</section>

<div th:replace="fragments/footer :: footer"></div>

<script th:inline="javascript">
  // -----------------------------------------------------------
  // --- Thymeleaf 변수 초기화 (서버 데이터) ---
  // -----------------------------------------------------------
  // 로그인 상태
  const isLoggedIn = /*[[${isLoggedIn}]]*/ false;
  // 현재 로그인한 유저 ID (구독 요청에 사용)
  const CURRENT_USER_ID = /*[[${session.loginUser != null ? session.loginUser.userId : -1}]]*/ -1;
  // 구독된 강의 ID 목록 (Set 형태의 JS 배열로 변환됨)
  const subscribedLectureIds = /*[[${subscribedLectureIds}]]*/ [];

  const allCourses = [[${lectures}]].map(lecture => {
    const lectureId = lecture.lecture_id;
    return {
      Lecture_id: lectureId,
      sub_category: lecture.sub_category,
      category: lecture.category,
      title: lecture.title,
      desc: lecture.content,
      instructor: lecture.instructorNickname,
      img_url : lecture.img_url,
      sub_count: lecture.sub_count,
      creation_id: lecture.lecture_id,
      // 구독 상태 계산
      isSubscribed: subscribedLectureIds.includes(lectureId)
    };
  });

  // -----------------------------------------------------------
  // --- 전역 설정 및 DOM 초기화 ---
  // -----------------------------------------------------------
  const ITEMS_PER_PAGE = 6;
  let currentPage = 1;
  let filteredCourses = [...allCourses];
  let currentSort = 'newest';
  let currentSub_category = 'all';
  let currentCategory = 'all';
  let currentSearch = '';

  // DOM 요소
  const sub_categoryTags = document.querySelectorAll('[data-sub_category]');
  const categoryTags = document.querySelectorAll('[data-category]');
  const searchInput = document.getElementById('searchInput');
  const sortSelect = document.getElementById('sortSelect');
  const courseCount = document.getElementById('courseCount');

  // -----------------------------------------------------------
  // --- 이벤트 리스너 ---
  // -----------------------------------------------------------

  // 필터 이벤트 리스너
  sub_categoryTags.forEach(tag => {
    tag.addEventListener('click', () => {
      sub_categoryTags.forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      currentSub_category = tag.dataset.sub_category;
      currentPage = 1;
      filterAndRenderCourses();
    });
  });

  categoryTags.forEach(tag => {
    tag.addEventListener('click', () => {
      categoryTags.forEach(t => t.classList.remove('active'));
      tag.classList.add('active');
      currentCategory = tag.dataset.category;
      currentPage = 1;
      filterAndRenderCourses();
    });
  });

  // 검색 이벤트 리스너
  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value.toLowerCase();
    currentPage = 1;
    filterAndRenderCourses();
  });

  // 정렬 선택 이벤트 리스너
  sortSelect.addEventListener('change', (e) => {
    currentSort = e.target.value;
    currentPage = 1;
    filterAndRenderCourses();
  });

  // 헤더 스크롤 효과
  window.addEventListener('scroll', () => {
    const header = document.getElementById('header');
    if (window.scrollY > 50) {
      header.classList.add('scrolled');
    } else {
      header.classList.remove('scrolled');
    }
  });


  // -----------------------------------------------------------
  // --- 유틸리티 함수 ---
  // -----------------------------------------------------------

  // 텍스트를 지정된 길이로 자르고 말줄임표를 추가하는 함수
  function truncateDescription(text, maxLength = 90) {
    if (!text) return '';
    const cleanText = text.replace(/\n/g, ' ').trim();

    if (cleanText.length > maxLength) {
      return cleanText.substring(0, maxLength).trim() + '...';
    }
    return cleanText;
  }

  // 정렬 로직
  function sortCourses(courses) {
    if (currentSort === 'newest') {
      return courses.sort((a, b) => b.creation_id - a.creation_id);
    } else if (currentSort === 'oldest') {
      return courses.sort((a, b) => a.creation_id - b.creation_id);
    } else if (currentSort === 'popular') {
      return courses.sort((a, b) => (b.sub_count || 0) - (a.sub_count || 0));
    }
    return courses;
  }

  // 난이도/카테고리 텍스트 변환
  function getSub_categoryText(sub_category) {
    const sub_categorys = { SEED: '모종', GROW: '재배', SHIP: '출하' };
    return sub_categorys[sub_category] || sub_category;
  }

  function getCategoryText(category) {
    const categories = {
      GARDENING: '텃밭',
      FIELD: '노지',
      HOUSE: '하우스'
    };
    return categories[category] || category;
  }


  // -----------------------------------------------------------
  // --- 핵심 로직: 필터링, 정렬, 렌더링 ---
  // -----------------------------------------------------------

  // 필터링 및 렌더링
  function filterAndRenderCourses() {
    filteredCourses = allCourses.filter(course => {
      const sub_categoryMatch = currentSub_category === 'all' || course.sub_category === currentSub_category;
      const categoryMatch = currentCategory === 'all' || course.category === currentCategory;
      const searchMatch = !currentSearch ||
              course.title.toLowerCase().includes(currentSearch) ||
              course.desc.toLowerCase().includes(currentSearch);

      return sub_categoryMatch && categoryMatch && searchMatch;
    });

    // 필터링 후 정렬 적용
    filteredCourses = sortCourses(filteredCourses);

    courseCount.textContent = filteredCourses.length;
    renderCourses();
    renderPagination();
  }

  // 강의 카드 렌더링
  function renderCourses() {
    const grid = document.getElementById('coursesGrid');
    const start = (currentPage - 1) * ITEMS_PER_PAGE;
    const end = start + ITEMS_PER_PAGE;
    const coursesToShow = filteredCourses.slice(start, end);

    grid.innerHTML = coursesToShow.map(course => {
      // 구독 상태에 따른 버튼 및 링크 설정
      const buttonText = course.isSubscribed ? '시청하기' : '구독하기';
      const buttonClass = course.isSubscribed ? 'subscribe-btn watch-ready' : 'subscribe-btn';

      // 구독하지 않았으면 JS 함수 호출을 위한 링크 (event.preventDefault()는 버튼에서 처리)
      const linkHref = course.isSubscribed
              ? `/lecture/lectureDetail?lectureId=${course.Lecture_id}`
              : `javascript:handleCourseClick(${course.Lecture_id}, '${course.title}', ${course.isSubscribed});`;

      return `
            <a href="${linkHref}" class="course-card-link"
               data-lecture-id="${course.Lecture_id}" data-is-subscribed="${course.isSubscribed}">
                <div class="course-card">
                    <div class="course-thumbnail">
                        <img src="${course.img_url || '/images/default-thumbnail.jpg'}"
                             alt="${course.title} 썸네일">
                    </div>
                    <div class="course-info">
                        <div class="course-category">${getCategoryText(course.category)} • ${getSub_categoryText(course.sub_category)}</div>
                        <div class="course-title-row">
                            <h3 class="course-title">${course.title}</h3>
                            <span class="course-instructor-inline">👤 ${course.instructor}</span>
                        </div>
                        <p class="course-description">${truncateDescription(course.desc, 90)}</p>
                        <div class="course-meta-action">
                            <button class="${buttonClass}"
                                    onclick="event.preventDefault(); handleCourseClick(${course.Lecture_id}, '${course.title.replace(/'/g, "\\'")}', ${course.isSubscribed})">
                                ${buttonText}
                            </button>
                        </div>
                    </div>
                </div>
            </a>
        `;
    }).join('');
  }

  // -----------------------------------------------------------
  // --- 구독 및 제어 로직 ---
  // -----------------------------------------------------------

  /**
   * 강의 카드 또는 버튼 클릭 시 호출되어 구독 여부를 확인하고 처리합니다.
   */
  function handleCourseClick(lectureId, lectureTitle, isSubscribed) {
    if (!isLoggedIn) {
      alert("강의를 시청하거나 구독하려면 로그인이 필요합니다.");
      window.location.href = '/login';
      return;
    }

    if (isSubscribed) {
      // 1. 이미 구독했으면 바로 상세 페이지로 이동
      window.location.href = `/lecture/lectureDetail?lectureId=${lectureId}`;
    } else {
      // 2. 구독 안 했으면 알림 및 구독 요청
      const confirmSub = confirm(`[${lectureTitle}] 강의를 구독하시겠습니까?\n구독 후 강의 시청이 가능합니다.`);

      if (confirmSub) {
        // 구독 API 호출 (LectureSubController의 POST 요청)
        fetch(`/api/subscribe/${lectureId}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        })
                .then(response => {
                  if (response.status === 401) {
                    alert("로그인 세션이 만료되었습니다. 다시 로그인해주세요.");
                    window.location.href = '/login';
                    return;
                  }
                  if (!response.ok && response.status !== 409) {
                    throw new Error('구독 요청 실패: ' + response.statusText);
                  }
                  return response.text();
                })
                .then(text => {
                  if (text.includes("완료되었습니다") || text.includes("이미 구독된")) {
                    alert(" 구독이 완료되었습니다. 강의를 시작합니다.");
                    // 구독 성공 후 상세 페이지로 이동
                    window.location.href = `/lecture/lectureDetail?lectureId=${lectureId}`;
                  } else {
                    alert(`구독 처리 중 오류가 발생했습니다: ${text}`);
                  }
                })
                .catch(error => {
                  console.error('구독 오류:', error);
                  alert(`구독 요청 중 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.`);
                });
      }
    }
  }

  // -----------------------------------------------------------
  // --- 페이지네이션 로직 ---
  // -----------------------------------------------------------

  // 페이지네이션 렌더링
  function renderPagination() {
    const pagination = document.getElementById('pagination');
    const totalPages = Math.ceil(filteredCourses.length / ITEMS_PER_PAGE);

    if (totalPages <= 1) {
      pagination.innerHTML = '';
      return;
    }

    let paginationHTML = '';

    // 이전 버튼
    paginationHTML += `
                <button class="pagination-btn ${currentPage === 1 ? 'disabled' : ''}"
                        onclick="goToPage(${currentPage - 1})"
                        ${currentPage === 1 ? 'disabled' : ''}>
                    ◀
                </button>
            `;

    // 페이지 번호
    const maxVisible = 5;
    let startPage = Math.max(1, currentPage - 2);
    let endPage = Math.min(totalPages, startPage + maxVisible - 1);

    if (endPage - startPage < maxVisible - 1) {
      startPage = Math.max(1, endPage - maxVisible + 1);
    }

    if (startPage > 1) {
      paginationHTML += `<button class="pagination-btn" onclick="goToPage(1)">1</button>`;
      if (startPage > 2) {
        paginationHTML += `<span class="pagination-ellipsis">...</span>`;
      }
    }

    for (let i = startPage; i <= endPage; i++) {
      paginationHTML += `
                    <button class="pagination-btn ${i === currentPage ? 'active' : ''}"
                            onclick="goToPage(${i})">
                        ${i}
                    </button>
                `;
    }

    if (endPage < totalPages) {
      if (endPage < totalPages - 1) {
        paginationHTML += `<span class="pagination-ellipsis">...</span>`;
      }
      paginationHTML += `<button class="pagination-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
    }

    // 다음 버튼
    paginationHTML += `
                <button class="pagination-btn ${currentPage === totalPages ? 'disabled' : ''}"
                        onclick="goToPage(${currentPage + 1})"
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    ▶
                </button>
            `;

    pagination.innerHTML = paginationHTML;
  }

  // 페이지 이동
  function goToPage(page) {
    const totalPages = Math.ceil(filteredCourses.length / ITEMS_PER_PAGE);
    if (page < 1 || page > totalPages) return;

    currentPage = page;
    renderCourses();
    renderPagination();
    window.scrollTo({ top: 0, behavior: 'smooth' }); // 페이지 이동 시 상단으로 스크롤
  }


  // -----------------------------------------------------------
  // --- 초기 실행 및 알림 ---
  // -----------------------------------------------------------

  // 초기 렌더링 및 DOMContentLoaded 이벤트
  document.addEventListener('DOMContentLoaded', () => {
    // URL 파라미터를 확인하여 구독 필요 알림 표시 (컨트롤러 리다이렉트 처리)
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('sub_required') === 'true') {
      alert(" 해당 강의를 시청하려면 먼저 강의 구독을 완료해야 합니다.");
      // 알림 후 URL에서 파라미터 제거
      history.replaceState(null, '', window.location.pathname);
    }

    filterAndRenderCourses();
  });
</script>
</body>
</html>
