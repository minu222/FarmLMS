<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1" name="viewport" />
    <title>UrbanGreen - 강의 수정</title>

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacherMyPage.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/uploadLecture.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/posts.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">

</head>

<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-container">
    <aside class="sidebar">
        <ul>
            <li th:classappend="${active} == 'teacherProfile' ? 'active' : ''">
                <a th:href="@{/teacher/teacherProfile}">내 프로필</a>
            </li>
            <li th:classappend="${active} == 'teacherEdit' ? 'active' : ''">
                <a th:href="@{/teacher/teacherEdit}">내 정보 수정</a>
            </li>
            <li th:classappend="${active} == 'lectureManage' ? 'active' : ''">
                <a th:href="@{/teacher/lectureManage}">강의 관리</a>
            </li>
            <li th:classappend="${active} == 'teacherPosts' ? 'active' : ''">
                <a th:href="@{/teacher/teacherPosts}">내 댓글 관리</a>
            </li>
            <li th:classappend="${active} == 'quizManage' ? 'active' : ''">
                <a th:href="@{/teacher/quizManage/select}">퀴즈 관리</a>
            </li>
        </ul>
    </aside>

    <main id="mypage-content">
        <div class="intro-card">
            <div class="intro-head">
                <h2 th:text="${lecture != null ? '강의 수정' : '강의 등록'}">강의 수정</h2>
                <span class="hint" th:text="${lecture != null ? '등록된 강의를 수정합니다.' : '강의에 대한 정보를 입력하세요.'}">등록된 강의를 수정합니다.</span>
            </div>

            <form class="intro-form" enctype="multipart/form-data" id="lectureCreateForm" method="post"
                  th:action="${lecture != null}
                            ? @{/teacher/lectureManage/{lectureId}/edit(lectureId=${lecture.lectureId})}
                            : @{/teacher/lectureManage/new}">

                <input type="hidden" name="existingImageUrl" th:value="${lecture != null ? lecture.imgUrl : ''}">

                <div class="form-group">
                    <label class="form-label" for="category1">대분류</label>
                    <select class="form-select" id="category1" name="category1" required>
                        <option value="">선택하세요</option>
                        <option value="gardening" th:selected="${lecture != null and lecture.category == 'gardening'}">텃밭가꾸기</option>
                        <option value="house" th:selected="${lecture != null and lecture.category == 'house'}">하우스 농사/실내정원</option>
                        <option value="field" th:selected="${lecture != null and lecture.category == 'field'}">노지</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="category2">중분류</label>
                    <select class="form-select" id="category2" name="category2" required>
                        <option value="">선택하세요</option>
                        <option value="seed" th:selected="${lecture != null and lecture.subCategory == 'seed'}">모종</option>
                        <option value="grow" th:selected="${lecture != null and lecture.subCategory == 'grow'}">재배</option>
                        <option value="ship" th:selected="${lecture != null and lecture.subCategory == 'ship'}">출하</option>
                    </select>
                </div>

                <div class="form-group">
                    <label class="form-label" for="courses_name">강의 제목</label>
                    <input class="form-input" id="courses_name" name="courses_name" placeholder="강의 제목 입력" required
                           type="text" th:value="${lecture != null ? lecture.title : ''}"/>
                </div>

                <div class="form-group">
                    <label class="form-label">강의 썸네일</label>
                    <div class="file-upload-box">
                        <div id="preview-container"
                             th:style="${lecture != null and lecture.imgUrl != null ? 'display:block; margin-bottom: 15px;' : 'display:none; margin-bottom: 15px;'}">
                            <img id="thumbnail-preview"
                                 th:src="${lecture != null and lecture.imgUrl != null ? lecture.imgUrl : ''}"
                                 alt="썸네일 미리보기"
                                 style="max-width: 100%; max-height: 250px; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                        </div>

                        <label class="btn-ghost"
                               style="border:1px solid #ccc; display:inline-block; cursor: pointer;">
                            <i class="fa-solid fa-image"></i> 썸네일 이미지 선택
                            <input accept="image/*" name="thumbnailFile" onchange="handleFileSelect(event)"
                                   style="display:none" type="file" />
                        </label>
                        <div id="fileName" style="margin-top:10px; font-size:14px; color: var(--ink-sub);">
                            <span th:text="${lecture != null and lecture.imgUrl != null ? '기존 썸네일 유지 (새 파일 선택 시 변경)' : '선택된 파일 없음'}">선택된 파일 없음</span>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="description">강의 설명</label>
                    <textarea class="form-textarea" id="description" name="description" placeholder="강의 설명 입력"
                              required th:text="${lecture != null ? lecture.content : ''}"></textarea>
                </div>

                <div class="form-actions">
                    <button class="btn-ghost" onclick="history.back()" type="button">취소</button>
                    <button class="btn-primary" type="submit" th:text="${lecture != null ? '수정 완료 및 비디오 페이지로' : '다음으로'}">다음으로</button>
                </div>
            </form>
        </div>
    </main>
</div>

<footer th:replace="~{fragments/footerShort :: footerShort}"></footer>

<script>
    document.addEventListener('DOMContentLoaded', function () {
        const form = document.getElementById('lectureCreateForm');

        // lectureId를 가져와서 수정 모드인지 확인 (Thymeleaf 변수를 JS 변수로 변환)
        const isEditMode = [[${lecture != null}]];
        const lectureId = isEditMode ? [[${lecture.lectureId}]] : null;

        if (!form) return;

        form.addEventListener('submit', function (e) {
            e.preventDefault();

            const formData = new FormData(form);

            // ✅ 8. POST 요청 URL 동적 설정
            const postUrl = isEditMode
                ? `/teacher/lectureManage/${lectureId}/edit`
                : '/teacher/lectureManage/new';

            fetch(postUrl, {
                method: 'POST',
                body: formData
            })
                .then(function (res) {
                    if (!res.ok) {
                        // 서버에서 던진 JSON 응답을 읽기 위해 res.json() 사용 (에러 메시지 포함)
                        return res.json().then(error => {
                            throw new Error(error.message || '강의 처리 중 오류가 발생했습니다.');
                        });
                    }
                    return res.json();
                })
                .then(function (data) {
                    alert(data.message);
                    // ✅ 9. 서버에서 받은 redirectUrl로 이동 (비디오 페이지 포함)
                    window.location.href = data.redirectUrl;
                })
                .catch(function (err) {
                    console.error(err);
                    alert('처리 중 오류가 발생했습니다.\n' + err.message);
                });
        });
    });

    // 🔽 미리보기 함수 (기존과 동일하지만, 수정 시 기존 이미지 처리 보완)
    function handleFileSelect(event) {
        const file = event.target.files[0];
        const fileNameDiv = document.getElementById('fileName');
        const previewContainer = document.getElementById('preview-container');
        const previewImg = document.getElementById('thumbnail-preview');

        if (file) {
            // 파일명 표시
            fileNameDiv.innerText = file.name;

            // FileReader를 사용한 이미지 미리보기
            const reader = new FileReader();
            reader.onload = function (e) {
                previewImg.src = e.target.result;
                previewContainer.style.display = 'block';
            };
            reader.readAsDataURL(file);
        } else {
            // [수정 모드 보완] 파일 선택 취소 시 기존 이미지 상태로 돌아가도록 처리
            const existingImageUrl = document.querySelector('input[name="existingImageUrl"]').value;

            if (existingImageUrl) {
                fileNameDiv.innerText = '기존 썸네일 유지 (새 파일 선택 시 변경)';
                previewImg.src = existingImageUrl;
                previewContainer.style.display = 'block';
            } else {
                fileNameDiv.innerText = "선택된 파일 없음";
                previewContainer.style.display = 'none';
                previewImg.src = "";
            }
        }
    }
</script>
</body>

</html>
