<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>UrbanGreen - 관리자 공지사항 관리</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 공통 레이아웃 CSS -->
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/myPage.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footer.css}">
    <!-- 관리자 전용 CSS: adminUserManage.css 그대로 재사용해도 괜찮음 -->
    <link rel="stylesheet" th:href="@{/css/admin/adminUserManage.css}">
</head>

<body>
<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-container">
    <!-- 사이드바 (동일) -->
    <aside class="sidebar">
        <ul>
            <li><a th:href="@{/admin/adminUserManage}">회원관리</a></li>
            <li><a th:href="@{/admin/notices}" class="active">공지사항 관리</a></li>
            <li><a th:href="@{/admin/comments}">댓글관리</a></li>
        </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div id="mypage-content">
        <h2>공지사항 관리</h2>

        <!-- 검색 + 선택삭제 툴바 -->
        <div class="admin-toolbar">
            <!-- 검색 -->
            <form class="table-search-bar"
                  th:action="@{/admin/notices}"
                  method="get">
                <input type="text"
                       name="q"
                       placeholder="제목 / 내용 / 작성자 검색"
                       th:value="${keyword}">
                <button type="submit">검색</button>
            </form>

            <button type="button"
                    id="btnDeleteSelected"
                    class="delete-btn-inline">
                선택 삭제
            </button>

            <!-- ✅ 공지사항 등록 버튼 -->
            <a th:href="@{/admin/notices/new}"
               class="create-btn-inline">
                공지사항 등록
            </a>
        </div>

        <!-- 선택 삭제 폼 -->
        <form id="noticeDeleteForm"
              th:action="@{/admin/notices/delete}"
              method="post">

            <!-- 현재 페이지/검색어 유지 -->
            <input type="hidden" name="page" th:value="${currentPage}">
            <input type="hidden" name="q" th:value="${keyword}">

            <table class="admin-table">
                <thead>
                <tr>
                    <th><input type="checkbox" id="check-all"></th>
                    <th>번호</th>
                    <th>제목</th>
                    <th>작성자</th>
                    <th>등록일</th>
                    <th>조회수</th>
                </tr>
                </thead>
                <tbody>

                <!-- 데이터 없을 때 -->
                <tr th:if="${notices == null or #lists.isEmpty(notices)}">
                    <td colspan="6" style="text-align: center;">등록된 공지사항이 없습니다.</td>
                </tr>

                <!-- 데이터 있을 때 -->
                <tr th:each="notice, stat : ${notices}">
                    <!-- 체크박스 -->
                    <td>
                        <input type="checkbox"
                               name="noticeIds"
                               th:value="${notice.noticeId}"
                               class="row-check">
                    </td>

                    <!-- 번호: 최신순 페이징 기준 -->
                    <td th:text="${(currentPage - 1) * pageSize + stat.index + 1}">1</td>

                    <!-- 제목 (상세 링크) -->
                    <td>
                        <a th:href="@{/board/notice/{id}(id=${notice.id})}"
                           th:text="${notice.title}">
                        </a>
                    </td>

                    <td th:text="${notice.authorName}">관리자</td>

                    <td th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">
                        2025-11-20
                    </td>

                    <td th:text="${notice.viewCount}">0</td>
                </tr>
                </tbody>
            </table>
        </form>

        <!-- 페이징 -->
        <div class="table-pagination" th:if="${totalPages > 1}">
            <a th:each="pageNum : ${#numbers.sequence(1, totalPages)}"
               th:href="@{/admin/notices(page=${pageNum}, q=${keyword})}"
               th:text="${pageNum}"
               th:classappend="${pageNum == currentPage} ? ' active'">
            </a>
        </div>
    </div>
</div>

<!-- 푸터 -->
<footer th:replace="~{fragments/footer :: footer}"></footer>

<!-- JS: 전체선택 체크박스 -->
<script th:inline="javascript">
    const checkAll = document.getElementById('check-all');
    if (checkAll) {
        checkAll.addEventListener('change', function () {
            const checked = this.checked;
            document.querySelectorAll('.row-check').forEach(chk => chk.checked = checked);
        });
    }

    // 🔥 선택 삭제 버튼 클릭 시 확인 후 삭제
    const deleteBtn = document.getElementById('btnDeleteSelected');
    if (deleteBtn) {
        deleteBtn.addEventListener('click', function () {
            const checkedRows = document.querySelectorAll('.row-check:checked');

            // 아무 것도 선택 안 했을 때
            if (checkedRows.length === 0) {
                alert('삭제할 공지사항을 선택해주세요.');
                return;
            }

            // 한 번 더 확인
            const ok = confirm('선택한 공지사항을 삭제하시겠습니까?');
            if (!ok) {
                return;
            }

            // 실제 삭제 요청 전송
            const form = document.getElementById('noticeDeleteForm');
            if (form) {
                form.submit();
            }
        });
    }
</script>

</body>
</html>
