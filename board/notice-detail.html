<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${notice != null ? notice.title : '공지사항'}">공지사항</title>

    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/notice-detail.css}">
</head>
<body>

<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>

<!-- 페이지 헤더 -->
<section class="page-header">
    <div class="page-header-content">
        <div class="breadcrumb">
            <a th:href="@{/}">홈</a>
            <span>›</span>
            <a th:href="@{/board/notice}">공지사항</a>
            <span>›</span>
            <span>상세보기</span>
        </div>
        <h1>공지사항</h1>
    </div>
</section>

<!-- 게시글 상세 -->
<section class="post-detail">
    <div class="post-container">
        <!-- 게시글 헤더 -->
        <div class="post-header">
            <div class="post-category">📌 필독</div>
            <h1 class="post-title" id="postTitle" th:text="${notice.title}">공지 제목</h1>

            <div class="post-meta">
                <div class="post-meta-item">
                    <span>👤</span>
                    <span id="postAuthor" th:text="${notice.authorName}">관리자</span>
                </div>

                <div class="post-meta-divider"></div>

                <div class="post-meta-item">
                    <span>📅</span>
                    <span id="postDate"
                          th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">2025-11-10</span>
                </div>

                <div class="post-meta-divider"></div>

                <div class="post-meta-item">
                    <span>👁</span>
                    <span>조회 <strong id="postViews" th:text="${notice.viewCount}">0</strong></span>
                </div>
            </div>
        </div>

        <!-- 게시글 본문 -->
        <div class="post-content" id="postContent"
             th:utext="${#strings.replace(notice.content, '\n', '<br/>')}">
            내용
        </div>

        <!-- 게시글 푸터 -->
        <div class="post-footer">
            <div class="post-actions">
                <a class="btn btn-secondary" th:href="@{/board/notice}">← 목록으로</a>
            </div>

            <!-- 필요 시 권한 체크로 감싸세요 -->
            <div class="post-actions">
                <a class="btn btn-secondary"
                   th:href="@{/board/notice/{id}/edit(id=${notice.id})}">✏️ 수정</a>
                <!-- 삭제는 보안상 form POST/DELETE로 구현 권장 -->
                <form th:action="@{/board/notice/{id}/delete(id=${notice.id})}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-secondary">🗑️ 삭제</button>
                </form>
            </div>
        </div>
    </div>

    <!-- 이전/다음 글 (컨트롤러에서 prev/next 주면 표시) -->
    <div class="post-navigation">
        <div class="nav-item" th:if="${prev != null}">
            <a th:href="@{/board/notice/{id}(id=${prev.id})}">
                <span class="nav-label">▲ 이전글</span>
                <span class="nav-title" th:text="${prev.title}">이전글 제목</span>
            </a>
        </div>

        <div class="nav-item" th:if="${next != null}">
            <a th:href="@{/board/notice/{id}(id=${next.id})}">
                <span class="nav-label">▼ 다음글</span>
                <span class="nav-title" th:text="${next.title}">다음글 제목</span>
            </a>
        </div>
    </div>
</section>


<!-- 푸터 -->
<footer th:replace="fragments/footer :: footer"></footer>

    <script>
        // 헤더 스크롤 효과
        window.addEventListener('scroll', () => {
            const header = document.getElementById('header');
            if (window.scrollY > 50) {
                header.classList.add('scrolled');
            } else {
                header.classList.remove('scrolled');
            }
        });

        // 목록으로 돌아가기
        function goToList() {
            window.location.href = '/post/free-board.html';
        }

        // 다른 게시글로 이동
        function goToPost(id) {
            alert(`게시글 ${id}로 이동 (백엔드 연동 필요)`);
            // 실제로는: window.location.href = `/post/view.html?id=${id}`;
        }

        // 게시글 수정
        function editPost() {
            // 권한 체크 필요
            alert('게시글 수정 페이지로 이동 (백엔드 연동 필요)');
        }

        // 게시글 삭제
        function deletePost() {
            if (confirm('정말 삭제하시겠습니까?')) {
                alert('게시글이 삭제되었습니다. (백엔드 연동 필요)');
                goToList();
            }
        }

        // URL 파라미터에서 게시글 ID 가져오기 (실제 구현 시)
        // const urlParams = new URLSearchParams(window.location.search);
        // const postId = urlParams.get('id');
        // 백엔드에서 게시글 데이터 로드
    </script>
</body>
</html>
