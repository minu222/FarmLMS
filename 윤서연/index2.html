              "card-dark": "#1A281E",

              "text-light-secondary": "#4B5563",

              DEFAULT: "0.5rem",
              lg: "0.75rem",
              xl: "1rem",
              full: "9999px",

    <style>
      .material-symbols-outlined {
        font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24;
      }
      .main-bg-image {
        position: absolute;
        inset: 0;
        z-index: 0;
        background-image: url("https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2070&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
      }
      .main-bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-color: var(--overlay-color);
        backdrop-filter: blur(2px);
      }
      html.light {
        --overlay-color: rgba(240, 253, 244, 0.8);
      }
      html.dark {
        --overlay-color: rgba(20, 30, 23, 0.9);
      }
      .no-scrollbar::-webkit-scrollbar {
        display: none;
      }
      .no-scrollbar {
        -ms-overflow-style: none;
        scrollbar-width: none;
      }
      /* 디자인은 유지, 배치만 개선 */

    class="font-display bg-background-light dark:bg-background-dark text-text-light-primary dark:text-text-dark-primary"

    <div class="relative flex min-h-screen w-full flex-col overflow-x-hidden">
      <div class="main-bg-image"></div>
      <div class="main-bg-overlay"></div>
      <div class="relative flex h-full grow flex-col z-10">
        <div class="flex flex-1 justify-center py-5">
          <div
            class="flex flex-col w-full max-w-6xl flex-1 px-4 sm:px-6 lg:px-8"
          >
            <!-- Header (디자인 유지) -->
            <header
              class="flex items-center justify-between whitespace-nowrap border border-solid border-border-light dark:border-border-dark px-4 sm:px-6 py-4 bg-card-light/80 dark:bg-card-dark/80 backdrop-blur-sm rounded-xl shadow-sm"
            >
              <div class="flex items-center gap-4">
                <div class="size-8 text-primary">
                  <span class="material-symbols-outlined !text-4xl">eco</span>
                </div>
                <h2 class="text-xl font-bold tracking-[-0.015em]">CropLearn</h2>
              </div>
              <div class="hidden md:flex flex-1 justify-center gap-8">
                <div class="flex items-center gap-9">
                  <a class="text-primary font-bold text-sm" href="#"
                    >전체 강의</a
                  >
                  <a
                    class="text-text-light-secondary dark:text-text-dark-secondary hover:text-primary dark:hover:text-primary text-sm font-medium"
                    href="#"
                    >나의 강의실</a
                  >
                  <a
                    class="text-text-light-secondary dark:text-text-dark-secondary hover:text-primary dark:hover:text-primary text-sm font-medium"
                    href="#"
                    >커뮤니티</a

                </div>
              </div>
              <div class="flex items-center gap-4">
                <button
                  class="flex h-10 w-10 items-center justify-center rounded-full bg-primary/10 hover:bg-primary/20"
                  aria-label="알림"
                >
                  <span class="material-symbols-outlined text-primary"
                    >notifications</span
                  >
                </button>
                <div
                  class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-10"
                  style="
                    background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA4oDu7B29XNzCTXqv5qF0QvjzW_ZpMLnrx7wAD6wKGvFPvEhNnYdDBZwdiMMkh22caKmlry1kjltO1AxX9Bah7VieoHoULqOzEv3KTgcyEDjA_tIWLNZcoMyBWL_EppDCvraeEE2LTm6utjlT751GkzaajEzP2j2F-iDHGr2Zj3ycdhvj8TRTt8O8IBdZcN2I5pBk3QRXxuZ3agPf09AShvlVCYuxS9KAplA0MM9BHpiuCb848jCqywQ6_ykJKXMz0QvkhW4opi44');
                  "

              </div>
            </header>

            <!-- Title -->
            <main class="mt-7 flex flex-col gap-6">
              <!-- 여백 소폭 축소 -->
              <div class="flex flex-wrap justify-between gap-4 px-2">
                <div class="flex min-w-72 flex-col gap-1.5">
                  <p class="text-4xl font-black tracking-[-0.033em]">
                    강의 탐색하기
                  </p>
                  <p
                    class="text-base text-text-light-secondary dark:text-text-dark-secondary"
                  >
                    기술을 키울 수 있는 올바른 강의를 찾아보세요
                  </p>
                </div>
              </div>

              <!-- Controls -->
              <div
                class="flex flex-col gap-3 p-4 bg-card-light/80 dark:bg-card-dark/80 backdrop-blur-sm rounded-xl shadow-sm border border-border-light dark:border-border-dark"
              >
                <div class="px-1 py-1">
                  <label class="flex flex-col min-w-40 h-12 w-full"
                    ><!-- 높이 살짝 줄임 -->
                    <div
                      class="flex w-full items-stretch rounded-lg h-full border border-border-light dark:border-border-dark focus-within:ring-2 focus-within:ring-primary bg-background-light dark:bg-background-dark"
                    >
                      <div
                        class="flex items-center justify-center pl-4 text-text-light-secondary dark:text-text-dark-secondary"
                      >
                        <span class="material-symbols-outlined">search</span>
                      </div>
                      <input
                        id="searchInput"
                        class="form-input flex w/full flex-1 rounded-lg bg-transparent px-4 text-base focus:outline-0 focus:ring-0 placeholder:text-text-light-secondary dark:placeholder:text-text-dark-secondary"
                        placeholder="강의명 또는 강사명으로 검색"
                      />
                    </div>
                  </label>
                </div>

                <!-- 정렬 + 가로 스크롤 카테고리 바 -->
                <div class="flex items-center gap-3 px-1">
                  <div class="relative shrink-0">
                    <select
                      id="sortSelect"
                      class="appearance-none cursor-pointer h-9 rounded-full bg-background-light dark:bg-background-dark border border-border-light dark:border-border-dark pl-4 pr-10 text-sm font-medium text-text-light-primary dark:text-text-dark-primary focus:outline-none focus:ring-2 focus:ring-primary"
                    >
                      <option value="new">최신순</option>
                      <option value="old">오래된순</option>
                      <option value="pop">인기순</option>
                    </select>
                    <div
                      class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-text-light-secondary dark:text-text-dark-secondary"
                    >
                      <span class="material-symbols-outlined !text-base"
                        >expand_more</span
                      >
                    </div>
                  </div>

                  <div class="relative w-full">
                    <button
                      id="catPrev"
                      class="absolute left-0 top-1/2 -translate-y-1/2 z-10 hidden md:flex items-center justify-center size-8 rounded-full bg-card-light/80 dark:bg-card-dark/80 border border-border-light dark:border-border-dark hover:bg-primary/10"
                      aria-label="카테고리 왼쪽"
                    >
                      <span class="material-symbols-outlined"
                        >chevron_left</span
                      >
                    </button>
                    <div
                      id="catScroller"
                      class="no-scrollbar overflow-x-auto whitespace-nowrap w-full px-9 md:px-10"
                    >
                      <div
                        id="chipRow"
                        class="inline-flex items-center gap-2"
                      ></div>
                    </div>
                    <button
                      id="catNext"
                      class="absolute right-0 top-1/2 -translate-y-1/2 z-10 hidden md:flex items-center justify-center size-8 rounded-full bg-card-light/80 dark:bg-card-dark/80 border border-border-light dark:border-border-dark hover:bg-primary/10"
                      aria-label="카테고리 오른쪽"
                    >
                      <span class="material-symbols-outlined"
                        >chevron_right</span
                      >
                    </button>
                  </div>

                  <label
                    class="flex items-center gap-2 cursor-pointer shrink-0"
                  >
                    <input
                      id="subOnly"
                      type="checkbox"
                      class="form-checkbox h-5 w-5 rounded text-primary bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark focus:ring-primary"
                    />
                    <span class="text-sm font-medium">내가 구독한 강의</span>
                  </label>
                </div>
              </div>

              <!-- 카드 영역 -->
              <div
                id="cardGrid"
                class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"
              ></div>

              <!-- 페이지네이션 -->
              <div class="flex items-center justify-center pt-6 pb-4">
                <nav aria-label="Pagination" class="flex items-center gap-2">
                  <button
                    id="prevPageBtn"
                    class="flex items-center justify-center size-9 rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary"
                    aria-label="이전 페이지"
                  >
                    <span class="material-symbols-outlined">chevron_left</span>
                  </button>
                  <div id="pageNumbers" class="flex items-center gap-2"></div>
                  <button
                    id="nextPageBtn"
                    class="flex items-center justify-center size-9 rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary"
                    aria-label="다음 페이지"
                  >
                    <span class="material-symbols-outlined">chevron_right</span>
                  </button>
                </nav>
              </div>
            </main>
          </div>
        </div>
      </div>

        오이: ["오이 재배 핵심", "덩굴손 관리와 유인", "탄저병 예방"],
        파프리카: ["파프리카 하우스 재배", "착색과 수량 관리", "수확 후 관리"],
        블루베리: [
          "블루베리 토양/수분 관리",
          "품종 선택과 접목",
          "가지치기 실전",
        ],
        감자: ["감자 종서 관리", "수확량 늘리는 관개", "역병 관리"],
        고구마: ["고구마 묘 준비", "비닐멀칭과 습도", "수확과 저장"],
        사과: ["사과 착과 관리", "화상병 예방", "주지 만들기"],
        배: ["배 과원 설계", "가지치기 정석", "과실 비대 관리"],
        복숭아: ["복숭아 꽃솎기", "과실벌레 통합관리", "갈변 예방"],
        체리: ["체리 비가림 시설", "새 피해 방지", "수확 타이밍"],
        수박: ["수박 접목과 정식", "당도 올리는 기술", "병해충 관리"],
        멜론: ["멜론 유인/적심", "망 칠 시기", "수확 후 당도 유지"],
        허브: ["허브 기초", "바질/민트 집중 코스", "실내 조명 관리"],
        고추: ["노지 고추의 모든 것", "역병/진딧물 관리", "수확 일정 설계"],
        양파: ["양파 파종부터 저장까지", "추대 방지", "양분 설계"],
        마늘: ["마늘 파종 심화", "월동 관리", "수확과 건조"],
        브로콜리: ["브로콜리 생리장해", "수확일 예측", "저온기 관리"],
        양배추: ["양배추 정식 밀도", "배추좀나방 관리", "수확 후 저장"],
      };

      const PER_PAGE = 12;
      const TOTAL = 120;
      const randInt = (min, max) =>
        Math.floor(Math.random() * (max - min + 1)) + min;
      const pick = (arr) => arr[randInt(0, arr.length - 1)];

      const courses = Array.from({ length: TOTAL }).map((_, i) => {
        const cat = pick(categories);
        const title = pick(titlesByCat[cat] || [cat + " 심화 과정"]);
        const createdAt = Date.now() - randInt(0, 1000 * 60 * 60 * 24 * 720);
        return {
          id: i + 1,
          title,
          category: cat,
          instructor: pick(instructorNames),
          students: randInt(150, 5200),
          lectures: randInt(6, 24),
          image: sampleImgs[cat] || placeholderImg,
          avatar: pick(avatarImgs),
          createdAt,
          subscribed: Math.random() < 0.25,
        };
      });

      // ===== 상태 =====
      const state = {
        search: "",
        sort: "new",
        category: "딸기",
        subOnly: false,
        page: 1,
      };

      // ===== 엘리먼트 =====
      const cardGrid = document.getElementById("cardGrid");
      const searchInput = document.getElementById("searchInput");
      const sortSelect = document.getElementById("sortSelect");
      const subOnly = document.getElementById("subOnly");
      const pageNumbers = document.getElementById("pageNumbers");
      const prevPageBtn = document.getElementById("prevPageBtn");
      const nextPageBtn = document.getElementById("nextPageBtn");
      const catScroller = document.getElementById("catScroller");
      const chipRow = document.getElementById("chipRow");
      const catPrev = document.getElementById("catPrev");
      const catNext = document.getElementById("catNext");

      // ===== 카테고리 칩 가로 바 구성 =====
      function buildChips() {
        chipRow.innerHTML = "";
        categories.forEach((cat, idx) => {
          const btn = document.createElement("button");
          btn.setAttribute("data-chip", "");
          btn.setAttribute("data-category", cat);
          btn.className =
            "h-9 rounded-full border px-4 text-sm flex items-center gap-x-2 bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark hover:bg-primary/10 hover:border-primary";
          btn.innerHTML =
            idx === 0
              ? '<img class="h-5 w-5" alt="icon" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAOpAMwi97C_FBCGaG03ifpnPGQhaIeMZSOKOIfwgE_KmxJFMz9Mpc0aDoQsEBW8f1T0hlG25PwoOGpo48kYDvJ9c74YxlK1SyrNFJEK3Eq8EyJwHZIXlEKBC49MCs8zOR-4DLenfBnvDvDhikx__xNYRSJso-4bxJ6uzr8og4GESAcAwV7Fx9JYaxb9QrCqn5G3s-wc8T7cwaWfBfKWuz1ubfM9qddBFWDKEtc175NkuSeCRdClDikUNYWpebAoZWB1nCkRrI8IkA"/><span>' +
                cat +
                "</span>"
              : '<span class="material-symbols-outlined !text-base">local_florist</span><span>' +
                cat +
                "</span>";
          chipRow.appendChild(btn);
        });
      }

      function updateChipStyles() {
        document.querySelectorAll("button[data-chip]").forEach((btn) => {
          const cat = btn.getAttribute("data-category");
          const active = state.category === cat;
          btn.className = active
            ? "h-9 rounded-full bg-primary/10 border border-primary px-4 text-sm font-bold text-primary flex items-center gap-x-2"
            : "h-9 rounded-full border px-4 text-sm flex items-center gap-x-2 bg-background-light dark:bg-background-dark border-border-light dark:border-border-dark hover:bg-primary/10 hover:border-primary";
        });
      }

      // 수평 스크롤 버튼
      const SCROLL_STEP = 240;
      catPrev.addEventListener("click", () => {
        catScroller.scrollBy({ left: -SCROLL_STEP, behavior: "smooth" });
      });
      catNext.addEventListener("click", () => {
        catScroller.scrollBy({ left: SCROLL_STEP, behavior: "smooth" });
      });

      // 칩 클릭 (이벤트 위임)
      chipRow.addEventListener("click", (e) => {
        const btn = e.target.closest("button[data-chip]");
        if (!btn) return;
        const cat = btn.getAttribute("data-category");
        state.category = state.category === cat ? null : cat;
        state.page = 1;
        updateChipStyles();
        render();
      });

      // ===== 입력 바인딩 =====
      let searchTimer;
      const DEBOUNCE = 160;
      searchInput.addEventListener("input", () => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
          state.search = searchInput.value.trim();
          state.page = 1;
          render();
        }, DEBOUNCE);
      });
      sortSelect.addEventListener("change", () => {
        state.sort = sortSelect.value;
        state.page = 1;
        render();
      });
      subOnly.addEventListener("change", () => {
        state.subOnly = subOnly.checked;
        state.page = 1;
        render();
      });

      // ===== 필터/정렬/페이지 =====
      function applyFilters(list) {
        let out = [...list];
        if (state.category)
          out = out.filter((c) => c.category === state.category);
        if (state.subOnly) out = out.filter((c) => c.subscribed);
        if (state.search) {
          const q = state.search.toLowerCase();
          out = out.filter(
            (c) =>
              c.title.toLowerCase().includes(q) ||
              c.instructor.toLowerCase().includes(q)
          );
        }
        switch (state.sort) {
          case "new":
            out.sort((a, b) => b.createdAt - a.createdAt);
            break;
          case "old":
            out.sort((a, b) => a.createdAt - b.createdAt);
            break;
          case "pop":
            out.sort((a, b) => b.students - a.students);
            break;
        }
        return out;
      }

      function paginate(arr, page, per) {
        const total = arr.length;
        const totalPages = Math.max(1, Math.ceil(total / per));
        const p = Math.min(Math.max(1, page), totalPages);
        const start = (p - 1) * per;
        return { slice: arr.slice(start, start + per), totalPages, page: p };
      }

      // ===== 렌더링 =====
      function numToK(n) {
        return n >= 1000
          ? (n / 1000).toFixed(1).replace(/\.0$/, "") + "K"
          : String(n);
      }
      function cardHTML(c) {
        return `
        <div class="flex flex-col gap-3 rounded-xl bg-card-light dark:bg-card-dark shadow-sm overflow-hidden transition-all hover:shadow-lg hover:-translate-y-1">
          <div class="w-full bg-center bg-no-repeat aspect-video bg-cover" style="background-image:url('${
            c.image
          }');"></div>
          <div class="p-4 flex flex-col flex-grow">
            <p class="text-base font-bold flex-grow">${c.title}</p>
            <div class="flex items-center gap-2 mt-3">
              <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-6" style="background-image:url('${
                c.avatar
              }');"></div>
              <p class="text-sm text-text-light-secondary dark:text-text-dark-secondary">${
                c.instructor
              }</p>
              <span class="ml-auto text-[11px] px-2 py-0.5 rounded-full border border-border-light dark:border-border-dark text-text-light-secondary dark:text-text-dark-secondary">${
                c.category
              }</span>
            </div>
            <div class="flex items-center gap-4 mt-3 text-text-light-secondary dark:text-text-dark-secondary">
              <div class="flex items-center gap-1"><span class="material-symbols-outlined !text-base">group</span><p class="text-xs">${numToK(
                c.students
              )}</p></div>
              <div class="flex items-center gap-1"><span class="material-symbols-outlined !text-base">play_circle</span><p class="text-xs">총 ${
                c.lectures
              }강</p></div>
              ${
                c.subscribed
                  ? '<span class="ml-auto text-[10px] font-semibold px-2 py-0.5 rounded-full bg-primary/10 text-primary border border-primary">구독중</span>'
                  : ""
              }
            </div>
          </div>
        </div>`;
      }

      function renderCards(items) {
        cardGrid.innerHTML = items.map(cardHTML).join("");
      }

      function renderPagination(totalPages) {
        pageNumbers.innerHTML = "";
        const p = state.page;
        const mkBtn = (label, page, active = false) => {
          const b = document.createElement("button");
          b.textContent = label;
          b.className = active
            ? "flex items-center justify-center size-9 rounded-full text-white bg-primary font-bold"
            : "flex items-center justify-center size-9 rounded-full text-text-light-secondary dark:text-text-dark-secondary hover:bg-primary/10 hover:text-primary";
          b.addEventListener("click", () => {
            state.page = page;
            render();
          });
          return b;
        };
        const pages = new Set([
          1,
          2,
          3,
          p - 2,
          p - 1,
          p,
          p + 1,
          p + 2,
          totalPages - 2,
          totalPages - 1,
          totalPages,
        ]);
        const list = [...pages]
          .filter((x) => x >= 1 && x <= totalPages)
          .sort((a, b) => a - b);
        let last = 0;
        list.forEach((n) => {
          if (n - last > 1) {
            const span = document.createElement("span");
            span.className =
              "text-text-light-secondary dark:text-text-dark-secondary";
            span.textContent = "...";
            pageNumbers.appendChild(span);
          }
          pageNumbers.appendChild(mkBtn(String(n), n, n === p));
          last = n;
        });
        prevPageBtn.onclick = () => {
          if (state.page > 1) {
            state.page--;
            render();
          }
        };
        nextPageBtn.onclick = () => {
          if (state.page < totalPages) {
            state.page++;
            render();
          }
        };
      }

      function render() {
        updateChipStyles();
        const filtered = applyFilters(courses);
        const { slice, totalPages, page } = paginate(
          filtered,
          state.page,
          PER_PAGE
        );
        state.page = page;
        renderCards(slice);
        renderPagination(totalPages);
      }

      // 초기화
      buildChips();
      render();
    </script>
  </body>
</html>
