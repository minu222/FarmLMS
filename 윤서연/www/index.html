<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>작물키우기 — 강의</title>
    <style>
      /* ======= COZY GARDEN THEME (No gradients, no animations) ======= */
      :root {
        /* brand (부드러운 세이지 그린을 메인으로) */
        --primary: #5a9a3f; /* 세이지 그린 */
        --primary-600: #4a8734;
        --primary-700: #3d6f2b;

        /* warm palette */
        --deep: #2f4a2f; /* 딥 그린 (헤더/활성) */
        --bg: #faf7f2; /* 따뜻한 크림 배경 */
        --panel: #fff9f1; /* 패널(우유빛 베이지) */
        --panel-strong: #f7efe6; /* 살짝 진한 패널 */
        --chip: #efe6da; /* 칩 기본(미색) */
        --chip-active: #e2d6c7; /* 칩 활성 */
        --line: #e6dccf; /* 테두리(따뜻한 색) */
        --line-2: #d9cdbd; /* hover 테두리 */
        --accent-amber: #d9a441; /* 포인트 앰버 */
        --accent-terracotta: #c87442; /* 포인트 테라코타 */
        --accent-sage: #7ba96a; /* 보조 세이지 */

        /* text */
        --text: #1f2a20; /* 본문 */
        --text-soft: #5a6158; /* 보조 */
        --text-invert: #ffffff;

        /* focus */
        --ring: rgba(90, 154, 63, 0.18);
        --shadow: 0 6px 18px rgba(62, 48, 35, 0.08);
        --shadow-strong: 0 10px 26px rgba(62, 48, 35, 0.12);
        --radius: 16px;
        --radius-chip: 999px;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        margin: 0;
        color: var(--text);
        font: 15px/1.55 system-ui, -apple-system, Segoe UI, Roboto, Helvetica,
          Arial, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic",
          sans-serif;
        background: var(--bg);
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      .container {
        max-width: 1320px;
        margin: 0 auto;
        padding: 0 16px;
      }

      /* ======= HEADER (딥그린 + 베이지 포인트) ======= */
      .header {
        position: sticky;
        top: 0;
        z-index: 20;
        background: var(--deep);
        border-bottom: 1px solid #223822;
        color: var(--text-invert);
      }
      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 12px 0;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        font-weight: 900;
        letter-spacing: 0.2px;
        cursor: pointer;
      }
      .brand-badge {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 22px;
        background: #385a38;
        color: #c7f0b9;
        border: 1px solid #2a452a;
        box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.04);
      }
      .brand-text {
        display: flex;
        flex-direction: column;
        line-height: 1.1;
      }
      .brand-text b {
        font-weight: 900;
      }
      .brand-text small {
        opacity: 0.85;
        font-size: 12px;
      }

      /* ======= CONTROLS ======= */
      .controls {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        max-width: 760px;
      }
      .search-wrap {
        position: relative;
        flex: 1;
      }
      .search-wrap input {
        width: 100%;
        padding: 12px 14px 12px 40px;
        border: 1px solid #3a573a;
        border-radius: 12px;
        background: #fffdf8;
        color: #2f372f;
        outline: none;
        transition: 0.12s;
      }
      .search-wrap input:focus {
        border-color: var(--accent-sage);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .search-icon {
        position: absolute;
        left: 12px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.9;
        color: #c8d9c5;
      }
      .select {
        position: relative;
        display: inline-block;
      }
      .select select {
        appearance: none;
        border: 1px solid #3a573a;
        border-radius: 12px;
        background: #fffdf8;
        padding: 12px 34px 12px 12px;
        font-size: 14px;
        transition: 0.12s;
        outline: none;
        color: #2f372f;
      }
      .select select:focus {
        border-color: var(--accent-sage);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .select .caret {
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        opacity: 0.9;
        color: #c8d9c5;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 11px 14px;
        border-radius: 12px;
        border: 1px solid transparent;
        color: #fff;
        font-weight: 900;
        cursor: pointer;
        background: var(--primary);
        transition: background-color 0.12s ease, transform 0.06s ease;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.04);
      }
      .btn:hover {
        background: var(--primary-600);
        transform: translateY(-1px);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn.secondary {
        background: #fffdf8;
        color: #2b332a;
        border: 1px solid var(--line);
      }
      .btn.ghost {
        background: #fff7ea;
        color: var(--primary-700);
        border: 1px solid var(--line);
        font-weight: 900;
      }
      .btn[disabled] {
        background: #d9d3ca;
        color: #7b776f;
        box-shadow: none;
        cursor: not-allowed;
      }

      .header .btn.secondary {
        background: #3c5c3c;
        color: #ecf5ea;
        border-color: #2a452a;
      }
      .header .btn.secondary:hover {
        background: #355235;
      }

      /* ======= TABS & CHIPS (둥글둥글, 포근한 칩) ======= */
      .tabs {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }
      .tab {
        padding: 9px 16px;
        border-radius: var(--radius-chip);
        border: 1px solid var(--line);
        background: #f2e9dc;
        color: #3b3d36;
        font-weight: 900;
        cursor: pointer;
        transition: 0.12s;
        box-shadow: 0 2px 0 rgba(62, 48, 35, 0.04);
      }
      .tab:hover {
        border-color: var(--line-2);
      }
      .tab.active {
        background: var(--deep);
        color: #fff;
        border-color: var(--deep);
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 12px;
      }
      .chip {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        border-radius: var(--radius-chip);
        border: 1px solid var(--line);
        background: var(--chip);
        color: #3b3d36;
        cursor: pointer;
        transition: transform 0.06s ease, border-color 0.12s ease,
          background 0.12s ease;
      }
      .chip:hover {
        transform: translateY(-1px);
        border-color: var(--line-2);
      }
      .chip.active {
        background: var(--chip-active);
        border-color: #cdbfae;
        color: #2b332a;
      }

      /* ======= GRID & CARDS (따뜻한 그림자) ======= */
      .section-head {
        margin-top: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        color: #2b332a;
      }
      .grid {
        margin-top: 12px;
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 640px) {
        .grid {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (min-width: 960px) {
        .grid {
          grid-template-columns: repeat(3, 1fr);
        }
      }

      .card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
        box-shadow: var(--shadow);
        transition: box-shadow 0.12s ease, transform 0.06s ease,
          border-color 0.12s ease, background 0.12s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-strong);
        border-color: var(--line-2);
      }
      .card-top {
        display: flex;
        gap: 12px;
      }

      /* 아이콘 + 구독표시 묶음 */
      .logo-wrap {
        width: 66px;
        flex: 0 0 66px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .logo {
        width: 54px;
        height: 54px;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 26px;
        background: var(--panel-strong);
        border: 1px solid var(--line);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .sub-indicator {
        height: 18px;
        line-height: 18px;
        font-size: 11px;
        color: #2f4a2f;
        background: #e7f0e3;
        border: 1px solid #cfe0cf;
        border-radius: var(--radius-chip);
        padding: 0 6px;
        visibility: hidden;
      }
      .sub-indicator.on {
        visibility: visible;
      }

      .title {
        font-weight: 900;
        color: #2b332a;
        margin: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        color: var(--text-soft);
        font-size: 12px;
      }

      /* Progress (flat) */
      .progress {
        height: 10px;
        background: #efe6da;
        border-radius: 999px;
        overflow: hidden;
        flex: 1;
        box-shadow: inset 0 1px 0 rgba(0, 0, 0, 0.03);
      }
      .progress > span {
        display: block;
        height: 100%;
        background: var(--primary);
      }

      .row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .footer {
        border-top: 1px solid var(--line);
        margin-top: 40px;
        padding: 24px 0;
        text-align: center;
        color: #7a756c;
        font-size: 12px;
      }

      /* ======= LECTURE PAGE ======= */
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }
      @media (min-width: 960px) {
        .layout {
          grid-template-columns: 260px 1fr;
        }
      }
      .side-sticky {
        position: sticky;
        top: 84px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .side .sbtn {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: #f6efe5;
        cursor: pointer;
        text-align: left;
        font-weight: 800;
        transition: 0.12s;
        color: #2b332a;
      }
      .side .sbtn:hover {
        border-color: var(--line-2);
        background: #f1e8dc;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px;
        box-shadow: var(--shadow);
      }
      .thumb {
        width: 100%;
        aspect-ratio: 16/9;
        border-radius: 14px;
        display: grid;
        place-items: center;
        font-size: 40px;
        cursor: pointer;
        background: #efe6da;
        border: 1px solid var(--line);
        position: relative;
        overflow: hidden;
        color: #2f4a2f;
      }
      .thumb::after {
        content: "PLAY";
        position: absolute;
        bottom: 10px;
        right: 10px;
        font-size: 11px;
        font-weight: 900;
        padding: 4px 8px;
        border-radius: 999px;
        color: #2b332a;
        background: #fffdf8;
        border: 1px solid var(--line);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
      }

      /* ======= MODAL ======= */
      .modal {
        position: fixed;
        inset: 0;
        background: rgba(33, 24, 18, 0.65);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 16px;
        z-index: 50;
      }
      .modal.show {
        display: flex;
      }
      .modal-card {
        width: min(960px, 100%);
        background: #000;
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 24px 80px rgba(33, 24, 18, 0.55);
      }
      .modal-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 12px;
        background: #0b0b0b;
        color: #fff;
      }
      .modal-close {
        background: transparent;
        color: #fff;
        border: 1px solid #ffffff30;
        border-radius: 8px;
        padding: 6px 10px;
        cursor: pointer;
      }

      /* ======= Q&A ======= */
      .qa {
        display: grid;
        gap: 12px;
      }
      .qa-form {
        display: grid;
        gap: 8px;
      }
      .input,
      textarea {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        outline: none;
        transition: 0.12s;
        background: #fffdf8;
        color: #2b332a;
      }
      .input:focus,
      textarea:focus {
        border-color: var(--accent-sage);
        box-shadow: 0 0 0 4px var(--ring);
      }
      .qa-item {
        background: #fff;
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
        box-shadow: 0 4px 14px rgba(62, 48, 35, 0.05);
      }
      .qa-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        color: #756e64;
        font-size: 12px;
      }
      .qa-actions {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      .reply {
        margin-top: 8px;
        padding-left: 16px;
        border-left: 2px solid var(--line);
      }
      .pager {
        display: flex;
        gap: 8px;
        align-items: center;
        justify-content: center;
        margin-top: 8px;
      }
      .pill {
        padding: 7px 12px;
        border-radius: 999px;
        border: 1px solid var(--line);
        background: #fffdf8;
        cursor: pointer;
        color: #2b332a;
      }
      .pill.active {
        background: var(--deep);
        color: #fff;
        border-color: var(--deep);
      }
      .main-bg-image {
        position: fixed;
        inset: 0;
        z-index: 0;
        background-image: url("https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2070&auto=format&fit=crop");
        background-size: cover;
        background-position: center;
      }
      .main-bg-image p:first-child {
        top: 0;
        left: 0;
        background: #ffffff86;
        position: fixed;
        z-index: 1;
        height: 100vh;
        width: 100%;
      }
      .main-bg-image p:last-child {
        margin: 0 auto;
        max-width: 1380px;
        height: 100%;
        width: 100%;
        background-color: var(--panel-strong);
      }
      .main-bg-overlay {
        position: absolute;
        inset: 0;
        z-index: 1;
        background-color: var(--overlay-color);
        backdrop-filter: blur(2px);
      }
      .bgg {
        top: 0;
        left: 0;
        z-index: -1;
        position: fixed;
      }
      .bgg p:first-child {
        top: 0;
        left: 0;
        background: #ffffff86;
        position: fixed;
        z-index: 1;
        height: 100vh;
        width: 100%;
      }
      .bgg3 {
        top: 0;
        left: 0;
        width: 100%;
        position: fixed;
        z-index: -1;
        margin: 0 auto;
        height: 100vh;
      }
      .bgg3 p {
        margin: 0 auto;
        max-width: 1380px;
        height: 100%;
        width: 100%;
        background-color: var(--panel-strong);
        opacity: 0.7;
      }
    </style>
  </head>
  <body>
    <header class="header">
      <div class="container header-inner">
        <div class="brand" id="nav-home">
          <div class="brand-badge">🌿</div>
          <div class="brand-text">
            <b>작물키우기</b><small>따뜻한 집정원</small>
          </div>
        </div>
        <div class="controls" id="controls-home">
          <div class="search-wrap">
            <span class="search-icon">🔎</span>
            <input id="search" placeholder="강의 검색 (예: 토마토, 수경재배)" />
          </div>
          <div class="select">
            <select id="sort">
              <option value="latest">최신순</option>
              <option value="oldest">오래된순</option>
              <option value="popular">인기순(구독자 많은순)</option>
            </select>
            <span class="caret">▾</span>
          </div>
          <button class="btn secondary" id="filterBtn" type="button">
            필터
          </button>
        </div>
        <div class="controls" id="controls-lecture" style="display: none"></div>
      </div>
    </header>

    <!-- ===== HOME ===== -->
    <main class="container" id="page-home">
      <div class="bgg">
        <p></p>
        <p>
          <img
            src="https://images.unsplash.com/photo-1542838132-92c53300491e?q=80&w=2070&auto=format&fit=crop"
            alt=""
          />
        </p>
      </div>
      <div class="bgg2"></div>
      <div class="bgg3"><p></p></div>

      <div class="tabs" id="tabs">
        <button class="tab active" data-tab="종류별">종류별</button>
        <button class="tab" data-tab="작물별">작물별</button>
        <button class="tab" data-tab="내가 구독한 강의">
          내가 구독한 강의
        </button>
      </div>
      <div class="chips" id="chips"></div>
      <div class="section-head">
        <h2 style="margin: 0; font-size: 18px; font-weight: 900">전체 강의</h2>
        <span id="count" style="font-size: 13px">총 0개</span>
      </div>
      <div class="grid" id="grid"></div>
      <div class="empty" id="empty" style="display: none">
        조건에 맞는 강의가 없어요. 필터를 조정해보세요.
      </div>
    </main>

    <!-- ===== LECTURE ===== -->
    <main
      class="container"
      id="page-lecture"
      style="padding: 16px 0 40px; display: none"
    >
      <div class="main-bg-image">
        <p></p>
        <p></p>
      </div>

      <div class="layout">
        <aside class="side">
          <div class="side-sticky">
            <button class="sbtn" id="btnOutline">📑 강의 목차</button>
            <button class="sbtn" id="btnBookmark">🔖 북마크</button>
            <button class="sbtn" id="btnShare">🔗 공유</button>
            <button class="sbtn" id="btnReport">🚩 신고</button>
          </div>
        </aside>
        <section class="content">
          <div class="panel">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 8px;
                flex-wrap: wrap;
              "
            >
              <div>
                <h2 id="lecture-title" style="margin: 0 0 6px 0">강의 제목</h2>
                <div class="muted" id="lecture-meta">
                  🍃 종류 · 작물 · 구독자
                </div>
              </div>
              <button class="btn ghost" id="btnSubscribe">★ 구독</button>
            </div>

            <!-- Thumbnail -->
            <div class="thumb" id="videoThumb" title="강의 보기(팝업)">▶</div>
            <div class="row" style="margin-top: 8px">
              <div class="progress">
                <span id="lecture-progress-bar" style="width: 0%"></span>
              </div>
              <span
                id="lecture-progress-text"
                style="font-variant-numeric: tabular-nums; font-weight: 900"
                >0%</span
              >
            </div>

            <!-- 목록으로 버튼 -->
            <div style="margin-top: 8px">
              <button class="btn secondary" id="backToList">← 목록으로</button>
            </div>

            <!-- Summary -->
            <div style="margin-top: 12px">
              <h3 style="margin: 0 0 6px 0; font-weight: 900">강의 요약</h3>
              <p
                id="lecture-summary"
                class="muted"
                style="margin: 0; color: #5f655c"
              >
                이 강의는 데모입니다. 영상을 끝까지 시청하면 해당 강의의
                진도율이 100%로 반영됩니다.
              </p>
            </div>
          </div>

          <!-- Q&A -->
          <div class="panel" style="margin-top: 16px">
            <div
              style="
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                flex-wrap: wrap;
              "
            >
              <h3 style="margin: 0; font-weight: 900">Q&amp;A</h3>
              <div style="display: flex; gap: 8px">
                <button class="pill active" id="filterAll">전체보기</button>
                <button class="pill" id="filterMine">내가쓴거</button>
              </div>
            </div>

            <div class="qa" style="margin-top: 12px">
              <div class="qa-form">
                <input id="qaTitle" class="input" placeholder="제목" />
                <textarea
                  id="qaBody"
                  rows="3"
                  placeholder="질문을 입력하세요"
                ></textarea>
                <div
                  style="
                    display: flex;
                    gap: 8px;
                    align-items: center;
                    flex-wrap: wrap;

      function loadProgress() {
        const map = JSON.parse(localStorage.getItem(LS_KEY_PROGRESS) || "{}");
        COURSES.forEach((c) => {
          if (map[c.id] != null) c.progress = map[c.id];
        });
      }
      function saveProgress() {
        const map = {};
        COURSES.forEach((c) => (map[c.id] = c.progress));
        localStorage.setItem(LS_KEY_PROGRESS, JSON.stringify(map));
      }

      function loadSubs() {
        const map = JSON.parse(localStorage.getItem(LS_KEY_SUBS) || "{}");
        COURSES.forEach((c) => {
          if (map[c.id] != null) c.subscribed = !!map[c.id];
        });
      }
      function saveSubs() {
        const map = {};
        COURSES.forEach((c) => (map[c.id] = !!c.subscribed));
        localStorage.setItem(LS_KEY_SUBS, JSON.stringify(map));

        const c = COURSES.find((x) => x.id === Number(courseId));

        renderHomeList();
        if (currentCourseId === c.id) updateLectureSubscribeUI();

          $chips.style.display = "none";
          return;
        }
        $chips.style.display = "flex";
        const tags = stateHome.tab === "종류별" ? KIND_TAGS : CROP_TAGS;
        tags.forEach((tag) => {
          const btn = document.createElement("button");
          btn.className = "chip";
          btn.innerHTML = `<span>${tag.logo}</span><span>${tag.label}</span>`;
          const active =
            (stateHome.tab === "종류별"
              ? stateHome.activeKind
              : stateHome.activeCrop) === tag.id;
          if (active) btn.classList.add("active");
          btn.addEventListener("click", () => {
            if (stateHome.tab === "종류별")
              stateHome.activeKind =
                stateHome.activeKind === tag.id ? null : tag.id;
            else
              stateHome.activeCrop =
                stateHome.activeCrop === tag.id ? null : tag.id;
            renderHomeList();
            renderHomeChips();
          });
          $chips.appendChild(btn);
        });
      }

      function courseCard(c) {
        const canQuiz = c.progress >= 80;
        const el = document.createElement("div");
        el.className = "card";
        el.innerHTML = `
        <div class="card-top">
          <div class="logo-wrap">
            <div class="logo">${c.logo}</div>
            <div class="sub-indicator ${c.subscribed ? "on" : ""}">구독 중</div>
          </div>
          <div style="min-width:0;flex:1;">
            <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
              <h3 class="title" title="${c.title}">${c.title}</h3>
            </div>
            <div class="meta" style="margin-top:4px;">
              <span>📘 ${fmtDate(c.date)}</span>
              <span>🍃 ${c.kind} · ${c.crop}</span>
              <span>👥 구독자 ${c.subscribers.toLocaleString()}명</span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="progress"><span style="width:${c.progress}%"></span></div>
          <span style="font-variant-numeric:tabular-nums; font-weight:900;">${
            c.progress
          }%</span>
        </div>
        <div class="row" style="margin-top:auto;flex-wrap:wrap;">
          <button class="btn" ${canQuiz ? "" : "disabled"} title="${
          canQuiz ? "퀴즈를 시작합니다" : "강의 진도율 80% 이상 시 활성화"
        }">퀴즈 보기</button>
          <button class="btn secondary">강의 보기</button>
          <button class="btn ghost subbtn">${
            c.subscribed ? "★ 구독 취소" : "★ 구독"
          }</button>
        </div>
      `;
        const [quizBtn, viewBtn, subBtn] = el.querySelectorAll("button");
        quizBtn.addEventListener("click", (e) => {
          if (c.progress < 80) {
            e.preventDefault();
            return;
          }
          alert("퀴즈 데모: 진도 80% 이상이므로 입장 가능!");
        });
        viewBtn.addEventListener("click", () => openLecture(c.id));
        subBtn.addEventListener("click", () => toggleSubscribe(c.id));
        return el;
      }

      function getHomeFiltered() {
        let list = [...COURSES];
        if (stateHome.search.trim()) {
          const q = stateHome.search.trim().toLowerCase();
          list = list.filter((c) => c.title.toLowerCase().includes(q));
        }
        if (stateHome.tab === "종류별" && stateHome.activeKind)
          list = list.filter((c) => c.kind === stateHome.activeKind);
        if (stateHome.tab === "작물별" && stateHome.activeCrop)
          list = list.filter((c) => c.crop === stateHome.activeCrop);
        if (stateHome.tab === "내가 구독한 강의")
          list = list.filter((c) => c.subscribed);

        if (stateHome.sort === "latest") list.sort(byLatest);
        else if (stateHome.sort === "oldest") list.sort(byOldest);
        else if (stateHome.sort === "popular") list.sort(byPopular);
        return list;
      }

      function renderHomeList() {
        const list = getHomeFiltered();
        $grid.innerHTML = "";
        list.forEach((c) => $grid.appendChild(courseCard(c)));
        $count.textContent = `총 ${list.length}개`;
        $empty.style.display = list.length ? "none" : "block";
      }

      function renderHomeTabs() {
        [...$tabs.querySelectorAll(".tab")].forEach((btn) =>
          btn.classList.toggle("active", btn.dataset.tab === stateHome.tab)
        );
      }

        renderHomeTabs();
        renderHomeChips();
        renderHomeList();
      }

        if (!btn) return;
        const t = btn.dataset.tab;
        if (!t) return;
        stateHome.tab = t;
        stateHome.activeKind = null;
        stateHome.activeCrop = null;
        renderHome();

        stateHome.search = e.target.value || "";

      });
      document
        .getElementById("filterBtn")
        .addEventListener("click", () =>
          alert("데모: 추가 필터는 서버 연동 시 확장")
        );

      /* ===================== 강의 페이지 ===================== */
      const $lectureTitle = document.getElementById("lecture-title");
      const $lectureMeta = document.getElementById("lecture-meta");
      const $lectureSummary = document.getElementById("lecture-summary");
      const $lectureProgressBar = document.getElementById(
        "lecture-progress-bar"
      );
      const $lectureProgressText = document.getElementById(
        "lecture-progress-text"
      );
      const $videoThumb = document.getElementById("videoThumb");
      const $videoModal = document.getElementById("videoModal");
      const $videoPlayer = document.getElementById("videoPlayer");
      const $closeModal = document.getElementById("closeModal");
      const $backToList = document.getElementById("backToList");
      const $btnSubscribe = document.getElementById("btnSubscribe");
      $backToList.addEventListener("click", () => goHome());

      let currentCourseId = null;
      let qaFilter = "all";
      let qaPage = 1;

      function openLecture(id) {
        currentCourseId = id;
        location.hash = `#lecture/${id}`;
        mountLecture();
      }

      function goHome() {
        location.hash = "#home";
        mountHome();
      }

      function mountHome() {
        $pageHome.style.display = "block";
        $controlsHome.style.display = "flex";
        $pageLecture.style.display = "none";
        renderHome();
      }

      function mountLecture() {
        const c = COURSES.find((x) => x.id === Number(currentCourseId));
        if (!c) {
          goHome();
          return;
        }
        $pageHome.style.display = "none";
        $controlsHome.style.display = "none";
        $pageLecture.style.display = "block";

        $lectureTitle.textContent = c.title;
        $lectureMeta.textContent = `🍃 ${c.kind} · ${
          c.crop
        } · 👥 ${c.subscribers.toLocaleString()}명`;
        $lectureSummary.textContent = c.summary || "강의 요약이 없습니다.";
        updateLectureProgressUI(c.progress);
        updateLectureSubscribeUI();

        $videoThumb.onclick = () => {
          $videoPlayer.querySelector("source").src =
            "https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";
          $videoPlayer.load();
          $videoModal.classList.add("show");
          $videoPlayer.currentTime = 0;
          $videoPlayer.play().catch(() => {});
        };

        qaFilter = "all";
        qaPage = 1;
        document.getElementById("filterAll").classList.add("active");
        document.getElementById("filterMine").classList.remove("active");
        renderQA();
      }

      function updateLectureProgressUI(pct) {
        $lectureProgressBar.style.width = pct + "%";
        $lectureProgressText.textContent = pct + "%";
      }

      function updateLectureSubscribeUI() {
        const c = COURSES.find((x) => x.id === Number(currentCourseId));
        if (!c) return;
        $btnSubscribe.textContent = c.subscribed ? "★ 구독 취소" : "★ 구독";
      }

      $btnSubscribe.addEventListener("click", () => {
        if (currentCourseId) toggleSubscribe(currentCourseId);
      });

      $closeModal.addEventListener("click", () => {
        $videoModal.classList.remove("show");
        $videoPlayer.pause();
      });
      $videoModal.addEventListener("click", (e) => {
        if (e.target === $videoModal) {
          $closeModal.click();
        }
      });

      $videoPlayer.addEventListener("ended", () => {
        if (!currentCourseId) return;
        const c = COURSES.find((x) => x.id === Number(currentCourseId));
        if (!c) return;
        if (c.progress < 100) {
          c.progress = 100;
          saveProgress();
          updateLectureProgressUI(c.progress);
          renderHomeList();
          alert("시청 완료! 진도율이 100%로 반영됐어요.");
        }
      });

      /* ===================== Q&A (페이징/권한) ===================== */
      const $qaList = document.getElementById("qaList");
      const $qaTitle = document.getElementById("qaTitle");
      const $qaBody = document.getElementById("qaBody");
      const $qaNickname = document.getElementById("qaNickname");
      const $qaRole = document.getElementById("qaRole");
      const $qaSubmit = document.getElementById("qaSubmit");
      const $filterAll = document.getElementById("filterAll");
      const $filterMine = document.getElementById("filterMine");
      const $prevPage = document.getElementById("prevPage");
      const $nextPage = document.getElementById("nextPage");
      const $pageInfo = document.getElementById("pageInfo");

      function currentUser() {
        return {
          nick: ($qaNickname.value || "익명").trim(),
          role: $qaRole.value || "member",
        };
      }

      function qaKey(courseId) {
        return LS_QA_PREFIX + courseId;
      }
      function loadQA(courseId) {
        return JSON.parse(localStorage.getItem(qaKey(courseId)) || "[]");
      }
      function saveQA(courseId, arr) {
        localStorage.setItem(qaKey(courseId), JSON.stringify(arr));
      }

      $qaSubmit.addEventListener("click", () => {
        if (!currentCourseId) return;
        const title = $qaTitle.value.trim();
        const body = $qaBody.value.trim();
        if (!title || !body) {
          alert("제목과 내용을 입력해주세요.");
          return;
        }
        const user = currentUser();
        const list = loadQA(currentCourseId);
        list.unshift({
          id: Date.now(),
          title,
          body,
          nick: user.nick,
          role: user.role,
          createdAt: new Date().toISOString(),
          replies: [],
        });
        saveQA(currentCourseId, list);
        $qaTitle.value = "";
        $qaBody.value = "";
        qaPage = 1;
        renderQA();
      });

      $filterAll.addEventListener("click", () => {
        qaFilter = "all";
        qaPage = 1;
        $filterAll.classList.add("active");
        $filterMine.classList.remove("active");
        renderQA();
      });
      $filterMine.addEventListener("click", () => {
        qaFilter = "mine";
        qaPage = 1;
        $filterMine.classList.add("active");
        $filterAll.classList.remove("active");
        renderQA();
      });

      $prevPage.addEventListener("click", () => {
        qaPage = Math.max(1, qaPage - 1);
        renderQA();
      });
      $nextPage.addEventListener("click", () => {
        const { totalPages } = getQAPaged();
        qaPage = Math.min(totalPages, qaPage + 1);
        renderQA();
      });

      function getQAPaged() {
        const user = currentUser();
        let list = loadQA(currentCourseId);
        if (qaFilter === "mine")
          list = list.filter((q) => q.nick === user.nick);
        const totalPages = Math.max(1, Math.ceil(list.length / 6));
        const start = (qaPage - 1) * 6;
        const pageItems = list.slice(start, start + 6);
        return { pageItems, totalPages, total: list.length };
      }

      function renderQA() {
        const { pageItems, totalPages, total } = getQAPaged();
        $qaList.innerHTML = "";
        pageItems.forEach((q) => $qaList.appendChild(renderQAItem(q)));
        $pageInfo.textContent =
          `${qaPage} / ${totalPages}` + (total ? ` (총 ${total})` : "");
      }

      function renderQAItem(q) {
        const user = currentUser();
        const canEditDelete = user.nick === q.nick;
        const el = document.createElement("div");
        el.className = "qa-item";
        el.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
          <div style="font-weight:900;">${escapeHTML(q.title)}</div>
          <div class="qa-meta">
            <span>${q.role === "instructor" ? "강사" : "회원"}</span>
            <span>·</span>
            <span>${escapeHTML(q.nick)}</span>
            <span>·</span>
            <span>${fmtDate(q.createdAt)}</span>
          </div>
        </div>
        <div style="margin-top:6px; white-space:pre-wrap;">${escapeHTML(
          q.body
        )}</div>
        <div class="qa-actions"></div>
        <div class="reply"></div>
      `;
        const $actions = el.querySelector(".qa-actions");
        const $replyWrap = el.querySelector(".reply");

        if (canEditDelete) {
          const btnE = pillBtn("수정", () => editQA(q.id));
          const btnD = pillBtn("삭제", () => deleteQA(q.id));
          $actions.appendChild(btnE);
          $actions.appendChild(btnD);
        } else {
          const span = document.createElement("span");
          span.className = "muted";
          span.textContent = "본인 글만 수정/삭제 가능";
          $actions.appendChild(span);
        }

        if (user.role === "instructor") {
          const replyTitle = document.createElement("input");
          replyTitle.className = "input";
          replyTitle.placeholder = "대댓글 제목(강사)";
          const replyBody = document.createElement("textarea");
          replyBody.rows = 2;
          replyBody.placeholder = "대댓글 내용";
          const btnAdd = document.createElement("button");
          btnAdd.className = "btn";
          btnAdd.textContent = "대댓글 등록";
          btnAdd.addEventListener("click", () => {
            if (!replyTitle.value.trim() || !replyBody.value.trim()) {
              alert("제목/내용을 입력하세요.");
              return;
            }
            const list = loadQA(currentCourseId);
            const i = list.findIndex((x) => x.id === q.id);
            if (i >= 0) {
              list[i].replies.push({
                id: Date.now(),
                title: replyTitle.value.trim(),
                body: replyBody.value.trim(),
                nick: user.nick,
                createdAt: new Date().toISOString(),
              });
              saveQA(currentCourseId, list);
              renderQA();
            }
          });
          const box = document.createElement("div");
          box.style.display = "grid";
          box.style.gap = "6px";
          box.style.marginTop = "8px";
          box.appendChild(replyTitle);
          box.appendChild(replyBody);
          box.appendChild(btnAdd);
          $replyWrap.appendChild(box);
        }

        if (q.replies && q.replies.length) {
          q.replies.forEach((r) => {
            const item = document.createElement("div");
            item.className = "qa-item";
            item.style.marginTop = "8px";
            item.innerHTML = `
            <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;">
              <div style="font-weight:900;">${escapeHTML(r.title)}</div>
              <div class="qa-meta"><span>강사</span><span>·</span><span>${escapeHTML(
                r.nick
              )}</span><span>·</span><span>${fmtDate(r.createdAt)}</span></div>
            </div>
            <div style="margin-top:6px; white-space:pre-wrap;">${escapeHTML(
              r.body
            )}</div>
            <div class="qa-actions"></div>
          `;
            const $act = item.querySelector(".qa-actions");
            if (
              currentUser().role === "instructor" &&
              currentUser().nick === r.nick
            ) {
              const btnE = pillBtn("수정", () => editReply(q.id, r.id));
              const btnD = pillBtn("삭제", () => deleteReply(q.id, r.id));
              $act.appendChild(btnE);
              $act.appendChild(btnD);
            }
            $replyWrap.appendChild(item);
          });
        }

        return el;
      }

      function pillBtn(text, onClick) {
        const b = document.createElement("button");
        b.className = "pill";
        b.textContent = text;
        b.addEventListener("click", onClick);
        return b;
      }

      function editQA(id) {
        const list = loadQA(currentCourseId);
        const i = list.findIndex((x) => x.id === id);
        if (i < 0) return;
        const title = prompt("제목 수정", list[i].title);
        if (title == null) return;
        const body = prompt("내용 수정", list[i].body);
        if (body == null) return;
        list[i].title = title.trim();
        list[i].body = body.trim();
        saveQA(currentCourseId, list);
        renderQA();
      }
      function deleteQA(id) {
        if (!confirm("정말 삭제할까요?")) return;
        const list = loadQA(currentCourseId).filter((x) => x.id !== id);
        saveQA(currentCourseId, list);
        renderQA();
      }
      function editReply(qid, rid) {
        const list = loadQA(currentCourseId);
        const i = list.findIndex((x) => x.id === qid);
        if (i < 0) return;
        const j = list[i].replies.findIndex((x) => x.id === rid);
        if (j < 0) return;
        const title = prompt("대댓글 제목 수정", list[i].replies[j].title);
        if (title == null) return;
        const body = prompt("대댓글 내용 수정", list[i].replies[j].body);
        if (body == null) return;
        list[i].replies[j].title = title.trim();
        list[i].replies[j].body = body.trim();
        saveQA(currentCourseId, list);
        renderQA();
      }
      function deleteReply(qid, rid) {
        if (!confirm("대댓글을 삭제할까요?")) return;
        const list = loadQA(currentCourseId);
        const i = list.findIndex((x) => x.id === qid);
        if (i < 0) return;
        list[i].replies = list[i].replies.filter((r) => r.id !== rid);
        saveQA(currentCourseId, list);
        renderQA();
      }

      /* ===================== 라우팅 & 초기화 ===================== */
      function escapeHTML(s) {
        return (s || "").replace(
          /[&<>"']/g,
          (m) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            }[m])
        );
      }

      function applyHashRoute() {
        const h = location.hash || "#home";
        const m = h.match(/^#lecture\/(\d+)/);
        if (m) {
          currentCourseId = Number(m[1]);
          mountLecture();
        } else {
          mountHome();
        }
      }

      loadProgress();
      loadSubs();
      $search.value = stateHome.search;
      $sort.value = stateHome.sort;
      window.addEventListener("hashchange", applyHashRoute);
      applyHashRoute();
    </script>
  </body>
</html>
