<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacherMyPage.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">

</head>
<body>
<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <ul>
            <li><a th:href="@{/teacher/teacherProfile}">내 프로필</a></li>
            <li><a th:href="@{/teacher/teacherEdit}">내 정보수정</a></li>
            <li><a th:href="@{/teacher/lectureManage}">강의 관리</a></li>
            <li><a th:href="@{/teacher/teacherPosts}">내 댓글 관리</a></li>
            <li><a th:href="@{/teacher/quizManage}">퀴즈 관리</a></li>
        </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div id="mypage-content">
        <div th:switch="${tab}">
            <div th:case="'teacherProfile'">
                <h2>내 프로필</h2>
                <p>닉네임: <span th:text="${user.nickname}"></span></p>
                <p>이메일: <span th:text="${user.email}"></span></p>
                <p>생년월일: <span th:text="${user.birth}"></span></p>
            </div>
            <div th:case="'teacherEdit'">
                <h2>내 정보 수정</h2>
                <p>여기에 수정 폼 추가</p>
            </div>
            <div th:case="'lectureManage'">
                <h2>강의 관리</h2>
                <p>강의 목록 불러오기</p>
            </div>
            <div th:case="'teacherPosts'">
                <h2>내내 댓글 관리</h2>
                <p>게시물 목록 불러오기</p>
            </div>
            <div th:case="'quizManage'">
                <h2>퀴즈 관리</h2>
                <p>퀴즈 목록 불러오기</p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footerShort :: footerShort"></footer>
</body>
</html>
