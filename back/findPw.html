<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>비밀번호 찾기 - UrbanGreen</title>
    <link rel="stylesheet" th:href="@{/css/account/findPw.css}">
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">
</head>
<body>
<div class="logo-header">
    <a th:href="@{/main}" class="logo">UrbanGreen</a>
</div>

<div class="main-container">
    <div class="find-card">
        <div class="change-header">
            <h1>비밀번호 찾기</h1>
            <p>가입 시 등록한 정보로 본인 확인을 해주세요</p>
        </div>

        <form th:action="@{/find-pw}"
              method="post"
              th:object="${findPwForm}">

            <div class="form-group">
                <label for="id">아이디</label>
                <input type="text"
                       id="id"
                       th:field="*{id}"
                       placeholder="아이디 입력" required>
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input type="email"
                       id="email"
                       th:field="*{email}"
                       placeholder="가입 시 입력한 이메일" required>
            </div>

            <div class="validation-msg"
                 th:if="${errorMessage != null}"
                 th:text="${errorMessage}"></div>

            <button type="submit" class="find-btn">다음</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>
        대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
        연락처: 0507-1422-2402 |
        © 2025 UrbanGreen. All rights reserved.
    </p>
</footer>
</body>
</html>
