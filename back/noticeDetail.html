<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${notice.title} + ' - UrbanGreen'">공지사항 상세 - UrbanGreen</title>
    <link th:href="@{/css/board/noticeDetail.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/header.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/footer.css}" rel="stylesheet">
</head>

<body>
<div th:replace="~{fragments/header :: header}"></div>

<!-- 브레드크럼 -->
<div class="breadcrumb">
    <a th:href="@{/main}">홈</a>
    <span>›</span>
    <a th:href="@{/board/notice}">공지사항</a>
    <span>›</span>
    <span>상세보기</span>
</div>

<!-- 메인 컨테이너 -->
<div class="container">
    <!-- 공지사항 헤더 -->
    <div class="notice-header">
        <!-- isPinned 사용: 필독 뱃지 -->
        <span class="notice-category"
              th:classappend="${notice.isPinned} ? ' pinned' : ''"
              th:text="${notice.isPinned} ? '필독' : '공지사항'">
            공지사항
        </span>

        <h1 class="notice-title" th:text="${notice.title}">공지 제목</h1>
        <div class="notice-meta">
            <div class="meta-item">
                <span>👤</span>
                <span th:text="${notice.authorName}">관리자</span>
            </div>
            <div class="meta-item">
                <span>📅</span>
                <span th:text="${#temporals.format(notice.createdAt, 'yyyy-MM-dd')}">
                    2025-11-10
                </span>
            </div>
            <div class="meta-item">
                <span>👁️</span>
                <span>조회 <span th:text="${notice.viewCount}">0</span></span>
            </div>
        </div>
    </div>

    <!-- 공지사항 내용 -->
    <div class="notice-content">

        <!-- 🔥 공지 이미지 (있을 때만) -->
        <div class="notice-image" th:if="${notice.imgUrl}">
            <img th:src="${notice.imgUrl}" alt="공지 이미지">
        </div>

        <div th:utext="${notice.content}">내용</div>
    </div>
    <!-- 액션 버튼 -->
    <div class="action-buttons">
        <a th:href="@{/board/notice}" class="btn btn-list">← 목록으로</a>

        <!-- 관리자만 수정/삭제 버튼 표시 -->
        <div class="btn-group"
             th:if="${session.loginUser != null
                 and session.loginUser.userType != null
                 and session.loginUser.userType.toString().toLowerCase() == 'admin'}">

            <!-- ✅ 수정 링크: 다시 /board/notice/{id}/edit 로 -->
            <a th:href="@{/board/notice/{id}/edit(id=${notice.id})}"
               class="btn btn-edit">수정</a>

            <button class="btn btn-delete" onclick="deleteNotice()">삭제</button>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const noticeId = /*[[${notice.id}]]*/ 0;

    function deleteNotice() {
        if (confirm('정말 이 공지사항을 삭제하시겠습니까?')) {
            fetch(`/board/notice/${noticeId}`, {   // 🔥 경로 수정
                method: 'DELETE',
                headers: { 'Content-Type': 'application/json' }
            })
                .then(response => {
                    if (response.ok) {
                        alert('공지사항이 삭제되었습니다.');
                        window.location.href = '/board/notice';
                    } else {
                        alert('삭제에 실패했습니다.');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('오류가 발생했습니다.');
                });
        }
    }

    // 뒤로가기 시 목록 위치 복원
    window.addEventListener('pageshow', function(event) {
        if (event.persisted) {
            const scrollPos = sessionStorage.getItem('noticeListScroll');
            if (scrollPos) {
                window.scrollTo(0, parseInt(scrollPos));
                sessionStorage.removeItem('noticeListScroll');
            }
        }
    });
    /*]]>*/
</script>
</body>

</html>
