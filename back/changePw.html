<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 변경 - UrbanGreen</title>
    <link rel="stylesheet" th:href="@{/css/account/changePw.css}">
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">
</head>

<body>
<div class="logo-header">
    <a th:href="@{/main}" class="logo">UrbanGreen</a>
</div>

<div class="main-container">
    <div class="change-card">
        <div class="change-header">
            <h1>비밀번호 변경</h1>
            <p>안전한 비밀번호로 변경해주세요</p>
        </div>

        <form id="passwordChangeForm"
              th:action="@{/find-pw/change}"
              method="post"
              th:object="${changePwForm}"
              novalidate>

            <div>
                <label for="newPassword">새 비밀번호</label>
                <input type="password"
                       id="newPassword"
                       th:field="*{newPassword}"
                       required
                       minlength="8"
                       placeholder="새 비밀번호 입력" />
            </div>

            <div>
                <label for="confirmPassword">새 비밀번호 확인</label>
                <input type="password"
                       id="confirmPassword"
                       th:field="*{confirmPassword}"
                       required
                       minlength="8"
                       placeholder="새 비밀번호 다시 입력" />
            </div>

            <!-- 프론트 실시간 메시지 -->
            <div id="passwordMatchMessage"
                 style="font-size: 0.9rem; margin-top: -1rem; margin-bottom: 1rem; display: none;"></div>

            <!-- 서버 검증 에러 메시지 -->
            <div class="validation-msg"
                 th:if="${errorMessage != null}"
                 th:text="${errorMessage}"></div>

            <br>
            <div style="color: var(--gray); font-size: 0.9rem; margin-top: -1rem; margin-bottom: 1rem;">
                영문/숫자/특수문자 2종 이상 포함 8–20자로 설정해야 합니다.<br>
                다른 사이트와 동일하게 설정할 경우 보안에 취약할 수 있습니다.
            </div>

            <button type="submit" class="change-btn">비밀번호 변경</button>
        </form>
    </div>
</div>

<footer class="footer">
    <p>
        대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
        연락처: 0507-1422-2402 |
        © 2025 UrbanGreen. All rights reserved.
    </p>
</footer>

<script>
    // submit은 서버로 보내고, JS는 "일치 여부" 안내만 담당
    const newPasswordInput = document.getElementById('newPassword');
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const message = document.getElementById('passwordMatchMessage');

    function checkPasswordsMatch() {
        if (!confirmPasswordInput.value) {
            message.style.display = 'none';
            message.textContent = '';
            return;
        }
        if (newPasswordInput.value === confirmPasswordInput.value) {
            message.style.color = 'green';
            message.textContent = '비밀번호가 일치합니다.';
            message.style.display = 'block';
        } else {
            message.style.color = '#dc3545';
            message.textContent = '비밀번호가 일치하지 않습니다!';
            message.style.display = 'block';
        }
    }

    newPasswordInput.addEventListener('input', checkPasswordsMatch);
    confirmPasswordInput.addEventListener('input', checkPasswordsMatch);
</script>
</body>
</html>
