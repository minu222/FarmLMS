<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="accountStyle.css">
</head>

<body>
    <header>
        <h1><a href="/main/urbangreen.html">UrbanGreen</a></h1>
        <nav id="navMenu">
            <a href="/post/free-board.html">자유게시판</a>
            <a href="/main/class.html">강의</a>
            <a href="/AI/aichoice.html">AI 추천</a>
            <a href="/main/game.html">게임</a>
        </nav>
    </header>

    <div class="content">
        <form class="signup" novalidate>
            <h2>회원가입</h2>
            <div class="upform">
                <div class="field">
                    <label for="name">성명</label>
                    <input id="name" name="name" type="text" autocomplete="name" placeholder="예) 홍길동" required>
                </div>
                <div class="field with-action">
                    <label for="username">아이디</label>
                    <div>
                        <input id="userId" name="username" style="width: 93%;" type="text" autocomplete="username"
                            required>
                        <p id="usernameHelp" class="help" style="font-size: px;">영문 소문자+숫자 6–20자</p>
                    </div>
                    <button type="button" class="btn outline" style="margin-left: 10px;"
                        aria-describedby="usernameHelp">중복 확인</button>
                </div>
                <div class="field">
                    <label for="nickname">닉네임</label>
                    <div>
                        <input id="nickname" name="nickname" type="text" style="width: 95%;" autocomplete="nickname">
                        <p id="nicknameHelp" class="help" style="font-size: px;">영문 소문자+숫자 6–20자</p>
                    </div>
                    <button type="button" class="btn outline" style="margin-left: 20px; padding: 0.55rem 0.77rem;"
                        aria-describedby="nicknameHelp">중복 확인</button>
                </div>
                <div class="field">
                    <label for="password"> 비밀번호</label>
                    <div>
                        <input id="userpw" name="userpw" style="width: 133%;" type="password" required>
                        <p id="pwHelp" class="help" style="font-size: px;">영문/숫자/특수문자 2종 이상 포함 8–20자</p>
                    </div>
                </div>
                <!-- <div class="meter" aria-hidden="true"><span></span></div> -->
                <div class="field" style="margin-top: -35px;">
                    <label for="password2"> 비밀번호 확인 </label>
                    <input id="password2" name="password2" type="password" style="width: 80%;"
                        autocomplete="new-password" required>
                </div>

                <!-- 비밀번호 일치여부 확인 문구-->
                <div class="distinction hidden" id="checkPw">
                    <p>비밀번호가 일치하지 않습니다.</p>
                </div>

                <div class="field">
                    <label for="birth">생년월일</label>
                    <input id="birth" name="birth" type="date" autocomplete="bday">
                </div>

                <div class="field">
                    <label for="email">이메일</label>
                    <input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com">
                </div>
                <div class="pribtn">
                    <button class="btn_primary" type="submit" disabled>회원가입</button>
                </div>
            </div>
        </form>
    </div>
</body>

</html>
