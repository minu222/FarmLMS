<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1><a href="index.html">SmartFarm</a></h1>
        <nav id="navMenu">
            <a href="free-board.html">자유게시판</a>
            <a href="class.html">강의</a>
            <a href="/AI/aichoice.html">AI 추천</a>
            <a href="game.html">게임</a>
        </nav>
    </header>

    <form class="signup" novalidate>

        <h2>회원가입</h2>
        <div class="upform">
            <div class="field">
                <label for="name">성명</label>
                <input id="name" name="name" type="text" autocomplete="name" placeholder="예) 홍길동" required>
            </div>

            <div class="field with-action">
                <div>
                    <label for="username">아이디</label>
                    <input id="username" name="username" type="text" autocomplete="username" required>
                    <p id="usernameHelp" class="help" style="font-size: px;">영문 소문자+숫자 6–20자</p>
                </div>
                <button type="button" class="btn outline" aria-describedby="usernameHelp">중복 확인</button>
            </div>

            <div class="field">
                <label for="nickname">닉네임</label>
                <input id="nickname" name="nickname" type="text" autocomplete="nickname">
            </div>

            <div class="field">
                <div class="password"> </div>
                <label for="password">비밀번호</label>
                <input id="password" name="password" type="password" required>
            </div>
            <p id="pwHelp" class="help" style="font-size: 12px;">영문/숫자/특수문자 2종 이상 포함 8–20자</p>
            
            <div class="meter" aria-hidden="true"><span></span></div>

            <div class="field">
                <label for="password2">비밀번호 확인</label>
                <input id="password2" name="password2" type="password" autocomplete="new-password" required>
                <button type="submit">일치여부 확인</button>
            </div>

            <div class="field">
                <label for="birth">생년월일</label>
                <input id="birth" name="birth" type="date" autocomplete="bday">
            </div>

            <div class="field">
                <label for="email">이메일</label>
                <input id="email" name="email" type="email" autocomplete="email" placeholder="example@email.com">
            </div>

            <button class="btn primary" type="submit" disabled>회원가입</button>
            <p class="form-msg" role="status" aria-live="polite"></p>
        </div>
        </div>
    </form>

</body>

</html>
