<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UrbanGreen - 강의 수정</title>
    <link th:href="@{/css/teacher/lectureModify.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/header.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/footer.css}" rel="stylesheet">
</head>
<style>
    :root {
        --primary: #5cb85f;
        --primary-dark: #4caf50;
        --primary-light: #70c373;
        --gray: #757575;
        --light-gray: #f5f3ed;
        --cream: #fcfbf8;
        --text: #212121;
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
        color: var(--text);
        line-height: 1.6;
    }

    header {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 1000;
        background: rgba(255, 255, 255, 0.98);
        border-bottom: 1px solid #e9ecef;
        transition: all 0.3s ease;
    }

    .header-container {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 1.2rem 2rem;
    }

    .logo {
        font-size: 1.6rem;
        font-weight: 700;
        color: var(--primary);
        letter-spacing: -0.5px;
        text-decoration: none;
    }

    nav {
        display: flex;
        gap: 2rem;
    }

    nav a {
        color: var(--text);
        text-decoration: none;
        font-weight: 500;
        font-size: 0.95rem;
        transition: all 0.3s;
        position: relative;
    }

    nav a:hover,
    nav a.active {
        color: var(--primary);
    }

    nav a.active::after {
        content: '';
        position: absolute;
        bottom: -8px;
        left: 0;
        right: 0;
        height: 3px;
        background: var(--primary);
        border-radius: 2px;
    }

    .main-container {
        max-width: 900px;
        margin: 0 auto;
        padding: 8rem 3rem 5rem;
    }

    .page-header {
        margin-bottom: 2rem;
    }

    .page-header h1 {
        font-size: 2rem;
        font-weight: 800;
        margin-bottom: 0.5rem;
    }

    .page-header p {
        color: var(--gray);
        font-size: 1rem;
    }

    .lecture-form {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(10px);
        border-radius: 20px;
        padding: 3rem;
        border: 1px solid rgba(92, 184, 95, 0.1);
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.05);
    }

    .form-group {
        margin-bottom: 2rem;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.8rem;
        color: var(--text);
        font-size: 1rem;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
        width: 100%;
        padding: 1rem;
        border: 1px solid #ddd;
        border-radius: 12px;
        font-size: 1rem;
        font-family: inherit;
        background: var(--light-gray);
        transition: all 0.3s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(92, 184, 95, 0.1);
        outline: none;
        background: white;
    }

    .form-group textarea {
        min-height: 160px;
        resize: vertical;
        line-height: 1.8;
    }

    .file-upload-wrapper {
        position: relative;
    }

    .file-upload-input {
        display: none;
    }

    .file-upload-btn {
        display: inline-flex;
        align-items: center;
        gap: 0.5rem;
        padding: 0.8rem 1.5rem;
        background: var(--light-gray);
        border: 1px solid #ddd;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s;
        font-weight: 500;
    }

    .file-upload-btn:hover {
        background: rgba(92, 184, 95, 0.1);
        border-color: var(--primary);
    }

    .file-list {
        margin-top: 1rem;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }

    .file-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 0.8rem 1rem;
        background: var(--light-gray);
        border-radius: 10px;
    }

    .file-name {
        color: var(--text);
        font-size: 0.95rem;
    }

    .file-remove {
        background: none;
        border: none;
        color: #d32f2f;
        cursor: pointer;
        font-size: 1.2rem;
        padding: 0.2rem 0.5rem;
        transition: all 0.3s;
    }

    .file-remove:hover {
        color: #b71c1c;
    }

    .button-group {
        display: flex;
        gap: 1rem;
        justify-content: flex-end;
        margin-top: 2rem;
    }

    .btn {
        padding: 1rem 2rem;
        border-radius: 12px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        border: none;
        text-decoration: none;
        display: inline-block;
    }

    .btn-primary {
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
        color: white;
        box-shadow: 0 10px 30px rgba(92, 184, 95, 0.3);
    }

    .btn-primary:hover {
        transform: translateY(-3px);
        box-shadow: 0 15px 40px rgba(92, 184, 95, 0.4);
    }

    .btn-secondary {
        background: var(--light-gray);
        color: var(--text);
        border: 1px solid #ddd;
    }

    .btn-secondary:hover {
        background: rgba(92, 184, 95, 0.1);
        border-color: var(--primary);
    }

    /* 푸터 */
    footer {
        background: #2d3436;
        color: white;
        padding: 3rem 2rem 2rem;
        margin-top: 5rem;
    }

    .footer-container {
        max-width: 1200px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 2fr 1fr 1fr 1fr;
        gap: 2rem;
        margin-bottom: 2rem;
    }

    .footer-about h3 {
        font-size: 1.3rem;
        margin-bottom: 1rem;
        color: var(--primary);
    }

    .footer-about p {
        color: rgba(255, 255, 255, 0.7);
        line-height: 1.6;
    }

    .footer-links h4 {
        margin-bottom: 1rem;
        font-weight: 600;
    }

    .footer-links ul {
        list-style: none;
    }

    .footer-links li {
        margin-bottom: 0.5rem;
    }

    .footer-links a {
        color: rgba(255, 255, 255, 0.7);
        text-decoration: none;
        transition: color 0.3s;
    }

    .footer-links a:hover {
        color: var(--primary);
    }

    .footer-bottom {
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        padding-top: 2rem;
        text-align: center;
        color: rgba(255, 255, 255, 0.6);
        font-size: 0.9rem;
    }

    .service-list {
        display: flex;
        flex-wrap: wrap;
        max-width: 180px;
        gap: 0.3rem 1.5rem;
        list-style: none;
        padding: 0;
    }

    .service-list li {
        width: 33.3%;
        margin-bottom: 0.5rem;
    }
</style>

<body>
    <!-- header -->
    <div th:replace="~{fragments/header :: header}"></div>
    <!-- Main Container -->
    <main class="main-container">
        <div class="page-header">
            <h1>강의 수정</h1>
            <p>강의 정보를 수정해주세요.</p>
        </div>
        <form class="lecture-form" id="lectureEditForm" enctype="multipart/form-data">
            <div class="form-group">
                <label for="title">강의명</label>
                <input type="text" id="title" placeholder="예) 스마트팜 딸기 완전정복" required maxlength="100">

                <div class="form-group">
                    <label for="category" style="margin-top: 1.2rem;">카테고리</label>
                    <select id="category1" required>
                        <option value="">선택하세요</option>
                        <option value="vegetable_gardening">텃밭가꾸기</option>
                        <option value="indoor_garden">하우스 농사/실내정원</option>
                        <option value="farm">노지</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="category">카테고리</label>
                    <select id="category2" required>
                        <option value="">선택하세요</option>
                        <option value="vegetable_seed">모종/씨앗</option>
                        <option value="vegetable_cultivate">재배</option>
                        <option value="deliver">출하</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="desc">강의 설명</label>
                    <textarea id="desc" placeholder="강의의 주요 내용, 특징, 대상 등 자세히 입력해 주세요." required></textarea>
                </div>
                <div class="form-group">
                    <label>썸네일 이미지</label>
                    <div id="currentThumb" style="margin-bottom:1rem;">
                        <img id="currentThumbImg" src="" alt="현재 썸네일"
                            style="max-width:200px; border-radius:12px; display:none;">
                    </div>
                    <label for="thumbUpload" class="file-upload-btn">📷 새 이미지 선택 (선택사항)</label>
                    <input type="file" id="thumbUpload" class="file-upload-input" accept="image/*">
                    <div class="file-list" id="fileList"></div>
                </div>
                <div class="button-group">
                    <a href="/main/class.html" class="btn btn-secondary">취소</a>
                    <button type="button" class="btn btn-danger" onclick="deleteLecture()">삭제</button>
                    <button type="submit" class="btn btn-primary">수정 완료</button>
                </div>
        </form>
    </main>
    <footer th:replace="fragments/footer :: footer"></footer>
    <script>
        // 기존 이미지 미리보기 표시
        const lectureId = new URLSearchParams(window.location.search).get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            // 실제로는 서버에서 데이터 fetch로 불러오기
            const data = {
                title: '스마트팜 딸기 완전정복',
                level: 'intermediate',
                price: 89000,
                desc: '딸기 재배의 모든 것을 배웁니다.',
                thumbUrl: 'https://example.com/thumb.jpg'
            };

            document.getElementById('title').value = data.title;
            document.getElementById('category').value = data.level;
            document.getElementById('desc').value = data.desc;

            if (data.thumbUrl) {
                const img = document.getElementById('currentThumbImg');
                img.src = data.thumbUrl;
                img.style.display = 'block';
            }
        });

        // 폼 제출
        document.getElementById('lectureEditForm').addEventListener('submit', function (e) {
            e.preventDefault();

            const title = document.getElementById('title').value.trim();
            const category1 = document.getElementById('category1').value;
            const category2 = document.getElementById('category2').value;
            const level = document.getElementById('category').value;
            const desc = document.getElementById('desc').value.trim();

            if (!title || !category1 || !category2 || !desc) {
                alert('모든 필수 항목을 입력해주세요.');
                return;
            }

            alert('강의가 수정되었습니다!');
            window.location.href = '/main/class.html';
        });

        // 삭제
        function deleteLecture() {
            if (confirm('정말 삭제하시겠습니까?')) {
                alert('강의가 삭제되었습니다.');
                window.location.href = '/main/class.html';
            }
        }
    </script>
</body>

</html>
