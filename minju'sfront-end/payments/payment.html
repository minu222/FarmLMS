<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 결제하기</title>
    <style>
        :root {
            --primary: #5cb85f;
            --primary-dark: #4caf50;
            --primary-light: #70c373;
            --gray: #757575;
            --light-gray: #f5f3ed;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(92, 184, 95, 0.1);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 3rem 5rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        /* 결제 정보 */
        .payment-form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(92, 184, 95, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light-gray);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light-gray);
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(92, 184, 95, 0.1);
            outline: none;
            background: white;
        }

        /* 결제 수단 */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-method {
            padding: 1.5rem;
            background: var(--light-gray);
            border: 2px solid transparent;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-method:hover {
            background: rgba(92, 184, 95, 0.1);
        }

        .payment-method.selected {
            background: rgba(92, 184, 95, 0.2);
            border-color: var(--primary);
        }

        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .payment-method-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 카드 정보 */
        .card-info {
            display: none;
        }

        .card-info.show {
            display: block;
        }

        .card-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }

        /* 약관 동의 */
        .terms-agreement {
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            flex: 1;
        }

        .checkbox-item a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .checkbox-item a:hover {
            text-decoration: underline;
        }

        /* 결제 버튼 */
        .payment-button {
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.3);
        }

        .payment-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(92, 184, 95, 0.4);
        }

        .payment-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 주문 요약 */
        .order-summary {
            position: sticky;
            top: 8rem;
            height: fit-content;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(92, 184, 95, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .plan-info {
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .plan-name-display {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .plan-billing {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: var(--gray);
        }

        .summary-value {
            font-weight: 600;
        }

        .summary-total {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(92, 184, 95, 0.1);
            border-radius: 8px;
            color: var(--primary);
            font-size: 0.9rem;
        }

        footer {
            background: var(--text);
            color: white;
            padding: 3rem;
            text-align: center;
            margin-top: 5rem;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 6rem 2rem 3rem;
            }

            .payment-form {
                padding: 2rem;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            .card-row {
                grid-template-columns: 1fr;
            }
        }

        /* 기존 style 태그 맨 아래에 추가 */
        .form-group input::placeholder {
            color: #aaa;
            transition: color .15s;
        }

        .form-group input:focus::placeholder {
            color: transparent;
            /* 포커스 시 placeholder 투명화 */
        }

        /* 구형 브라우저 대응이 필요하면 아래 프리픽스도 함께 */
        .form-group input:-ms-input-placeholder {
            color: #aaa;
        }

        .form-group input:focus:-ms-input-placeholder {
            color: transparent;
        }

        .form-group input::-ms-input-placeholder {
            color: #aaa;
        }

        .form-group input:focus::-ms-input-placeholder {
            color: transparent;
        }

        .form-group input::-webkit-input-placeholder {
            color: #aaa;
        }

        .form-group input:focus::-webkit-input-placeholder {
            color: transparent;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-container">
            <a href="/main/urbangreen.html" class="logo">UrbanGreen</a>
        </div>
    </header>

    <div class="main-container">
        <!-- 결제 정보 입력 -->
        <div class="payment-form">
            <h2 class="section-title">💳 결제 정보</h2>

            <!-- 결제 수단 선택 -->
            <div class="form-group">
                <label>결제 수단</label>
                <div class="payment-methods">
                    <div class="payment-method selected" onclick="selectPaymentMethod('card',this)">
                        <div class="payment-method-icon">💳</div>
                        <div class="payment-method-name">신용/체크카드</div>
                    </div>
                    <div class="payment-method" onclick="selectPaymentMethod('kakaopay',this)">
                        <div class="payment-method-icon"><img style="max-width: 80px;" src="/img/kakaopay.png" alt=""></div>
                        <div class="payment-method-name">카카오페이</div>
                    </div>
                    <div class="payment-method" onclick="selectPaymentMethod('naverpay',this)">
                        <div class="payment-method-icon"><img style="max-width: 80px;" src="/img/naverpay.png" alt=""></div>
                        <div class="payment-method-name">네이버페이</div>
                    </div>
                </div>
            </div>

            <!-- 카드 정보 입력 -->
            <div class="card-info show" id="cardInfo">
                <div class="form-group">
                    <label>카드 번호</label>
                    <input type="text" placeholder="0000-0000-0000-0000" maxlength="19" id="cardNumber">
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label>유효기간</label>
                        <input type="text" placeholder="MM/YY" maxlength="5" id="cardExpiry">
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <input type="text" placeholder="000" maxlength="3" id="cardCvc">
                    </div>
                </div>

                <div class="form-group">
                    <label>카드 소유자명</label>
                    <input type="text" placeholder="홍길동" id="cardHolder">
                </div>
            </div>

            <!-- 구매자 정보 -->
            <h2 class="section-title" style="margin-top: 2rem;">👤 구매자 정보</h2>

            <div class="form-group">
                <label>이름</label>
                <input type="text" value="홍길동" id="buyerName">
            </div>

            <div class="form-group">
                <label>이메일</label>
                <input type="email" value="hong@example.com" id="buyerEmail">
            </div>

            <div class="form-group">
                <label>연락처</label>
                <input type="tel" value="010-1234-5678" id="buyerPhone">
            </div>

            <!-- 약관 동의 -->
            <div class="terms-agreement">
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAll" onchange="toggleAllAgreements()">
                    <label for="agreeAll"><strong>전체 약관에 동의합니다</strong></label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree1" required>
                    <label for="agree1">[필수] 이용약관 동의</label>
                    <a href="/terms.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree2" required>
                    <label for="agree2">[필수] 개인정보 수집 및 이용 동의</label>
                    <a href="/privacy.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree3" required>
                    <label for="agree3">[필수] 구독 정책 동의</label>
                    <a href="#" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree4">
                    <label for="agree4">[선택] 마케팅 정보 수신 동의</label>
                </div>
            </div>

            <!-- 결제 버튼 -->
            <button class="payment-button" id="paymentButton" onclick="processPayment()" disabled>
                <span id="paymentAmount">₩19,900</span> 결제하기
            </button>
        </div>

        <!-- 주문 요약 -->
        <aside class="order-summary">
            <div class="summary-card">
                <h3 class="summary-title">📋 주문 요약</h3>

                <div class="plan-info">
                    <div class="plan-name-display" id="planNameDisplay">프리미엄 플랜</div>
                    <div class="plan-billing" id="planBillingDisplay">월간 구독</div>
                </div>

                <div class="summary-item">
                    <span class="summary-label">구독료</span>
                    <span class="summary-value" id="planPrice">₩19,900</span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">할인</span>
                    <span class="summary-value" style="color: #d32f2f;">-₩0</span>
                </div>

                <div class="summary-total">
                    <span class="total-label">최종 결제 금액</span>
                    <span class="total-amount" id="totalAmount">₩19,900</span>
                </div>

                <div class="secure-badge">
                    🔒 안전한 결제 시스템
                </div>
            </div>
        </aside>
    </div>

    <footer>
        <p>
            대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
            연락처: 0507-1422-2402 |
            © 2025 UrbanGreen. All rights reserved.
        </p>
    </footer>

    <script>
        // 0) 유틸: 통화 포맷 (₩19,900 같은 형식)
        const krw = new Intl.NumberFormat('ko-KR', { style: 'currency', currency: 'KRW' });

        // URL에서 플랜 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'premium';
        const billing = urlParams.get('billing') || 'monthly';

        // 2) DOM 캐시
        const $planName = document.getElementById('planNameDisplay');
        const $planBilling = document.getElementById('planBillingDisplay');
        const $planPrice = document.getElementById('planPrice');
        const $totalAmount = document.getElementById('totalAmount');
        const $paymentAmount = document.getElementById('paymentAmount');
        const $payBtn = document.getElementById('paymentButton');

        // 3) 로딩 상태 표시 (초기)
        function setLoadingUI() {
            $planName.textContent = '불러오는 중...';
            $planBilling.textContent = billing === 'yearly' ? '연간 구독' : '월간 구독';
            $planPrice.textContent = '—';
            $totalAmount.textContent = '—';
            $paymentAmount.textContent = '—';
            $payBtn.disabled = true;
        }
        setLoadingUI();

        // 4) 백엔드에서 가격/플랜명 가져오기
        async function loadPlanFromServer() {
            try {
                // 예: /api/pricing?plan=premium&billing=monthly
                const res = await fetch(`/api/pricing?plan=${encodeURIComponent(plan)}&billing=${encodeURIComponent(billing)}`, {
                    method: 'GET',
                    headers: {
                        'Accept': 'application/json'
                    },
                    credentials: 'include' // 세션/쿠키 기반이면 유지
                });

                if (!res.ok) {
                    // 4-1) 오류 응답 처리
                    throw new Error(`가격 정보를 불러오지 못했습니다. (HTTP ${res.status})`);
                }

                /** 기대 응답 예시:
                 * {
                 *   "planCode": "premium",
                 *   "planName": "프리미엄 플랜",
                 *   "billing": "monthly",
                 *   "price": 19900,        // 정수(원)
                 *   "currency": "KRW"
                 * }
                 */
                const data = await res.json();

                // 4-2) 서버 데이터로 화면 채우기
                $planName.textContent = data.planName ?? '플랜';
                $planBilling.textContent = data.billing === 'yearly' ? '연간 구독' : '월간 구독';

                const price = Number(data.price ?? 0);
                const formatted = krw.format(price);

                $planPrice.textContent = formatted;
                $totalAmount.textContent = formatted;
                $paymentAmount.textContent = formatted;

                // 결제 버튼은 약관 필수 체크 완료 시 활성화되므로 여기서 바로 켜지지 않음
                // (약관 체크 로직은 기존 코드 유지)
            } catch (err) {
                console.error(err);
                // 4-3) 실패 시 사용자 친화적 메시지 + 안전한 폴백
                $planName.textContent = '플랜 정보를 불러오지 못했습니다';
                $planBilling.textContent = billing === 'yearly' ? '연간 구독' : '월간 구독';
                $planPrice.textContent = '확인 필요';
                $totalAmount.textContent = '확인 필요';
                $paymentAmount.textContent = '확인 필요';

                // 실패 시 결제 버튼 비활성 유지 (가격 불명확)
                $payBtn.disabled = true;

                // 필요하다면 알림
                alert('현재 결제 금액 정보를 불러올 수 없습니다. 잠시 후 다시 시도해 주세요.');
            }
        }

        // 5) 약관 체크에 따른 결제버튼 활성화(기존 로직 약간 보강)
        function checkPaymentButton() {
            const agree1 = document.getElementById('agree1').checked;
            const agree2 = document.getElementById('agree2').checked;
            const agree3 = document.getElementById('agree3').checked;

            // 가격이 제대로 로드되었는지도 확인 (—가 아니어야 함)
            const priceLoaded = !$paymentAmount.textContent.includes('—') && !$paymentAmount.textContent.includes('확인');

            $payBtn.disabled = !(agree1 && agree2 && agree3 && priceLoaded);
        }

        document.querySelectorAll('.agreement-item').forEach(item => {
            item.addEventListener('change', checkPaymentButton);
        });

        // 6) “전체 동의” 로직 (기존 유지)
        function toggleAllAgreements() {
            const agreeAll = document.getElementById('agreeAll').checked;
            document.querySelectorAll('.agreement-item').forEach(item => item.checked = agreeAll);
            checkPaymentButton();
        }
        window.toggleAllAgreements = toggleAllAgreements;

        // 7) 결제 수단 선택(기존 버그 fix: event 미정의 → 인자로 받거나 this 사용)
        function selectPaymentMethod(method, el) {
            const methods = document.querySelectorAll('.payment-method');
            methods.forEach(m => m.classList.remove('selected'));
            (el ?? event.currentTarget).classList.add('selected'); // onclick="selectPaymentMethod('card', this)"

            const cardInfo = document.getElementById('cardInfo');
            if (method === 'card') cardInfo.classList.add('show');
            else cardInfo.classList.remove('show');
        }
        window.selectPaymentMethod = selectPaymentMethod;

        // 8) 입력 포맷(기존 유지)
        document.getElementById('cardNumber').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join('-') || value;
            e.target.value = formattedValue;
        });
        document.getElementById('cardExpiry').addEventListener('input', function (e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length >= 2) e.target.value = value.slice(0, 2) + '/' + value.slice(2, 4);
            else e.target.value = value;
        });

        // 9) 결제 처리 (가격 로드 성공 + 약관체크 OK 일 때만)
        function processPayment() {
            if ($payBtn.disabled) return;
            alert('결제 처리 중...');
            setTimeout(() => {
                window.location.href = `payment-success.html?plan=${plan}&billing=${billing}`;
            }, 1200);
        }
        window.processPayment = processPayment;

        // 10) 최초 데이터 로드
        loadPlanFromServer();
        
        // 구매자 정보 첫 포커스에서 지우기
        [
            { sel: '#buyerName', sample: '홍길동' },
            { sel: '#buyerEmail', sample: 'hong@example.com' },
            { sel: '#buyerPhone', sample: '010-1234-5678' },
        ].forEach(({ sel, sample }) => {
            const el = document.querySelector(sel);
            if (!el) return;
            el.addEventListener('focus', () => {
                if (el.dataset.cleared === '1') return;
                if (el.value.trim() === sample) {
                    el.value = '';
                    el.dataset.cleared = '1';
                }
            });
        });
    </script>
</body>

</html>
