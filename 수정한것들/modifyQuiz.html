<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UrbanGreen - 퀴즈 수정</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacherMyPage.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/modifyQuiz.css}">
    <link rel="stylesheet" th:href="@{/css/mypage/posts.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">

</head>
<body>
<div th:replace="~{fragments/header :: header}"></div>
<div class="mypage-container">
    <aside class="sidebar">
        <ul>
            <li><a th:href="@{/teacher/teacherProfile}">내 프로필</a></li>
            <li><a th:href="@{/teacher/teacherEdit}">내 정보 수정</a></li>
            <li><a th:href="@{/teacher/lectureManage}">강의 관리</a></li>
            <li><a th:href="@{/teacher/teacherPosts}">내 댓글 관리</a></li>
            <li class="active"><a th:href="@{/teacher/quizManage}">퀴즈 관리</a></li>
        </ul>
    </aside>
    <div id="mypage-content">
        <div class="intro-card">
            <div class="intro-head">
                <h2>퀴즈 수정</h2>
                <span class="hint">등록된 퀴즈 내용을 수정하거나 삭제할 수 있습니다.</span>
            </div>
            <div class="course-title-box">
                <span class="course-title-label">영상 제목 :</span>
                <input type="text"
                       th:value="${video.videoTitle}"
                       readonly
                       id="videoTitle"
                       class="course-title-input" />
            </div>
            <form id="quizEditForm">
                <input type="hidden" id="lectureId" name="lectureId" th:value="${lectureId}" />
                <input type="hidden" id="videoId" name="videoId" th:value="${video.videoId}" />

                <div id="quizWrapper">
                    <!-- 기존 퀴즈 목록 렌더링 -->
                    <div class="quiz-item"
                         th:each="quiz, stat : ${quizzes}">
                        <div class="quiz-header">
                            <span class="quiz-number" th:text="${'Q' + stat.count + '.'}">Q1.</span>
                            <button type="button" class="btn-remove">삭제</button>
                        </div>
                        <textarea class="form-textarea"
                                  name="question"
                                  placeholder="문제를 입력하세요"
                                  th:text="${quiz.question}">기존 문제 내용</textarea>
                        <div class="answer-box">
                            <span class="answer-label">정답 :</span>
                            <input type="text"
                                   class="form-input"
                                   name="modelAnswer"
                                   placeholder="모범답안 입력"
                                   th:value="${quiz.modelAnswer}" />
                        </div>
                    </div>
                </div>
                <!-- ✅ 문항 추가 버튼 -->
                <div class="quiz-actions">
                    <button id="addQuizBtn" type="button" class="btn-add">
                        <i class="fa-solid fa-plus"></i> 문항 추가하기 (최대 5개)
                    </button>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-ghost" onclick="window.history.back()">뒤로가기</button>
                    <button id="editQuiz-btn" type="submit" class="btn-primary">수정 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>


<footer th:replace="~{fragments/footerShort :: footerShort}"></footer>

<script th:inline="javascript">
    const quizWrapper = document.getElementById("quizWrapper");
    const quizEditForm = document.getElementById("quizEditForm");
    const addQuizBtn  = document.getElementById("addQuizBtn");

    // Q1, Q2... 번호 다시 매기기
    function reorderQuizzes() {
        const items = quizWrapper.querySelectorAll(".quiz-item");
        items.forEach((item, index) => {
            const numberSpan = item.querySelector(".quiz-number");
            if (numberSpan) numberSpan.textContent = `Q${index + 1}.`;
        });
    }

    // 기존 퀴즈들의 삭제 버튼 이벤트 연결
    function attachDeleteListeners() {
        const deleteButtons = quizWrapper.querySelectorAll(".btn-remove");
        deleteButtons.forEach((button) => {
            button.addEventListener("click", function () {
                if (confirm("이 문제를 삭제하시겠습니까?")) {
                    const quizItem = this.closest(".quiz-item");
                    quizItem.remove();
                    reorderQuizzes();
                }
            });
        });
    }

    attachDeleteListeners();

    // 현재 문항 개수
    function getQuizCount() {
        return quizWrapper.querySelectorAll(".quiz-item").length;
    }

    // ✅ 문항 추가 버튼 클릭 시 새 퀴즈 카드 추가
    if (addQuizBtn) {
        addQuizBtn.addEventListener("click", function () {
            const currentCount = getQuizCount();
            if (currentCount >= 5) {
                alert("최대 5문제까지 등록 가능합니다.");
                return;
            }

            const nextNum = currentCount + 1;

            const newItem = document.createElement("div");
            newItem.className = "quiz-item";

            newItem.innerHTML = `
                <div class="quiz-header">
                    <span class="quiz-number">Q${nextNum}.</span>
                    <button type="button" class="btn-remove">삭제</button>
                </div>
                <textarea class="form-textarea"
                          name="question"
                          placeholder="문제를 입력하세요"></textarea>
                <div class="answer-box">
                    <span class="answer-label">정답 :</span>
                    <input type="text"
                           class="form-input"
                           name="modelAnswer"
                           placeholder="모범답안 입력" />
                </div>
            `;

            // 새 문항의 삭제 버튼 이벤트 등록
            const delBtn = newItem.querySelector(".btn-remove");
            delBtn.addEventListener("click", function () {
                if (confirm("이 문제를 삭제하시겠습니까?")) {
                    const quizItem = this.closest(".quiz-item");
                    quizItem.remove();
                    reorderQuizzes();
                }
            });

            quizWrapper.appendChild(newItem);
            newItem.scrollIntoView({ behavior: "smooth", block: "center" });
        });
    }

    const videoId   = document.getElementById("videoId").value;
    const lectureId = document.getElementById("lectureId").value;

    // ✅ 수정 완료 버튼 (퀴즈 저장)
    quizEditForm.addEventListener("submit", function (event) {
        event.preventDefault();

        const formData = new FormData(quizEditForm);
        const quizzes  = [];
        const questions = formData.getAll("question");
        const answers   = formData.getAll("modelAnswer");

        if (questions.length === 0) {
            alert("최소 1개 이상의 문제가 필요합니다.");
            return;
        }

        for (let i = 0; i < questions.length; i++) {
            if (!questions[i].trim() || !answers[i].trim()) {
                alert((i + 1) + "번 문제의 질문과 모범답안을 모두 입력해주세요.");
                return;
            }
        }

        const items = quizWrapper.querySelectorAll(".quiz-item");
        items.forEach((item, index) => {
            quizzes.push({
                question: questions[index],
                modelAnswer: answers[index],
                passScore: 60
            });
        });

        fetch("/teacher/quizManage/api/video/" + videoId, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(quizzes),
        })
            .then((response) => {
                if (!response.ok) throw new Error("퀴즈 수정에 실패했습니다.");
                return response.text();
            })
            .then(() => {
                alert("퀴즈가 성공적으로 수정되었습니다.");
                window.location.href = "/teacher/quizManage/" + lectureId;
            })
            .catch((error) => {
                console.error("Error:", error);
                alert(error.message);
            });
    });
</script>
</body>
</html>
