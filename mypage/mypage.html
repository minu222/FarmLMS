<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Page</title>
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">

</head>
<body>
<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <ul>
            <li><a th:href="@{/mypage/profile}">내 프로필</a></li>
            <li><a th:href="@{/mypage/edit}">내 정보수정</a></li>
            <li><a th:href="@{/mypage/subscriptions}">내가 구독한 강의</a></li>
            <li><a th:href="@{/mypage/posts}">내 댓글 보기</a></li>
        </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div id="mypage-content">
        <div th:switch="${tab}">
            <div th:case="'profile'">
                <h2>내 프로필</h2>
                <p>닉네임: <span th:text="${user.nickname}"></span></p>
                <p>이메일: <span th:text="${user.email}"></span></p>
                <p>생년월일: <span th:text="${user.birth}"></span></p>
            </div>
            <div th:case="'edit'">
                <h2>내 정보 수정</h2>
                <p>여기에 수정 폼 추가</p>
            </div>
            <div th:case="'subscriptions'">
                <h2>내 구독 강의</h2>
                <p>강의 목록 불러오기</p>
            </div>
            <div th:case="'posts'">
                <h2>내 게시물</h2>
                <p>게시물 목록 불러오기</p>
            </div>
        </div>
    </div>
</div>

<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
