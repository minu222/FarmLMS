<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 정보수정</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="stylesheet" th:href="@{/css/mypage.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <style>
        /* 페이지 전용 약간의 스타일 */
        .edit-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
        .card{ background:#fff; border-radius:12px; box-shadow:0 8px 24px rgba(0,0,0,.06); padding:22px 24px; }
        .form-row{ display:flex; flex-direction:column; gap:6px; margin-bottom:12px; }
        .form-row label{ font-size:12px; font-weight:700; color:#6b7280; letter-spacing:.4px; text-transform:uppercase; }
        .form-row input, .form-row textarea{
            border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; outline:none;
            background:#fbfdff; transition: box-shadow .2s, border-color .2s;
        }
        .form-row input:focus, .form-row textarea:focus{ border-color:#b7d3ea; box-shadow:0 0 0 4px rgba(64,115,158,.12); }
        .form-actions{ display:flex; gap:10px; margin-top:8px; }
        .alert{ margin-bottom:14px; padding:10px 12px; border-radius:10px; font-weight:600; }
        .alert-ok{ background:#e8f6ef; color:#1b7a48; border:1px solid #bfe7cf; }
        .alert-error{ background:#fff1f1; color:#b03838; border:1px solid #f0caca; }
        @media (max-width: 1024px){ .edit-grid{ grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>

<div class="mypage-container">
    <!-- 사이드 메뉴 -->
    <aside class="sidebar">
        <ul>
            <li th:classappend="${active} == 'profile' ? 'active' : ''"><a th:href="@{/mypage/profile}">내 프로필</a></li>
            <li th:classappend="${active} == 'edit' ? 'active' : ''"><a th:href="@{/mypage/edit}">내 정보수정</a></li>
            <li th:classappend="${active} == 'subscriptions' ? 'active' : ''"><a th:href="@{/mypage/subscriptions}">내가 구독한 강의</a></li>
            <li th:classappend="${active} == 'posts' ? 'active' : ''"><a th:href="@{/mypage/posts}">내 게시물</a></li>
        </ul>
    </aside>

    <!-- 메인 -->
    <main id="mypage-content">

        <!-- 상단 메시지 -->
        <div th:if="${param.success}" class="alert alert-ok">프로필이 저장되었습니다.</div>
        <div th:if="${param.pwChanged}" class="alert alert-ok">비밀번호가 변경되었습니다.</div>
        <div th:if="${error}" class="alert alert-error" th:text="${error}">오류</div>
        <div th:if="${pwError}" class="alert alert-error" th:text="${pwError}">오류</div>

        <div class="edit-grid">
            <!-- 좌: 프로필 폼 -->
            <section class="card">
                <h2 style="margin-top:0;">프로필 정보</h2>
                <form th:action="@{/mypage/updateProfile}" method="post">
                    <div class="form-row">
                        <label>아이디</label>
                        <input type="text" th:value="${user.id}" readonly>
                    </div>
                    <div class="form-row">
                        <label>이름</label>
                        <input type="text" name="name" th:value="${user.name}" required>
                    </div>
                    <div class="form-row">
                        <label>닉네임</label>
                        <input type="text" name="nickname" th:value="${user.nickname}" required>
                    </div>
                    <div class="form-row">
                        <label>이메일</label>
                        <input type="email" name="email" th:value="${user.email}" required>
                    </div>
                    <div class="form-row">
                        <label>생년월일</label>
                        <input type="date" name="birth" th:value="${user.birth}">
                    </div>
                    <div class="form-row">
                        <label>내 소개</label>
                        <textarea name="intro" rows="5" placeholder="소개를 입력하세요" th:text="${user.intro}"></textarea>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">저장</button>
                        <a class="btn-ghost" th:href="@{/mypage/profile}">취소</a>
                    </div>
                </form>
            </section>

            <!-- 우: 비밀번호 변경 -->
            <section class="card">
                <h2 style="margin-top:0;">비밀번호 재설정</h2>
                <form th:action="@{/mypage/updatePassword}" method="post" autocomplete="off">
                    <div class="form-row">
                        <label>현재 비밀번호</label>
                        <input type="password" name="currentPassword" required>
                    </div>
                    <div class="form-row">
                        <label>새 비밀번호 (영문+숫자 8자 이상)</label>
                        <input type="password" name="newPassword" required minlength="8" pattern="(?=.*[A-Za-z])(?=.*\d)[A-Za-z\d]{8,}">
                    </div>
                    <div class="form-row">
                        <label>새 비밀번호 확인</label>
                        <input type="password" name="confirmPassword" required>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn-outline">비밀번호 재설정</button>
                    </div>
                </form>
            </section>
        </div>
    </main>
</div>

<!-- 푸터 -->
<footer th:replace="fragments/footer :: footer"></footer>
</body>
</html>
