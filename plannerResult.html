<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>

<div th:fragment="result-content" class="result-container">
  <h2>**AI 텃밭 플래너 결과입니다!**</h2>

  <p style="font-style: italic; color: #777;">
    (입력 조건: <span th:text="${formData.residenceType}"></span> / <span th:text="${formData.space}"></span> / <span th:text="${formData.experienceLevel}"></span>)
  </p>

  <div class="ai-output" id="aiResultContent" th:utext="${aiResult}">
  </div>

  <hr style="margin: 20px 0;">

  <div class="save-section" style="background: #f9f9f9; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #ddd;">
    <h4 style="margin-top: 0;">📋 나만의 플래너로 저장하기</h4>
    <div style="display: flex; gap: 10px;">
      <input type="text" id="plannerNameInput" placeholder="플래너 이름을 입력하세요 (예: 2024 우리집 베란다 텃밭)"
             style="flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px;">
      <button type="button" onclick="savePlannerToDb()"
              style="padding: 10px 20px; background-color: #5cb85f; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">
        저장
      </button>
    </div>
  </div>

  <button onclick="location.reload()" class="back-button">다른 조건으로 다시하기</button>

</div>

</body>
</html>
