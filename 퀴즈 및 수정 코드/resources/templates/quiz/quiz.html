<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UrbanGreen - 퀴즈</title>
  <link th:href="@{/css/quiz/quiz.css}" rel="stylesheet">
  <input type="hidden" id="videoId" th:value="${videoId}" />
</head>
<body>

<main class="main-container">
  <div class="quiz-title">강의 퀴즈</div>
  <div class="quiz-progress" id="quizProgress">로딩 중...</div>

  <div class="quiz-card" id="quizCard">
    <div class="quiz-image-container" id="quizImageContainer" style="display:none; text-align:center; margin-bottom:15px;">
      <img id="quizImage" src="" alt="퀴즈 이미지" style="max-width: 100%; max-height: 300px; border-radius: 8px;">
    </div>

    <div class="quiz-question" id="quizQuestion"></div>
    <input type="text" id="quizAnswerInput" class="quiz-answer-input" placeholder="답을 입력하세요" autocomplete="off" />
  </div>

  <div class="quiz-action-group" id="quizActionGroup">
    <button class="btn btn-primary" id="submitBtn">제출</button>
  </div>

  <div class="quiz-result" id="quizResult" style="display:none;"></div>
</main>

<script>
  let quizData = [];
  let current = 0;
  let isQuizDirty = false;
  let userAnswers = []; // 서버 전송용: quiz_id와 answer_text만 저장

  // 최종 결과 저장을 위한 변수
  let score = 0;
  let correctCount = 0;
  let totalCount = 0;
  let incorrectDetails = [];

  const videoId = document.getElementById('videoId').value;

  // 1. 페이지 로드 시 DB에서 퀴즈 데이터 가져오기
  document.addEventListener('DOMContentLoaded', () => {
    fetch(`/quiz/api/data/${videoId}`)
            .then(response => {
              if (!response.ok) throw new Error('퀴즈 데이터 로드 실패');
              return response.json();
            })
            .then(data => {
              if(data.length === 0) {
                alert("등록된 퀴즈가 없습니다.");
                window.close();
                return;
              }
              quizData = data;
              showQuiz(0);
            })
            .catch(err => {
              console.error("퀴즈 로드 실패:", err);
              alert("퀴즈 로드 중 오류가 발생했습니다.");
              window.close();
            });
  });

  function showQuiz(idx) {
    const q = quizData[idx];

    document.getElementById('quizQuestion').textContent = q.question;

    const imgContainer = document.getElementById('quizImageContainer');
    const imgTag = document.getElementById('quizImage');

    if (q.img_url && q.img_url.trim() !== "") {
      imgTag.src = q.img_url;
      imgContainer.style.display = 'block';
    } else {
      imgContainer.style.display = 'none';
      imgTag.src = "";
    }

    document.getElementById('quizAnswerInput').value = '';
    document.getElementById('quizProgress').textContent = (idx + 1) + ' / ' + quizData.length + ' 문제';
    document.getElementById('quizResult').style.display = 'none';

    // 버튼 텍스트 변경: 마지막 문제만 '최종 제출'
    if(idx === quizData.length - 1) {
      document.getElementById('submitBtn').textContent = '최종 제출';
    } else {
      document.getElementById('submitBtn').textContent = '다음';
    }
    isQuizDirty = false;
    document.getElementById('quizAnswerInput').focus();
  }

  document.getElementById('submitBtn').onclick = () => {
    const input = document.getElementById('quizAnswerInput').value.trim();
    if (input === '') {
      alert('답을 입력하세요.');
      return;
    }

    isQuizDirty = false;

    // 답안 임시 저장 (서버 전송용)
    userAnswers.push({
      quiz_id: quizData[current].quiz_id,
      answer_text: input
    });

    if (current < quizData.length - 1) {
      current++;
      showQuiz(current);
    } else {
      // 마지막 문제일 경우 최종 제출
      finishQuiz();
    }
  };

  function finishQuiz() {
    // 결과 화면 표시 (결과를 기다리는 상태)
    document.getElementById('quizCard').style.display = 'none'; // 카드 숨김
    document.getElementById('quizActionGroup').innerHTML =
            `<button class="btn btn-secondary" disabled>결과 처리 중...</button>`;
    document.getElementById('quizProgress').textContent = '결과 처리 중...';

    saveQuizResult();
  }

  function saveQuizResult() {
    const payload = {
      video_id: parseInt(videoId),
      answers: userAnswers
    };

    fetch('/quiz/api/submit', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    })
            .then(response => {
              if (!response.ok) {
                return response.json().then(err => { throw new Error(err.message || '서버 오류 발생'); });
              }
              return response.json(); // 서버에서 QuizResultDto를 받아옴
            })
            .then(resultDto => {
              // 서버에서 받은 최종 결과를 전역 변수에 저장
              score = resultDto.total_score || 0; // 점수
              correctCount = resultDto.correct_count || 0; // 맞춘 개수
              totalCount = quizData.length; // 전체 문제 수
              incorrectDetails = resultDto.incorrect_details || []; // 오답 상세 리스트

              // 최종 결과 화면 렌더링 함수 호출
              renderFinalResultPage(resultDto);
            })
            .catch(error => {
              console.error("에러 발생:", error);
              document.getElementById('quizResult').textContent = `결과 저장에 실패했습니다. (${error.message})`;
              document.getElementById('quizActionGroup').innerHTML =
                      `<a href="#" class="btn btn-secondary" onclick="window.close();return false;">닫기</a>`;
            });
  }

  // 최종 결과 페이지를 렌더링
  function renderFinalResultPage(resultDto) {
    const mainContainer = document.querySelector('.main-container');
    const totalQuestions = totalCount;
    const correctQuestions = correctCount;
    const incorrectQuestions = incorrectDetails.length;

    // 1. 상단 점수 시각화 및 요약
    const scoreSummaryHTML = `
          <div class="score-summary-box">
              <h2 class="summary-title">퀴즈 결과</h2>
              <div class="score-display">
                  <span class="score-value">${score}</span>
                  <span class="score-unit">점</span>
              </div>
              <div class="correct-ratio">
                  총 ${totalQuestions} 문제 중
                  <span class="correct-count">${correctQuestions}</span>개를 맞췄습니다.
              </div>
              <div class="pass-status ${resultDto.pass_status === 'PASS' ? 'status-pass' : 'status-fail'}">
                  ${resultDto.message || resultDto.pass_status}
              </div>
          </div>
      `;

    // 2. 오답 노트 섹션
    let incorrectNoteHTML = '';

    if (incorrectQuestions > 0) {
      incorrectNoteHTML = `
              <h3 class="incorrect-title">❌ 오답 노트 (${incorrectQuestions}개)</h3>
              <ul class="incorrect-list">
                  ${incorrectDetails.map((item, index) => `
                      <li class="incorrect-item">
                          <div class="item-header">
                              <span class="item-index">${index + 1}.</span>
                              <span class="item-question">${item.question}</span>
                          </div>
                          <div class="item-detail">
                              <p class="detail-correct">정답: <strong>${item.correct_answer}</strong></p>
                              <p class="detail-user-answer">내가 쓴 답: <strong class="wrong-answer">${item.user_answer}</strong></p>
                          </div>
                      </li>
                  `).join('')}
              </ul>
          `;
    } else {
      incorrectNoteHTML = `<div class="incorrect-title">모든 문제를 맞추셨습니다!! 오답이 없습니다.</div>`;
    }

    // 3. 메인 컨테이너 업데이트
    document.getElementById('quizProgress').textContent = '퀴즈 완료';
    document.getElementById('quizCard').style.display = 'none'; // 기존 카드 숨기기
    document.getElementById('quizResult').style.display = 'none'; // 기존 결과 텍스트 숨기기

    // 모든 내용을 새로운 결과 HTML로 대체
    // 기존 quiz-title, quiz-progress는 그대로 두고 아래 내용을 덮어씌웁니다.
    const resultContent = scoreSummaryHTML + '<div class="final-result-section">' + incorrectNoteHTML + '</div>';

    // 퀴즈 카드에 결과를 렌더링하고 다시 보이게 함
    document.getElementById('quizCard').innerHTML = resultContent;
    document.getElementById('quizCard').style.display = 'block';

    // 버튼 그룹 복원 (닫기 버튼이 여기에 삽입될 예정)
    document.getElementById('quizActionGroup').innerHTML =
            `<a href="#" class="btn btn-secondary" onclick="window.close();return false;">닫기</a>`;
  }

  // 페이지 벗어나기 경고
  window.addEventListener('beforeunload', function (e) {
    if (isQuizDirty) {
      const msg = '저장하지 않은 퀴즈 진행 기록이 있습니다. 창을 닫으면 기록이 유실됩니다.';
      e.preventDefault();
      e.returnValue = msg;
      return msg;
    }
  });

  document.getElementById('quizAnswerInput').addEventListener('input', () => {
    isQuizDirty = true;
  });

  // 엔터 키 입력 시 제출 버튼 클릭 효과
  document.getElementById('quizAnswerInput').addEventListener('keyup', function(event) {
    // Enter 키 (키 코드 13)가 눌렸는지 확인
    if (event.key === 'Enter' || event.keyCode === 13) {
      event.preventDefault(); // 기본 Enter 동작(폼 제출 등) 방지
      document.getElementById('submitBtn').click(); // 제출 버튼 클릭 이벤트 강제 발생
    }
  });
</script>
</body>
</html>
