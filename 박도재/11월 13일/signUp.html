<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 회원가입</title>
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/account/signup.css}">
    <link rel="stylesheet" th:href="@{/css/footerShort.css}">
</head>
<body>
<div class="logo-header">
    <a th:href="@{/main/urbangreen}" class="logo">UrbanGreen</a>
</div>

<div class="main-container">
    <div class="signup-card">
        <div class="signup-header">
            <h1>회원가입</h1>
            <p>청년 귀농의 첫 걸음을 시작하세요</p>
        </div>
        <form class="signup-form" th:action="@{/signUp}" method="post" th:object="${user}">
            <div class="form-group">
                <label for="id">아이디 <span class="required">*</span></label>
                <div class="input-with-btn">
                    <input type="text" id="id" name="id" th:field="*{id}" placeholder="한글, 숫자 4~12자" required>
                    <button type="button" class="check-btn" onclick="checkIdDuplicate()">중복확인</button>
                </div>
                <div id="idCheckMessage" class="validation-msg"></div>
                <div th:if="${idError}" class="validation-msg error" th:text="${idError}"></div>
            </div>

            <div class="form-group">
                <label for="password">비밀번호 <span class="required">*</span></label>
                <input type="password" id="password" name="password" th:field="*{password}" placeholder="비밀번호 입력" required>
                <div class="validation-msg error" th:if="${passwordError}" th:text="${passwordError}"></div>
                <div id="passwordStrengthMsg" class="validation-msg"></div>
            </div>

            <div class="form-group">
                <label for="passwordConfirm">비밀번호 확인 <span class="required">*</span></label>
                <input type="password" id="passwordConfirm" name="passwordConfirm" placeholder="비밀번호 확인" required>
                <div id="passwordMatchMessage" class="validation-msg"></div>
            </div>

            <div class="form-group">
                <label for="name">이름 <span class="required">*</span></label>
                <input type="text" id="name" name="name" th:field="*{name}" placeholder="이름을 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="nickname">닉네임 <span class="required">*</span></label>
                <div class="input-with-btn">
                    <input type="text" id="nickname" name="nickname" th:field="*{nickname}" placeholder="한글, 영문 2~10자" required>
                    <button type="button" class="check-btn" onclick="checkNicknameDuplicate()">중복확인</button>
                </div>
                <div id="nicknameCheckMessage" class="validation-msg"></div>
                <div th:if="${nicknameError}" class="validation-msg error" th:text="${nicknameError}"></div>
            </div>

            <div class="form-group">
                <label for="email">이메일 <span class="required">*</span></label>
                <input type="email" id="email" name="email" th:field="*{email}" placeholder="example@email.com" required>
            </div>

            <div class="form-group">
                <label for="birthDate">생년월일 <span class="required">*</span></label>
                <input type="date" id="birthDate" name="birthDate" th:field="*{birth}" required>
            </div>

            <button type="submit" class="signup-btn">회원가입</button>
        </form>
        <div class="login-link">
            <p>이미 계정이 있으신가요? <a th:href="@{/login}">로그인</a></p>
        </div>
    </div>
</div>

<footer th:replace="fragments/footerShort :: footerShort"></footer>
<script>
    // 아이디 중복 확인
    function checkIdDuplicate() {
        const id = document.getElementById('id').value;
        const msgDiv = document.getElementById('idCheckMessage');

        if (!id) {
            msgDiv.textContent = '아이디를 입력해주세요.';
            msgDiv.className = 'validation-msg error';
            return;
        }
        fetch(`/api/user/check-id?id=${encodeURIComponent(id)}`)
            .then(res => res.json())
            .then(data => {
                if (data.exists) {
                    msgDiv.textContent = '이미 사용 중인 아이디입니다.';
                    msgDiv.className = 'validation-msg error';
                } else {
                    msgDiv.textContent = '사용 가능한 아이디입니다.';
                    msgDiv.className = 'validation-msg success';
                }
            })
            .catch(() => {
                msgDiv.textContent = '중복 확인 중 오류가 발생했습니다.';
                msgDiv.className = 'validation-msg error';
            });
    }

    // 닉네임 중복 확인
    function checkNicknameDuplicate() {
        const nickname = document.getElementById('nickname').value;
        const msgDiv = document.getElementById('nicknameCheckMessage');

        if (!nickname) {
            msgDiv.textContent = '닉네임을 입력해주세요.';
            msgDiv.className = 'validation-msg error';
            return;
        }
        fetch(`/api/user/check-nickname?nickname=${encodeURIComponent(nickname)}`)
            .then(res => res.json())
            .then(data => {
                if (data.exists) {
                    msgDiv.textContent = '이미 사용 중인 닉네임입니다.';
                    msgDiv.className = 'validation-msg error';
                } else {
                    msgDiv.textContent = '사용 가능한 닉네임입니다.';
                    msgDiv.className = 'validation-msg success';
                }
            })
            .catch(() => {
                msgDiv.textContent = '중복 확인 중 오류가 발생했습니다.';
                msgDiv.className = 'validation-msg error';
            });
    }

    // 비밀번호 강도 및 일치 확인
    const pw = document.getElementById('password');
    const pwConfirm = document.getElementById('passwordConfirm');
    const pwStrengthMsg = document.getElementById('passwordStrengthMsg');
    const pwMatchMsg = document.getElementById('passwordMatchMessage');

    pw.addEventListener('input', function() {
        const value = pw.value;
        // 강도 판정: 8자 미만 or 영문/숫자 미포함 → 약함, 그 외 → 안전
        if (!value) {
            pwStrengthMsg.textContent = '';
            pwStrengthMsg.className = 'validation-msg';
        } else if (value.length < 8) {
            pwStrengthMsg.textContent = '약한 비밀번호입니다.';
            pwStrengthMsg.className = 'validation-msg error';
        } else if (!/[A-Za-z]/.test(value) || !/\d/.test(value)) {
            pwStrengthMsg.textContent = '영문과 숫자를 모두 포함해 주세요.';
            pwStrengthMsg.className = 'validation-msg error';
        } else {
            pwStrengthMsg.textContent = '안전한 비밀번호입니다.';
            pwStrengthMsg.className = 'validation-msg success';
        }
    });

    // 비밀번호 일치 확인
    function checkPasswordMatch() {
        if (!pwConfirm.value && !pw.value) {
            pwMatchMsg.textContent = '';
            pwMatchMsg.className = 'validation-msg';
            return;
        }
        if (pw.value !== pwConfirm.value) {
            pwMatchMsg.textContent = '비밀번호가 일치하지 않습니다.';
            pwMatchMsg.className = 'validation-msg error';
        } else {
            pwMatchMsg.textContent = '비밀번호가 일치합니다.';
            pwMatchMsg.className = 'validation-msg success';
        }
    }

    pwConfirm.addEventListener('input', checkPasswordMatch);
    pw.addEventListener('input', checkPasswordMatch);

    // 최종 제출 시 확인(원한다면 비워도 무방)
    document.querySelector('.signup-form').addEventListener('submit', function(e) {
        if (
            pw.value !== pwConfirm.value ||
            pwStrengthMsg.classList.contains('error')
        ) {
            e.preventDefault();
            alert('비밀번호 조건을 확인해 주세요.');
        }
    });
</script>
</body>
</html>
