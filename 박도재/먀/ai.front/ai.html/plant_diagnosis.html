<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UrbanGreen - AI 병충해 진단</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
  <link rel="stylesheet" href="/css/ai/AIDiaStyle.css">
    <link th:href="@{/css/fragments/header.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/footer.css}" rel="stylesheet">
</head>
<body>

<div id="loading-overlay" class="d-none">
  <div class="spinner-border text-success" role="status">
    <span class="visually-hidden">Loading...</span>
  </div>
  <p>AI가 식물을 진단 중입니다. 잠시만 기다려주세요...</p>
</div>

<div th:replace="fragments/header :: header"></div>

<main>
  <section id="hero">
    <div id='hero-text'>
      <h1><i class="fas fa-stethoscope"></i> AI 병충해 진단</h1>
      <p>사진 한 장으로 식물의 건강 상태를 확인하고 맞춤형 치료법을 받아보세요.</p>
    </div>

    <div class="upload-container">
      <div class="custom-file-wrapper">
        <input type="file" id="photoInput" accept="image/*" required>
        <label for="photoInput" class="upload-btn"><i class="fas fa-camera"></i> 사진 선택</label>
        <span id="file-name-display" class="ms-3">선택된 파일 없음</span>
      </div>
      <button type="button" class="upload-btn ms-3" onclick="uploadAndIdentifyPlantID()">
        <i class="fas fa-paper-plane"></i> 진단 요청
      </button>
    </div>
  </section>

  <section id="result" class="hidden">
    <div class="container">
      <h2 class="text-center mb-5">진단 결과</h2>

      <div class="result-container">
        <div class="image-container">
          <h5 class="text-center mb-3">업로드 이미지</h5>
          <img src="https://fakeimg.pl/600x400/?text=Upload%20Image&font=lobster" class="img-fluid" alt="업로드 이미지 미리보기" id='previewImage'>
        </div>

        <div class="info-container">
          <h5 class="text-center mb-4">식물 건강 상태 및 조치 사항</h5>

          <div id='plant-health-status-container' class="alert alert-info"></div>

          <div id="disease-info-card">
            <h6 class="mt-4 mb-3" id="disease-status-title"></h6>

            <div class="d-flex align-items-center mb-3">
              <img src="https://fakeimg.pl/150x100/?text=Disease&font=lobster" class="rounded me-3" alt="질병 유사 이미지" id='plant-similiar-image-with-disease' style="width: 150px; height: auto;">
              <div class="flex-grow-1">
                <div id='plant-disease-name-container'></div>
                <div id='plant-disease-probabilty'></div>
              </div>
            </div>

            <div id='plant-disease-description' class="mb-3"></div>
            <div id='plant-disease-treatment' class="treatment-section"></div>
          </div>
        </div>
      </div>
    </div>
  </section>
</main>

<div th:replace="fragments/footer :: footer"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="/js/ai/AIDiaScript.js"></script>
</body>
</html>
