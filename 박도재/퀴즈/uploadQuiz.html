<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UrbanGreen - 퀴즈 출제</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

    <style>
        /* 강사 테마 색상 */
        :root {
            --bg-page: #f5f6fa;
            --panel: #ffffff;
            --ink-1: #2f3640;
            --ink-2: #4b5563;
            --ink-3: #6b7280;
            --ink-sub: #9aa3af;
            --brand: #A07E68;       /* 부드러운 코코아 브라운 */
            --brand-strong: #85624E;/* 진한 흙색 */
            --brand-light: #F5F0ED; /* 따뜻한 베이지 */
            --brand-text: #6E4D3A;  /* 커피색 */
            --border: #e2ddce;
            --shadow: 0 8px 24px rgba(160, 126, 104, 0.2);
            --radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-page);
            color: var(--ink-1);
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        /* 레이아웃 */
        .mypage-container {
            display: flex;
            align-items: flex-start;
            min-height: 100vh;
            background: var(--bg-page);
            margin-top: 40px;
            gap: 24px;
            padding: 24px;
            box-sizing: border-box;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 사이드바 */
        .sidebar {
            width: 240px;
            background: var(--panel);
            color: var(--ink-1);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 24px;
            align-self: flex-start;
            padding: 12px;
            flex-shrink: 0;
        }
        .sidebar ul li {
            margin: 4px 0;
        }
        .sidebar ul li a {
            display: block;
            padding: 12px 14px;
            color: var(--ink-1);
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
        }
        .sidebar ul li a:hover {
            background: var(--brand);
            color: #fff;
            transform: translateY(-1px);
        }
        .sidebar ul li.active a {
            background: linear-gradient(180deg, var(--brand), var(--brand-strong));
            color: #fff;
        }

        /* 메인 콘텐츠 */
        #mypage-content {
            flex: 1;
            min-width: 0;
        }

        /* 카드 스타일 */
        .intro-card {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            width: 100%;
            box-sizing: border-box;
        }

        .intro-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }
        .intro-head h2 {
            margin: 0;
            font-size: 22px;
            color: var(--ink-1);
        }
        .hint {
            color: var(--ink-sub);
            font-size: 14px;
        }

        /* 강의 제목 표시 영역 */
        .course-title-box {
            background: var(--brand-light);
            border: 1px solid var(--brand);
            padding: 16px;
            border-radius: 10px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .course-title-label {
            font-weight: 700;
            color: var(--brand-strong);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .course-title-input {
            border: none;
            background: transparent;
            font-size: 16px;
            font-weight: 600;
            color: var(--ink-1);
            width: 100%;
            outline: none;
        }

        /* 퀴즈 카드 */
        .quiz-item {
            background: #fefefc;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            transition: 0.2s;
        }
        .quiz-item:focus-within {
            border-color: var(--brand);
            box-shadow: 0 4px 12px rgba(133, 98, 78, 0.25);
            background: #fff9f2;
        }

        .quiz-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--brand-strong);
        }
        .quiz-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand);
        }

        /* 삭제 버튼 스타일 */
        .btn-remove {
            color: #fff;
            background: #c2410c;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            padding: 5px 12px;
            font-weight: 600;
            box-shadow: 0 2px 6px rgba(194, 65, 12, 0.25);
            transition: all 0.2s ease;
        }
        .btn-remove:hover {
            background: #933b06;
            box-shadow: 0 4px 10px rgba(194, 65, 12, 0.35);
            transform: translateY(-1px);
        }
        .btn-remove:active {
            transform: translateY(0);
        }

        /* 입력창 스타일 */
        .form-textarea,
        .form-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            color: var(--ink-1);
            background: #fff;
            outline: none;
            transition: 0.2s;
            display: block;
        }
        .form-textarea {
            min-height: 80px;
            resize: vertical;
            margin-bottom: 12px;
            line-height: 1.5;
        }
        .form-textarea:focus,
        .form-input:focus {
            border-color: var(--brand);
        }

        .answer-box {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }
        .answer-label {
            font-weight: 700;
            color: var(--ink-2);
            font-size: 14px;
            white-space: nowrap;
        }

        /* 버튼 그룹 */
        .quiz-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 30px 0;
        }

        .btn-add {
            width: 100%;
            padding: 14px;
            border: 2px dashed var(--border);
            background: var(--brand-light);
            color: var(--ink-3);
            font-weight: 700;
            border-radius: 12px;
            transition: 0.2s;
        }
        .btn-add:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: #fef7ed;
        }

        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
        }

        .btn-primary {
            background: var(--brand);
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.04s;
        }
        .btn-primary:hover {
            background: var(--brand-strong);
            transform: translateY(-1px);
        }

        .btn-ghost {
            background: transparent;
            border: 1px solid #dbe5ef;
            color: var(--ink-2);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.04s;
        }
        .btn-ghost:hover {
            background: var(--brand-light);
            color: var(--brand-strong);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .mypage-container {
                flex-direction: column;
                padding: 16px;
            }

            .sidebar {
                width: 100%;
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="mypage-container">
        <aside class="sidebar">
            <ul>
                <li><a th:href="@{/teacher/teacherProfile}">내 프로필</a></li>
                <li><a th:href="@{/teacher/teacherEdit}">내 정보 수정</a></li>
                <li class="active"><a th:href="@{/teacher/lectureManage}">강의 관리</a></li>
                <li><a th:href="@{/teacher/teacherPosts}">내 댓글 관리</a></li>
                <li><a th:href="@{/teacher/quizManage}">퀴즈 관리</a></li>
            </ul>
        </aside>

        <div id="mypage-content">
            <div class="intro-card">
                <div class="intro-head">
                    <h2>퀴즈 출제</h2>
                    <span class="hint">수강생들의 이해도를 확인할 퀴즈를 등록하세요.</span>
                </div>

                <!-- 강의 제목 표시 -->
                <div class="course-title-box">
                    <span class="course-title-label">강의 제목 :</span>
                    <input type="text" th:value="${course.courses_name}" readonly id="coursesName" class="course-title-input" />
                </div>

                <form id="quizUploadForm">
                    <input type="hidden" id="coursesId" name="coursesId" />

                    <div id="quizWrapper">
                        <div class="quiz-item">
                            <div class="quiz-header">
                                <span class="quiz-number">Q1.</span>
                            </div>
                            <textarea class="form-textarea" name="quiz_question" placeholder="문제를 입력하세요"></textarea>
                            <div class="answer-box">
                                <span class="answer-label">정답 :</span>
                                <input type="text" class="form-input" name="quiz_result" placeholder="정답을 입력하세요" />
                            </div>
                        </div>
                    </div>

                    <div class="quiz-actions">
                        <button id="addQuiz-btn" type="button" class="btn-add">
                            <i class="fa-solid fa-plus"></i> 문항 추가하기 (최대 5개)
                        </button>
                    </div>

                    <div class="form-footer">
                        <button type="button" class="btn-ghost" onclick="window.history.back()">취소</button>
                        <button id="uploadQuiz-btn" type="submit" class="btn-primary">출제 완료</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script th:inline="javascript">
        const quizWrapper = document.getElementById("quizWrapper");
        const addQuizBtn = document.getElementById("addQuiz-btn");
        const quizUploadForm = document.getElementById("quizUploadForm");

        function getQuizCount() {
            return quizWrapper.querySelectorAll(".quiz-item").length;
        }

        function reorderQuizzes() {
            const items = quizWrapper.querySelectorAll(".quiz-item");
            items.forEach((item, index) => {
                const numberSpan = item.querySelector(".quiz-number");
                if (numberSpan) numberSpan.textContent = `Q${index + 1}.`;
            });
        }

        const pathArray = window.location.pathname.split("/");
        const coursesId = pathArray[pathArray.length - 1];
        const coursesIdInput = document.getElementById("coursesId");
        if (coursesIdInput) coursesIdInput.value = coursesId;

        const coursesNameInput = document.getElementById("coursesName");
        const coursesName = coursesNameInput ? coursesNameInput.value : "";

        addQuizBtn.addEventListener("click", () => {
            const currentCount = getQuizCount();
            if (currentCount >= 5) {
                alert("최대 5문제까지 출제 가능합니다.");
                return;
            }

            const nextNum = currentCount + 1;
            const newCard = document.createElement("div");
            newCard.className = "quiz-item";

            newCard.innerHTML = `
                <div class="quiz-header">
                    <span class="quiz-number">Q${nextNum}.</span>
                    <button type="button" class="btn-remove">삭제</button>
                </div>
                <textarea class="form-textarea" name="quiz_question" placeholder="문제를 입력하세요"></textarea>
                <div class="answer-box">
                    <span class="answer-label">정답 :</span>
                    <input type="text" class="form-input" name="quiz_result" placeholder="정답을 입력하세요">
                </div>
            `;

            newCard.querySelector(".btn-remove").addEventListener("click", function () {
                newCard.remove();
                reorderQuizzes();
            });

            quizWrapper.appendChild(newCard);
            newCard.scrollIntoView({ behavior: "smooth", block: "center" });
        });

        quizUploadForm.addEventListener("submit", function (event) {
            event.preventDefault();

            const formData = new FormData(quizUploadForm);
            const quizzes = [];
            const questions = formData.getAll("quiz_question");
            const results = formData.getAll("quiz_result");

            if (questions.length === 0) {
                alert("최소 1개 이상의 문제를 출제해주세요.");
                return;
            }

            for (let i = 0; i < questions.length; i++) {
                if (!questions[i].trim() || !results[i].trim()) {
                    alert(i + 1 + "번 문제의 질문과 정답을 모두 입력해주세요.");
                    return;
                }
            }

            for (let i = 0; i < questions.length; i++) {
                quizzes.push({
                    coursesId: coursesId,
                    quiz_name: coursesName,
                    quiz_question: questions[i],
                    quiz_result: results[i],
                });
            }

            fetch("/quiz/upload", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(quizzes),
            })
                .then((response) => {
                    if (!response.ok) throw new Error("퀴즈 출제에 실패했습니다.");
                    return response.json();
                })
                .then((data) => {
                    alert("강의 등록 및 퀴즈 출제가 완료되었습니다.");
                    window.location.href = "/course/main";
                })
                .catch((error) => {
                    console.error("Error:", error);
                    alert(error.message);
                });
        });
    </script>
</body>
</html>
