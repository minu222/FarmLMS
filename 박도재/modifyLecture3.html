<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UrbanGreen - 영상 수정</title>

    <!-- 폰트어썸 아이콘 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <!-- 기존 CSS 파일들 -->
    <link rel="stylesheet" th:href="@{/css/main/main.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/teacherMyPage.css}">
    <link rel="stylesheet" th:href="@{/css/teacher/uploadLecture2.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}">
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}">

    <style>
               /* ===== 강사 테마 (Terracotta Brown) ===== */
        :root {
            --bg-page: #f5f6fa;
            --panel: #ffffff;
            --ink-1: #2f3640;
            --ink-2: #4b5563;
            --ink-3: #6b7280;
            --ink-sub: #9aa3af;
            --brand: #A07E68;
            --brand-strong: #85624E;
            --brand-light: #F5F0ED;
            --brand-text: #6E4D3A;
            --border: #e2ddce;
            --shadow: 0 8px 24px rgba(160,126,104,0.2);
            --radius: 12px;
        }

        body {
            margin: 0;
            font-family: 'Pretendard', sans-serif;
            background-color: var(--bg-page);
            color: var(--ink-1);
        }
        a {
            text-decoration: none;
            color: inherit;
        }
        ul {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        button {
            font-family: inherit;
            cursor: pointer;
            border: none;
        }

        /* 레이아웃 */
        .mypage-container {
            display: flex;
            align-items: flex-start;
            min-height: 100vh;
            background: var(--bg-page);
            margin-top: 80px;
            gap: 24px;
            padding: 24px;
            box-sizing: border-box;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 사이드바 */
        .sidebar {
            width: 240px;
            background: var(--panel);
            color: var(--ink-1);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            position: sticky;
            top: 96px;
            align-self: flex-start;
            padding: 12px;
            flex-shrink: 0;
        }
        .sidebar ul li {
            margin: 4px 0;
        }
        .sidebar ul li a {
            display: block;
            padding: 12px 14px;
            border-radius: 10px;
            font-weight: 600;
            transition: 0.2s;
            color: var(--ink-1);
        }
        .sidebar ul li a:hover {
            background: var(--brand);
            color: #fff;
            transform: translateY(-1px);
        }
        .sidebar ul li.active a {
            background: linear-gradient(180deg, var(--brand), var(--brand-strong));
            color: #fff;
        }

        /* 메인 콘텐츠 */
        #mypage-content {
            flex: 1;
            min-width: 0;
        }

        /* 인트로 카드 */
        .intro-card {
            background: var(--panel);
            border-radius: var(--radius);
            padding: 32px;
            box-shadow: var(--shadow);
            width: 100%;
            box-sizing: border-box;
        }
        .intro-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            margin-bottom: 24px;
            border-bottom: 1px solid #eee;
            padding-bottom: 16px;
        }
        .intro-head h2 {
            margin: 0;
            font-size: 22px;
            color: var(--ink-1);
        }
        .hint {
            color: var(--ink-sub);
            font-size: 14px;
        }

        /* 폼 스타일 */
        .form-group {
            margin-bottom: 20px;
        }
        .form-label {
            display: block;
            font-weight: 700;
            color: var(--ink-2);
            margin-bottom: 8px;
            font-size: 15px;
        }
        .form-input {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            font-size: 15px;
            color: var(--ink-1);
            background: #fff;
            outline: none;
            transition: 0.2s;
        }
        .form-input:focus {
            border-color: var(--brand);
        }

        /* 파일 업로드 박스 */
        .file-upload-box {
            width: 100%;
            box-sizing: border-box;
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 30px 20px;
            background: #fbfdff;
            text-align: center;
            transition: 0.2s;
        }
        .file-upload-box:hover {
            border-color: var(--brand);
            background: var(--brand-light);
        }
        .btn-upload-trigger {
            display: inline-block;
            padding: 10px 20px;
            background: #fff;
            color: var(--brand-strong);
            border: 1px solid var(--brand);
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-upload-trigger:hover {
            background: var(--brand);
            color: #fff;
        }
        .file-name-display {
            margin-top: 12px;
            font-size: 14px;
            color: var(--ink-2);
            font-weight: 500;
        }

        /* 영상 아이템 카드 (반복되는 부분) */
        .video-item {
            background: #f8f9fa;
            border: 1px solid var(--border);
            border-radius: var(--radius);
            padding: 24px;
            margin-bottom: 20px;
            position: relative;
            transition: 0.2s;
        }
        .video-item:focus-within {
            border-color: var(--brand);
            box-shadow: 0 4px 12px rgba(133, 98, 78, 0.25);
            background: #fff9f2;
        }
        .video-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            color: var(--brand-strong);
        }
        .video-number {
            font-size: 18px;
            font-weight: 800;
            color: var(--brand);
        }

        /* 삭제 버튼 */
        .btn-remove {
            color: #fff;
            background: #c2410c;
            font-size: 12px;
            border: none;
            border-radius: 6px;
            padding: 5px 12px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(194, 65, 12, 0.25);
            transition: all 0.2s ease;
        }
        .btn-remove:hover {
            background: #933b06;
            transform: translateY(-1px);
        }

        /* 추가 버튼 영역 */
        .video-actions {
            display: flex;
            justify-content: center;
            margin: 24px 0;
        }
        .btn-add {
            width: 100%;
            padding: 14px;
            border: 2px dashed var(--border);
            background: var(--brand-light);
            color: var(--ink-3);
            font-weight: 700;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .btn-add:hover {
            border-color: var(--brand);
            color: var(--brand);
            background: #fef7ed;
        }

        /* 폼 하단 버튼 */
        .form-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px solid #eee;
            padding-top: 20px;
            margin-top: 20px;
        }
        .btn-primary {
            background: var(--brand);
            color: #fff;
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-primary:hover {
            background: var(--brand-strong);
            transform: translateY(-1px);
        }
        .btn-ghost {
            background: transparent;
            border: 1px solid #dbe5ef;
            color: var(--ink-2);
            padding: 12px 24px;
            border-radius: 10px;
            font-weight: 700;
            transition: 0.2s;
        }
        .btn-ghost:hover {
            background: var(--brand-light);
            color: var(--brand-strong);
            transform: translateY(-1px);
        }

        @media (max-width: 768px) {
            .mypage-container {
                flex-direction: column;
                padding: 16px;
            }
            .sidebar {
                width: 100%;
                position: static;
                margin-bottom: 20px;
            }
        }
    </style>
</head>
<body>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<div class="mypage-container">
    <!-- 사이드바 -->
    <aside class="sidebar">
        <ul>
            <li><a th:href="@{/teacher/teacherProfile}">내 프로필</a></li>
            <li><a th:href="@{/teacher/teacherEdit}">내 정보 수정</a></li>
            <li class="active"><a th:href="@{/teacher/lectureManage}">강의 관리</a></li>
            <li><a th:href="@{/teacher/teacherPosts}">내 댓글 관리</a></li>
            <li><a th:href="@{/teacher/quizManage/select}">퀴즈 관리</a></li>
        </ul>
    </aside>

    <!-- 메인 콘텐츠 -->
    <div id="mypage-content">
        <div class="intro-card">
            <div class="intro-head">
                <h2>영상 수정</h2>
                <span class="hint">강의에 포함될 영상 컨텐츠를 수정하세요.</span>
            </div>

            <form id="videoUploadForm" enctype="multipart/form-data">
                <!-- 이전 페이지에서 받은 lectureId -->
                <input type="hidden" id="lectureId" name="lectureId" th:value="${lectureId}" />

                <div id="videoWrapper">
                    <!-- 기본 영상 입력 1개 -->
                    <div class="video-item">
                        <div class="video-header">
                            <span class="video-number">Video 1.</span>
                        </div>
                        <div class="form-group">
                            <label class="form-label">영상 제목</label>
                            <input type="text" name="videoTitle" class="form-input" placeholder="영상 제목 입력" required />
                        </div>
                        <div class="form-group">
                            <label class="form-label">파일 업로드</label>
                            <div class="file-upload-box">
                                <label class="btn-upload-trigger">
                                    <i class="fa-solid fa-video"></i> 파일 선택
                                    <input type="file" name="videoFile" accept="video/*" 
                                           style="display:none" onchange="handleFileSelect(this)" required />
                                </label>
                                <div class="file-name-display">선택된 파일 없음</div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- 영상 추가 버튼 -->
                <div class="video-actions">
                    <button id="addVideoBtn" type="button" class="btn-add">
                        <i class="fa-solid fa-plus"></i> 영상 추가하기 (최대 10개)
                    </button>
                </div>

                <div class="form-footer">
                    <button type="button" class="btn-ghost" onclick="history.back()">이전</button>
                    <button type="submit" class="btn-primary">등록 완료</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- 푸터 -->
<footer th:replace="~{fragments/footerShort :: footerShort}"></footer>

<script>
    const videoWrapper = document.getElementById("videoWrapper");
    const addVideoBtn = document.getElementById("addVideoBtn");

    // 파일명 표시 함수
    function handleFileSelect(input) {
        const file = input.files[0];
        if (file) {
            const display = input.closest('.file-upload-box').querySelector('.file-name-display');
            display.innerText = file.name;
            display.style.color = "#A07E68";
            display.style.fontWeight = "bold";
        }
    }

    // 번호 재정렬 (Video 1, Video 2...)
    function reorderVideos() {
        const items = videoWrapper.querySelectorAll(".video-item");
        items.forEach((item, index) => {
            const num = item.querySelector(".video-number");
            if (num) num.innerText = `Video ${index + 1}.`;
        });
    }

    // 영상 추가 버튼 동작
    addVideoBtn.addEventListener("click", function() {
        const currentCount = videoWrapper.querySelectorAll(".video-item").length;
        if (currentCount >= 10) {
            alert("한 번에 최대 10개까지만 등록 가능합니다.");
            return;
        }

        const nextNum = currentCount + 1;
        const div = document.createElement("div");
        div.className = "video-item";
        div.innerHTML = `
            <div class="video-header">
                <span class="video-number">Video ${nextNum}.</span>
                <button type="button" class="btn-remove">삭제</button>
            </div>
            <div class="form-group">
                <label class="form-label">영상 제목</label>
                <input type="text" name="videoTitle" class="form-input" placeholder="영상 제목 입력" required />
            </div>
            <div class="form-group">
                <label class="form-label">파일 업로드</label>
                <div class="file-upload-box">
                    <label class="btn-upload-trigger">
                        <i class="fa-solid fa-video"></i> 파일 선택
                        <input type="file" name="videoFile" accept="video/*" 
                               style="display:none" onchange="handleFileSelect(this)" required />
                    </label>
                    <div class="file-name-display">선택된 파일 없음</div>
                </div>
            </div>
        `;

        div.querySelector(".btn-remove").addEventListener("click", function() {
            div.remove();
            reorderVideos();
        });

        videoWrapper.appendChild(div);
        div.scrollIntoView({ behavior: "smooth", block: "center" });
    });

    // 폼 제출 (서버 전송)
    document.getElementById("videoUploadForm").addEventListener("submit", function(e) {
        e.preventDefault();
        
        const formData = new FormData(this);
        const btn = this.querySelector("button[type='submit']");
        const originalText = btn.innerText;
        
        btn.disabled = true;
        btn.innerText = "업로드 중...";

        // [주의] 다중 파일 업로드용 컨트롤러 주소로 수정 필요
        fetch('/teacher/lectureManage/video/uploadMulti', { 
            method: 'POST',
            body: formData
        })
        .then(res => {
            if (!res.ok) throw new Error("업로드 실패");
            return res.text();
        })
        .then(() => {
            alert("모든 영상이 등록되었습니다.");
            window.location.href = "/teacher/lectureManage";
        })
        .catch(err => {
            console.error(err);
            alert("오류가 발생했습니다.");
            btn.disabled = false;
            btn.innerText = originalText;
        });
    });
</script>
</body>
</html>
