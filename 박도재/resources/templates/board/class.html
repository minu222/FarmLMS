<!-- ========== 페이지 헤더 ========== -->

        <p>귀농을 위한 다양한 작물재배 강의를 만나보세요</p>

<!-- ========== 필터 섹션 ========== -->
<section class="filter-section">
    <div class="filter-container">
        <div class="search-row">
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="강의 검색..." id="searchInput">
            </div>
        </div>

        <div class="filter-row">
            <!-- 난이도 필터 -->
            <button class="filter-tag active" data-level="all">전체</button>
            <button class="filter-tag" data-level="beginner">초급</button>
            <button class="filter-tag" data-level="intermediate">중급</button>
            <button class="filter-tag" data-level="advanced">고급</button>

            <!-- 구분선 -->
            <div class="filter-divider"></div>

            <!-- 카테고리 필터 -->
            <button class="filter-tag active" data-category="all">전체</button>
            <button class="filter-tag" data-category="grain">곡물</button>
            <button class="filter-tag" data-category="vegetable">채소</button>
            <button class="filter-tag" data-category="fruit">과일</button>
            <button class="filter-tag" data-category="herb">약초</button>
            <button class="filter-tag" data-category="smartfarm">스마트팜</button>
        </div>
    </div>
</section>

<!-- ========== 강의 목록 ========== -->
<section class="courses-content">
    <div class="courses-header">
        <div class="courses-count">
            총 <strong id="courseCount">18</strong>개의 강의
        </div>
        <select class="sort-select" id="sortSelect">
            <option value="newest">최신순</option>
            <option value="price-low">가격 낮은순</option>
            <option value="price-high">가격 높은순</option>
        </select>
    </div>

    <div class="courses-grid" id="coursesGrid">
        <!-- JavaScript로 동적 생성 -->
    </div>

    <!-- ========== 페이지네이션 ========== -->
    <div class="pagination" id="pagination">
        <!-- JavaScript로 동적 생성 -->
    </div>
</section>

<!-- ========== 푸터 ========== -->

        <div class="footer-links">
            <h4>서비스</h4>
            <ul class="service-list">
                <li><a href="http://127.0.0.1:5500/board/class.html">강의</a></li>
                <li><a href="http://127.0.0.1:5500/board//notice.html">공지사항</a></li>
                <li><a href="http://127.0.0.1:5500/board/chat.html">채팅</a></li>
                <li><a href="/AI/aichoice.html">AI</a></li>
                <li><a href="/main/game.html">게임</a></li>
            </ul>
        </div>

        <div class="footer-links">
            <h4>고객지원</h4>
            <ul>
                <li><a href="http://127.0.0.1:5500/main/faq.html">FAQ</a></li>
                <li><a href="http://127.0.0.1:5500/main/terms.html">이용약관</a></li>
                <li><a href="http://127.0.0.1:5500/main/privacy.html">개인정보처리방침</a></li>
            </ul>

    </div>

    <div class="footer-bottom">
        <p>
            대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
            연락처: 0507-1422-2402 |
            © 2025 UrbanGreen. All rights reserved.
        </p>
    </div>
</footer>

<script>
    // 헤더 스크롤 효과
    window.addEventListener('scroll', () => {
        const header = document.getElementById('header');
        if (window.scrollY > 50) {
            header.classList.add('scrolled');
        } else {
            header.classList.remove('scrolled');
        }
    });

    // 로그인 상태 (true: 로그인, false: 비로그인)
    const isLoggedIn = false; // true/false로 변경

    // 전체 강의 데이터
    const allCourses = [
        { id: 1, level: 'beginner', category: 'seed', title: '벼농사 시작하기', desc: '벼농사의 기초부터 수확까지', instructor: '김농부', price: 49000, progress: 65 },
        { id: 2, level: 'beginner', category: 'grow', title: '상추 재배 입문', desc: '베란다에서 쉽게 키우는 상추', instructor: '이채소', price: 0, progress: 100 },
        { id: 3, level: 'intermediate', category: 'grow', title: '딸기 재배 중급', desc: '수확량을 늘리는 노하우', instructor: '박딸기', price: 89000, progress: 30 },
        { id: 4, level: 'intermediate', category: 'grow', title: '약초 재배 가이드', desc: '건강한 약초 키우기', instructor: '최약초', price: 69000, progress: 0 },
        { id: 5, level: 'beginner', category: 'grow', title: '옥수수 재배', desc: '초보자를 위한 옥수수 농사', instructor: '강옥수', price: 39000, progress: 80 },
        { id: 6, level: 'intermediate', category: 'grow', title: '토마토 재배 실전', desc: '맛있는 토마토 키우기', instructor: '윤토마', price: 59000, progress: 20 },
        { id: 7, level: 'beginner', category: 'grow', title: '포도 재배 기초', desc: '포도나무 관리의 시작', instructor: '임포도', price: 0, progress: 55 },
        { id: 8, level: 'advanced', category: 'grow', title: '오이 대량 재배', desc: '상업용 오이 재배 노하우', instructor: '한오이', price: 99000, progress: 0 },
    ];

    const ITEMS_PER_PAGE = 6;
    let currentPage = 1;
    let filteredCourses = [...allCourses];
    let currentLevel = 'all';
    let currentCategory = 'all';
    let currentSearch = '';

    // DOM 요소
    const levelTags = document.querySelectorAll('[data-level]');
    const categoryTags = document.querySelectorAll('[data-category]');
    const searchInput = document.getElementById('searchInput');
    const sortSelect = document.getElementById('sortSelect');
    const courseCount = document.getElementById('courseCount');

    // 이벤트 리스너
    levelTags.forEach(tag => {
        tag.addEventListener('click', () => {
            levelTags.forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            currentLevel = tag.dataset.level;
            currentPage = 1;
            filterAndRenderCourses();
        });
    });

    categoryTags.forEach(tag => {
        tag.addEventListener('click', () => {
            categoryTags.forEach(t => t.classList.remove('active'));
            tag.classList.add('active');
            currentCategory = tag.dataset.category;
            currentPage = 1;
            filterAndRenderCourses();
        });
    });

    searchInput.addEventListener('input', (e) => {
        currentSearch = e.target.value.toLowerCase();
        currentPage = 1;
        filterAndRenderCourses();
    });

    sortSelect.addEventListener('change', () => {
        sortCourses();
        renderCourses();
    });

    // 필터링 및 렌더링
    function filterAndRenderCourses() {
        filteredCourses = allCourses.filter(course => {
            const levelMatch = currentLevel === 'all' || course.level === currentLevel;
            const categoryMatch = currentCategory === 'all' || course.category === currentCategory;
            const searchMatch = !currentSearch ||
                course.title.toLowerCase().includes(currentSearch) ||
                course.desc.toLowerCase().includes(currentSearch);

            return levelMatch && categoryMatch && searchMatch;
        });

        courseCount.textContent = filteredCourses.length;
        sortCourses();
        renderCourses();
        renderPagination();
    }

    // 정렬
    function sortCourses() {
        const sortType = sortSelect.value;
        filteredCourses.sort((a, b) => {
            if (sortType === 'price-low') return a.price - b.price;
            if (sortType === 'price-high') return b.price - a.price;
            return 0;
        });
    }

    // 강의 카드 렌더링
    function renderCourses() {
        const grid = document.getElementById('coursesGrid');
        const start = (currentPage - 1) * ITEMS_PER_PAGE;
        const end = start + ITEMS_PER_PAGE;
        const coursesToShow = filteredCourses.slice(start, end);

        grid.innerHTML = coursesToShow.map(course => `
                <div class="course-card">
                    <div class="course-thumbnail">${course.icon}</div>
                    <div class="course-info">
                        <div class="course-category">${getLevelText(course.level)} • ${getCategoryText(course.category)}</div>
                        <div class="course-title-row">
                            <h3 class="course-title">${course.title}</h3>
                            <span class="course-instructor-inline">👤 ${course.instructor}</span>
                        </div>
                        <p class="course-description">${course.desc}</p>
                        ${isLoggedIn ? `
                            <div class="course-progress">
                                <div class="progress-label">
                                    <span class="progress-text">학습 진도</span>
                                    <span class="progress-percent">${course.progress}%</span>
                                </div>
                                <div class="progress-bar-container">
                                    <div class="progress-bar-fill" style="width: ${course.progress}%"></div>
                                </div>
                            </div>
                            <div class="course-meta-logged-in">
                                <span class="${course.price === 0 ? 'course-price-free' : 'course-price'}">
                                    ${course.price === 0 ? '무료' : '₩' + course.price.toLocaleString()}
                                </span>
                            </div>
                        ` : `
                            <div class="course-meta-logged-out">
                                <span class="${course.price === 0 ? 'course-price-free' : 'course-price'}">
                                    ${course.price === 0 ? '무료' : '₩' + course.price.toLocaleString()}
                                </span>
                                <button class="subscribe-btn">구독하기</button>
                            </div>
                        `}
                    </div>
                </div>
            `).join('');
    }

    // 페이지네이션 렌더링
    function renderPagination() {
        const pagination = document.getElementById('pagination');
        const totalPages = Math.ceil(filteredCourses.length / ITEMS_PER_PAGE);

        if (totalPages <= 1) {
            pagination.innerHTML = '';
            return;
        }

        let paginationHTML = '';

        // 이전 버튼
        paginationHTML += `
                <button class="pagination-btn ${currentPage === 1 ? 'disabled' : ''}"
                        onclick="goToPage(${currentPage - 1})"
                        ${currentPage === 1 ? 'disabled' : ''}>
                    ◀
                </button>
            `;

        // 페이지 번호
        const maxVisible = 5;
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + maxVisible - 1);

        if (endPage - startPage < maxVisible - 1) {
            startPage = Math.max(1, endPage - maxVisible + 1);
        }

        if (startPage > 1) {
            paginationHTML += `<button class="pagination-btn" onclick="goToPage(1)">1</button>`;
            if (startPage > 2) {
                paginationHTML += `<span class="pagination-ellipsis">...</span>`;
            }
        }

        for (let i = startPage; i <= endPage; i++) {
            paginationHTML += `
                    <button class="pagination-btn ${i === currentPage ? 'active' : ''}"
                            onclick="goToPage(${i})">
                        ${i}
                    </button>
                `;
        }

        if (endPage < totalPages) {
            if (endPage < totalPages - 1) {
                paginationHTML += `<span class="pagination-ellipsis">...</span>`;
            }
            paginationHTML += `<button class="pagination-btn" onclick="goToPage(${totalPages})">${totalPages}</button>`;
        }

        // 다음 버튼
        paginationHTML += `
                <button class="pagination-btn ${currentPage === totalPages ? 'disabled' : ''}"
                        onclick="goToPage(${currentPage + 1})"
                        ${currentPage === totalPages ? 'disabled' : ''}>
                    ▶
                </button>
            `;

        pagination.innerHTML = paginationHTML;
    }

    // 페이지 이동
    function goToPage(page) {
        const totalPages = Math.ceil(filteredCourses.length / ITEMS_PER_PAGE);
        if (page < 1 || page > totalPages) return;

        currentPage = page;
        renderCourses();
        renderPagination();
    }

    // 난이도/카테고리 텍스트 변환
    function getLevelText(level) {
        const levels = { beginner: '초급', intermediate: '중급', advanced: '고급' };
        return levels[level] || level;
    }

    function getCategoryText(category) {
            const categories = {
                seed: '모종',
                grow: '재배',
                ship: '출하'
            };
        return categories[category] || category;
    }

    // 초기 렌더링
    filterAndRenderCourses();
</script>
</body>
</html>
