<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 로그인</title>
    <link rel="stylesheet" href="/css/login.css">
    <link rel="stylesheet" href="/css/footerShort.css">
</head>

<body>
<!-- 로고 헤더 -->
<div class="logo-header">
    <a href="/main/urbangreen.html" class="logo">UrbanGreen</a>
</div>

<!-- 메인 컨테이너 -->
<div class="main-container">
    <div class="login-card">
        <div class="login-header">
            <h1>로그인</h1>
            <p>작물재배의 여정을 시작하세요</p>
        </div>

        <form>
            <div class="form-group">
                <label for="username">아이디</label>
                <input type="text" id="username" placeholder="아이디를 입력하세요" required>
            </div>

            <div class="form-group">
                <label for="password">비밀번호</label>
                <input type="password" id="password" placeholder="비밀번호를 입력하세요" required>
            </div>

            <button type="submit" class="login-btn">로그인</button>
        </form>

        <div class="links-section">
            <div class="auth-links">
                <a href="findId.html">아이디 찾기</a>
                <span>|</span>
                <a href="findPassword.html">비밀번호 찾기</a>
            </div>

            <div class="signup-prompt">
                아직 회원이 아니신가요?
                <a href="signup.html">회원가입</a>
            </div>
        </div>
    </div>
</div>

<!-- 푸터 -->
<footer>
    <p>
        대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
        연락처: 0507-1422-2402 |
        © 2025 UrbanGreen. All rights reserved.
    </p>
</footer>

<script>
    // 폼 제출
    document.querySelector('form').addEventListener('submit', function (e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (username && password) {
            alert('로그인 성공!');
            window.location.href = '/main/urbangreen.html';
        }
    });
</script>
</body>

</html>
