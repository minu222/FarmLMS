<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>UrbanGreen - 아이디 찾기</title>
    <link rel="stylesheet" href="/css/account/findId.css">
    <link rel="stylesheet" href="/css/footerShort.css">
</head>

<body>
<!-- 로고 헤더 -->
<div class="logo-header">
    <a class="logo" href="/main/urbangreen.html">UrbanGreen</a>
</div>

<!-- 메인 컨테이너 -->
<div class="main-container">
    <div class="find-card">
        <div class="find-header">
            <h1>아이디 찾기</h1>
            <p>가입 시 등록한 정보로 찾을 수 있어요</p>
        </div>

        <!-- 이메일로 찾기 -->
        <form id="emailForm">
            <div class="form-group">
                <label for="name1">이름</label>
                <input id="name1" placeholder="이름을 입력하세요" required type="text">
            </div>

            <div class="form-group">
                <label for="email">이메일</label>
                <input id="email" placeholder="example@email.com" required type="email">
            </div>

            <button class="find-btn" type="submit">아이디 찾기</button>
        </form>

        <!-- 결과 영역 -->
        <div class="result-section" id="resultSection">
            <div class="result-title">회원님의 아이디를 찾았습니다</div>
            <div class="result-id">youngfarmer123</div>
            <div class="result-date">가입일: 2024-03-15</div>
        </div>
    </div>
</div>

<!-- 푸터 -->
<footer>
    <p>
        대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
        연락처: 0507-1422-2402 |
        © 2025 UrbanGreen. All rights reserved.
    </p>
</footer>

<script>
    // 탭 전환
    function showTab(tab) {
        const emailForm = document.getElementById('emailForm');
        const nicknameForm = document.getElementById('nicknameForm');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const resultSection = document.getElementById('resultSection');

        // 결과 숨기기
        resultSection.classList.remove('show');

        // 이메일로 찾기
        document.getElementById('emailForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const name = document.getElementById('name1').value;
            const email = document.getElementById('email').value;

            if (name && email) {
                // 실제로는 서버 API 호출
                document.getElementById('resultSection').classList.add('show');
            }
        });
    }
</script>
</body>

</html>
