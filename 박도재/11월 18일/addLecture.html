<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 강의 등록</title>
    <link rel="stylesheet" th:href="@{/css/teacher/addLecture.css}">
    <link th:href="@{/css/fragments/header.css}" rel="stylesheet">
    <link th:href="@{/css/fragments/footer.css}" rel="stylesheet">
</head>
<body>

<!-- 헤더 -->
<div th:replace="~{fragments/header :: header}"></div>

<!-- 메인 컨테이너 -->
<main class="main-container">
    <div class="page-header">
        <h1>강의 등록</h1>
        <p>새로운 강의를 등록해주세요.</p>
    </div>

    <form class="lecture-form" id="lectureForm" enctype="multipart/form-data">
        <div class="form-group">
            <label for="title">강의명</label>
            <input type="text" id="title" placeholder="예) 스마트팜 딸기 완전정복" required maxlength="100">
        </div>

        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" required>
                <option value="">선택하세요</option>
                <option value="vegetable_gardening">텃밭가꾸기</option>
                <option value="indoor_garden">실내정원</option>
            </select>
        </div>

        <div class="form-group">
            <label for="desc">강의 설명</label>
            <textarea id="desc" placeholder="강의의 주요 내용, 특징, 대상 등 자세히 입력해 주세요." required></textarea>
        </div>

        <div class="form-group">
            <label>썸네일 이미지 업로드</label>
            <div class="file-upload-wrapper">
                <label for="thumbUpload" class="file-upload-btn">📷 이미지 선택</label>
                <input type="file" id="thumbUpload" class="file-upload-input" accept="image/*" required>
                <div class="file-list" id="fileList" aria-live="polite"></div>
            </div>
        </div>

        <div class="button-group">
            <a href="/main/class.html" class="btn btn-secondary">취소</a>
            <button type="submit" class="btn btn-primary">등록</button>
        </div>
    </form>
</main>

<footer th:replace="fragments/footer :: footer"></footer>

<script>
    const thumbInput = document.getElementById('thumbUpload');
    const fileListEl = document.getElementById('fileList');

    thumbInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        fileListEl.innerHTML = ''; // 하나만 업로드
        if (file) {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.innerHTML = `<span class="file-name">📷 ${file.name} (${(file.size/1024).toFixed(1)}KB)</span>
                          <button type="button" class="file-remove" aria-label="삭제">✕</button>`;
            fileListEl.appendChild(item);
            item.querySelector('.file-remove').onclick = () => {
                thumbInput.value='';
                fileListEl.innerHTML = '';
            };
        }
    });

    // 폼 제출 예시(실사용 시 AJAX로 대체)
    document.getElementById('lectureForm').addEventListener('submit', function(e){
        e.preventDefault();
        const title = document.getElementById('title').value.trim();
        const category = document.getElementById('category').value;
        const desc = document.getElementById('desc').value.trim();
        if (!title || !category || !desc) {
            alert('[translate:모든 필수 항목을 입력해주세요.]');
            return;
        }
        alert('[translate:강의가 등록되었습니다!]');
        window.location.href = '/main/class.html';
    });
</script>
</body>
</html>
