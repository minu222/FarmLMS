<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 공지사항 수정</title>
    <link rel="stylesheet" th:href="@{/css/admin/modifyNotice.css}" />
    <link rel="stylesheet" th:href="@{/css/fragments/header.css}" />
    <link rel="stylesheet" th:href="@{/css/fragments/footerShort.css}" />
</head>

<body>
<!-- 헤더 -->
<div th:replace="fragments/header :: header"></div>

<!-- 메인 컨테이너 -->
<main class="main-container">
    <!-- 페이지 헤더 -->
    <div class="page-header">
        <h1>공지사항 수정</h1>
        <p>공지할 내용을 수정해주세요</p>
    </div>

    <!-- 작성 폼 -->
    <form class="write-form" id="writeForm" enctype="multipart/form-data">
        <!-- 카테고리 -->
        <div class="form-group">
            <label for="category">카테고리</label>
            <select id="category" required>
                <option value="">선택하세요</option>
                <option value="fixedNotice">고정 공지</option>
                <option value="freeNotice">자유 공지</option>
            </select>
        </div>

        <!-- 제목 -->
        <div class="form-group">
            <label for="title">제목</label>
            <input type="text" id="title" placeholder="제목을 입력하세요" required maxlength="100">
        </div>

        <!-- 내용 -->
        <div class="form-group">
            <label for="content">내용</label>
            <textarea id="content" placeholder="내용을 입력하세요" required></textarea>
        </div>

        <!-- 파일 첨부 -->
        <div class="form-group">
            <label>파일 첨부</label>
            <div class="file-upload-wrapper">
                <label for="fileUpload" class="file-upload-btn">📎 파일 선택</label>
                <input type="file" id="fileUpload" class="file-upload-input" multiple
                       accept="image/*,.pdf,.doc,.docx">
                <div class="file-list" id="fileList" aria-live="polite"></div>
            </div>
        </div>

        <!-- 버튼 -->
        <div class="button-group">
            <a href="/post/free-board.html" class="btn btn-secondary">취소</a>
            <button type="submit" class="btn btn-primary">등록</button>
        </div>
    </form>
</main>
<footer th:replace="fragments/footerShort :: footerShort"></footer>


<script>
    // ===== 업로드 제한 설정 =====
    const MAX_FILES = 10;     // 최대 업로드 개수
    const MAX_TOTAL_MB = 50;  // 총 업로드 용량 제한
    const MAX_FILE_MB = 10;   // 개별 파일 제한 (기존 유지)

    // ===== 상태 & 엘리먼트 =====
    let filesState = []; // { id, file }
    let seq = 0;         // 고유 id 발급용

    const fileInput = document.getElementById('fileUpload');
    const fileListEl = document.getElementById('fileList');

    // ===== 유틸 =====
    function formatKB(bytes) {
        return (bytes / 1024).toFixed(1) + 'KB';
    }
    function totalBytes() {
        return filesState.reduce((sum, f) => sum + f.file.size, 0);
    }

    // ===== 파일 목록 렌더링 (안전하게 생성) =====
    function renderFileList() {
        fileListEl.innerHTML = '';
        const frag = document.createDocumentFragment();

        filesState.forEach(({ id, file }) => {
            const item = document.createElement('div');
            item.className = 'file-item';
            item.dataset.id = id;

            const nameSpan = document.createElement('span');
            nameSpan.className = 'file-name';
            nameSpan.textContent = `📄 ${file.name} (${formatKB(file.size)})`;

            const removeBtn = document.createElement('button');
            removeBtn.type = 'button';
            removeBtn.className = 'file-remove';
            removeBtn.dataset.id = id;
            removeBtn.setAttribute('aria-label', `${file.name} 삭제`);
            removeBtn.textContent = '✕';

            item.appendChild(nameSpan);
            item.appendChild(removeBtn);
            frag.appendChild(item);
        });

        fileListEl.appendChild(frag);
    }

    // ===== 업로드 핸들러 =====
    fileInput.addEventListener('change', (e) => {
        const incoming = Array.from(e.target.files);

        // 1) 개별 파일 크기 제한
        const tooBig = incoming.find(f => f.size > MAX_FILE_MB * 1024 * 1024);
        if (tooBig) {
            alert(`${tooBig.name}은(는) ${MAX_FILE_MB}MB를 초과합니다.`);
            e.target.value = '';
            return;
        }

        // 2) 개수 제한
        if (filesState.length + incoming.length > MAX_FILES) {
            alert(`최대 ${MAX_FILES}개까지만 첨부할 수 있습니다.`);
            e.target.value = '';
            return;
        }

        // 3) 총 용량 제한
        const incomingBytes = incoming.reduce((sum, f) => sum + f.size, 0);
        if (totalBytes() + incomingBytes > MAX_TOTAL_MB * 1024 * 1024) {
            alert(`총 첨부 용량은 ${MAX_TOTAL_MB}MB를 초과할 수 없습니다.`);
            e.target.value = '';
            return;
        }

        // 4) 상태에 추가(고유 id 부여)
        incoming.forEach(file => {
            filesState.push({ id: String(++seq), file });
        });

        renderFileList();
        e.target.value = ''; // 동일 파일 다시 선택 가능하도록 초기화
    });

    // ===== 삭제(이벤트 위임으로 정확 식별) =====
    fileListEl.addEventListener('click', (e) => {
        const btn = e.target.closest('.file-remove');
        if (!btn) return;
        const id = btn.dataset.id;
        filesState = filesState.filter(f => f.id !== id);
        renderFileList();
    });

    // ===== 폼 제출 =====
    document.getElementById('writeForm').addEventListener('submit', function (e) {
        e.preventDefault();

        const category = document.getElementById('category').value.trim();
        const title = document.getElementById('title').value.trim();
        const content = document.getElementById('content').value.trim();

        if (!category || !title || !content) {
            alert('모든 필수 항목을 입력해주세요.');
            return;
        }

        const formData = new FormData();
        formData.append('category', category);
        formData.append('title', title);
        formData.append('content', content);
        filesState.forEach(({ file }) => formData.append('files', file));

        // 실제 서버 연동 예시:
        // fetch('/api/notices', { method: 'POST', body: formData })
        //   .then(res => {
        //     if (!res.ok) throw new Error('등록 실패');
        //     return res.json();
        //   })
        //   .then(() => {
        //     alert('게시글이 작성되었습니다!');
        //     window.location.href = '/post/free-board.html';
        //   })
        //   .catch(err => alert(err.message));

        // 데모 동작
        alert('게시글이 작성되었습니다!');
        window.location.href = '/post/free-board.html';
    });
</script>
</body>

</html>
