<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 아이디 찾기</title>
    <style>
        :root {
            --primary: #5cb85f;
            --primary-dark: #4caf50;
            --primary-light: #70c373;
            --gray: #757575;
            --light-gray: #f5f3ed;
            --cream: #fcfbf8;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* 로고 헤더 */
        .logo-header {
            padding: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-decoration: none;
        }

        /* 메인 컨테이너 */
        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .find-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(92, 184, 95, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .find-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .find-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .find-header p {
            color: var(--gray);
            font-size: 1rem;
        }

        /* 탭 메뉴 */
        .tab-menu {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 2rem;
            background: var(--light-gray);
            border-radius: 12px;
            padding: 0.5rem;
        }

        .tab-btn {
            flex: 1;
            padding: 0.8rem;
            background: transparent;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--gray);
            cursor: pointer;
            transition: all 0.3s;
        }

        .tab-btn.active {
            background: white;
            color: var(--primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        /* 폼 그룹 */
        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light-gray);
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(92, 184, 95, 0.1);
            outline: none;
            background: white;
        }

        /* 찾기 버튼 */
        .find-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.3);
            margin-bottom: 1rem;
        }

        .find-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(92, 184, 95, 0.4);
        }

        /* 결과 영역 */
        .result-section {
            display: none;
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .result-section.show {
            display: block;
        }

        .result-title {
            font-weight: 600;
            margin-bottom: 1rem;
            color: var(--text);
        }

        .result-id {
            background: white;
            padding: 1rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--primary);
            text-align: center;
            margin-bottom: 1rem;
        }

        .result-date {
            font-size: 0.9rem;
            color: var(--gray);
            text-align: center;
        }

        /* 링크 섹션 */
        .links-section {
            display: flex;
            gap: 1rem;
            justify-content: center;
        }

        .links-section a {
            color: var(--gray);
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.3s;
        }

        .links-section a:hover {
            color: var(--primary);
        }

        .links-section span {
            color: var(--gray);
        }

        /* 푸터 */
        footer {
            background: #2d3436;
            color: white;
            padding: 2rem 3rem;
            text-align: center;
            margin-top: 5rem;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin: 0;
        }

        footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <!-- 로고 헤더 -->
    <div class="logo-header">
        <a href="/main/urbangreen.html" class="logo">UrbanGreen</a>
    </div>

    <!-- 메인 컨테이너 -->
    <div class="main-container">
        <div class="find-card">
            <div class="find-header">
                <h1>아이디 찾기</h1>
                <p>가입 시 등록한 정보로 찾을 수 있어요</p>
            </div>

            <!-- 이메일로 찾기 -->
            <form id="emailForm">
                <div class="form-group">
                    <label for="name1">이름</label>
                    <input type="text" id="name1" placeholder="이름을 입력하세요" required>
                </div>

                <div class="form-group">
                    <label for="email">이메일</label>
                    <input type="email" id="email" placeholder="example@email.com" required>
                </div>

                <button type="submit" class="find-btn">아이디 찾기</button>
            </form>

            <!-- 결과 영역 -->
            <div class="result-section" id="resultSection">
                <div class="result-title">회원님의 아이디를 찾았습니다</div>
                <div class="result-id">youngfarmer123</div>
                <div class="result-date">가입일: 2024-03-15</div>
            </div>
        </div>
    </div>

    <!-- 푸터 -->
    <footer>
        <p>
            대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
            연락처: 0507-1422-2402 |
            © 2025 UrbanGreen. All rights reserved.
        </p>
    </footer>

    <script>
        // 탭 전환
        function showTab(tab) {
            const emailForm = document.getElementById('emailForm');
            const nicknameForm = document.getElementById('nicknameForm');
            const tabBtns = document.querySelectorAll('.tab-btn');
            const resultSection = document.getElementById('resultSection');

            // 결과 숨기기
            resultSection.classList.remove('show');

            // 이메일로 찾기
            document.getElementById('emailForm').addEventListener('submit', function (e) {
                e.preventDefault();
                const name = document.getElementById('name1').value;
                const email = document.getElementById('email').value;

                if (name && email) {
                    // 실제로는 서버 API 호출
                    document.getElementById('resultSection').classList.add('show');
                }
            });
    </script>
</body>

</html>
