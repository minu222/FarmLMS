<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UrbanGreen - 결제하기</title>
    <style>
        :root {
            --primary: #5cb85f;
            --primary-dark: #4caf50;
            --primary-light: #70c373;
            --gray: #757575;
            --light-gray: #f5f3ed;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(92, 184, 95, 0.1);
        }

        .header-container {
            max-width: 1400px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
        }

        .main-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 8rem 3rem 5rem;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 3rem;
        }

        /* 결제 정보 */
        .payment-form {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 3rem;
            border: 1px solid rgba(92, 184, 95, 0.1);
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px solid var(--light-gray);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.5rem;
            color: var(--text);
        }

        .form-group input {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light-gray);
            transition: all 0.3s;
        }

        .form-group input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(92, 184, 95, 0.1);
            outline: none;
            background: white;
        }

        /* 결제 수단 */
        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .payment-method {
            padding: 1.5rem;
            background: var(--light-gray);
            border: 2px solid transparent;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }

        .payment-method:hover {
            background: rgba(92, 184, 95, 0.1);
        }

        .payment-method.selected {
            background: rgba(92, 184, 95, 0.2);
            border-color: var(--primary);
        }

        .payment-method-icon {
            font-size: 2rem;
            margin-bottom: 0.5rem;
        }

        .payment-method-name {
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* 카드 정보 */
        .card-info {
            display: none;
        }

        .card-info.show {
            display: block;
        }

        .card-row {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1rem;
        }

        /* 약관 동의 */
        .terms-agreement {
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .checkbox-item:last-child {
            margin-bottom: 0;
        }

        .checkbox-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-item label {
            cursor: pointer;
            flex: 1;
        }

        .checkbox-item a {
            color: var(--primary);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .checkbox-item a:hover {
            text-decoration: underline;
        }

        /* 결제 버튼 */
        .payment-button {
            width: 100%;
            padding: 1.5rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.3);
        }

        .payment-button:hover:not(:disabled) {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(92, 184, 95, 0.4);
        }

        .payment-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 주문 요약 */
        .order-summary {
            position: sticky;
            top: 8rem;
            height: fit-content;
        }

        .summary-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            border: 1px solid rgba(92, 184, 95, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.08);
        }

        .summary-title {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
        }

        .plan-info {
            background: var(--light-gray);
            padding: 1.5rem;
            border-radius: 12px;
            margin-bottom: 1.5rem;
        }

        .plan-name-display {
            font-size: 1.2rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
        }

        .plan-billing {
            color: var(--gray);
            font-size: 0.9rem;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 1rem 0;
            border-bottom: 1px solid var(--light-gray);
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-label {
            color: var(--gray);
        }

        .summary-value {
            font-weight: 600;
        }

        .summary-total {
            margin-top: 1rem;
            padding-top: 1rem;
            border-top: 2px solid var(--primary);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .total-label {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .total-amount {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary);
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 1rem;
            background: rgba(92, 184, 95, 0.1);
            border-radius: 8px;
            color: var(--primary);
            font-size: 0.9rem;
        }

        footer {
            background: var(--text);
            color: white;
            padding: 3rem;
            text-align: center;
            margin-top: 5rem;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
        }

        @media (max-width: 1024px) {
            .main-container {
                grid-template-columns: 1fr;
            }

            .order-summary {
                position: static;
            }
        }

        @media (max-width: 768px) {
            .main-container {
                padding: 6rem 2rem 3rem;
            }

            .payment-form {
                padding: 2rem;
            }

            .payment-methods {
                grid-template-columns: 1fr;
            }

            .card-row {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-container">
            <a href="/main/urbangreen.html" class="logo">UrbanGreen</a>
        </div>
    </header>

    <div class="main-container">
        <!-- 결제 정보 입력 -->
        <div class="payment-form">
            <h2 class="section-title">💳 결제 정보</h2>

            <!-- 결제 수단 선택 -->
            <div class="form-group">
                <label>결제 수단</label>
                <div class="payment-methods">
                    <div class="payment-method selected" onclick="selectPaymentMethod('card')">
                        <div class="payment-method-icon">💳</div>
                        <div class="payment-method-name">신용/체크카드</div>
                    </div>
                    <div class="payment-method" onclick="selectPaymentMethod('kakaopay')">
                        <div class="payment-method-icon">💬</div>
                        <div class="payment-method-name">카카오페이</div>
                    </div>
                    <div class="payment-method" onclick="selectPaymentMethod('naverpay')">
                        <div class="payment-method-icon">N</div>
                        <div class="payment-method-name">네이버페이</div>
                    </div>
                </div>
            </div>

            <!-- 카드 정보 입력 -->
            <div class="card-info show" id="cardInfo">
                <div class="form-group">
                    <label>카드 번호</label>
                    <input type="text" placeholder="0000-0000-0000-0000" maxlength="19" id="cardNumber">
                </div>

                <div class="card-row">
                    <div class="form-group">
                        <label>유효기간</label>
                        <input type="text" placeholder="MM/YY" maxlength="5" id="cardExpiry">
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <input type="text" placeholder="000" maxlength="3" id="cardCvc">
                    </div>
                </div>

                <div class="form-group">
                    <label>카드 소유자명</label>
                    <input type="text" placeholder="홍길동" id="cardHolder">
                </div>
            </div>

            <!-- 구매자 정보 -->
            <h2 class="section-title" style="margin-top: 2rem;">👤 구매자 정보</h2>
            
            <div class="form-group">
                <label>이름</label>
                <input type="text" value="홍길동" id="buyerName">
            </div>

            <div class="form-group">
                <label>이메일</label>
                <input type="email" value="hong@example.com" id="buyerEmail">
            </div>

            <div class="form-group">
                <label>연락처</label>
                <input type="tel" value="010-1234-5678" id="buyerPhone">
            </div>

            <!-- 약관 동의 -->
            <div class="terms-agreement">
                <div class="checkbox-item">
                    <input type="checkbox" id="agreeAll" onchange="toggleAllAgreements()">
                    <label for="agreeAll"><strong>전체 약관에 동의합니다</strong></label>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree1" required>
                    <label for="agree1">[필수] 이용약관 동의</label>
                    <a href="/terms.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree2" required>
                    <label for="agree2">[필수] 개인정보 수집 및 이용 동의</label>
                    <a href="/privacy.html" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree3" required>
                    <label for="agree3">[필수] 구독 정책 동의</label>
                    <a href="#" target="_blank">보기</a>
                </div>
                <div class="checkbox-item">
                    <input type="checkbox" class="agreement-item" id="agree4">
                    <label for="agree4">[선택] 마케팅 정보 수신 동의</label>
                </div>
            </div>

            <!-- 결제 버튼 -->
            <button class="payment-button" id="paymentButton" onclick="processPayment()" disabled>
                <span id="paymentAmount">₩19,900</span> 결제하기
            </button>
        </div>

        <!-- 주문 요약 -->
        <aside class="order-summary">
            <div class="summary-card">
                <h3 class="summary-title">📋 주문 요약</h3>

                <div class="plan-info">
                    <div class="plan-name-display" id="planNameDisplay">프리미엄 플랜</div>
                    <div class="plan-billing" id="planBillingDisplay">월간 구독</div>
                </div>

                <div class="summary-item">
                    <span class="summary-label">구독료</span>
                    <span class="summary-value" id="planPrice">₩19,900</span>
                </div>

                <div class="summary-item">
                    <span class="summary-label">할인</span>
                    <span class="summary-value" style="color: #d32f2f;">-₩0</span>
                </div>

                <div class="summary-total">
                    <span class="total-label">최종 결제 금액</span>
                    <span class="total-amount" id="totalAmount">₩19,900</span>
                </div>

                <div class="secure-badge">
                    🔒 안전한 결제 시스템
                </div>
            </div>
        </aside>
    </div>

    <footer>
        <p>
            대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 | 
            연락처: 0507-1422-2402 | 
            © 2025 UrbanGreen. All rights reserved.
        </p>
    </footer>

    <script>
        // URL에서 플랜 정보 가져오기
        const urlParams = new URLSearchParams(window.location.search);
        const plan = urlParams.get('plan') || 'premium';
        const billing = urlParams.get('billing') || 'monthly';

        const planData = {
            basic: {
                name: '베이직 플랜',
                monthly: 9900,
                yearly: 95040
            },
            premium: {
                name: '프리미엄 플랜',
                monthly: 19900,
                yearly: 190080
            },
            pro: {
                name: '프로 플랜',
                monthly: 29900,
                yearly: 285120
            }
        };

        const selectedPlan = planData[plan];
        const price = selectedPlan[billing];
        const billingText = billing === 'yearly' ? '연간 구독' : '월간 구독';

        // 화면에 플랜 정보 표시
        document.getElementById('planNameDisplay').textContent = selectedPlan.name;
        document.getElementById('planBillingDisplay').textContent = billingText;
        document.getElementById('planPrice').textContent = '₩' + price.toLocaleString();
        document.getElementById('totalAmount').textContent = '₩' + price.toLocaleString();
        document.getElementById('paymentAmount').textContent = '₩' + price.toLocaleString();

        // 결제 수단 선택
        function selectPaymentMethod(method) {
            const methods = document.querySelectorAll('.payment-method');
            methods.forEach(m => m.classList.remove('selected'));
            event.target.closest('.payment-method').classList.add('selected');

            const cardInfo = document.getElementById('cardInfo');
            if (method === 'card') {
                cardInfo.classList.add('show');
            } else {
                cardInfo.classList.remove('show');
            }
        }

        // 전체 약관 동의
        function toggleAllAgreements() {
            const agreeAll = document.getElementById('agreeAll').checked;
            const items = document.querySelectorAll('.agreement-item');
            items.forEach(item => item.checked = agreeAll);
            checkPaymentButton();
        }

        // 필수 약관 체크 시 결제 버튼 활성화
        document.querySelectorAll('.agreement-item').forEach(item => {
            item.addEventListener('change', checkPaymentButton);
        });

        function checkPaymentButton() {
            const agree1 = document.getElementById('agree1').checked;
            const agree2 = document.getElementById('agree2').checked;
            const agree3 = document.getElementById('agree3').checked;
            
            document.getElementById('paymentButton').disabled = !(agree1 && agree2 && agree3);
        }

        // 카드 번호 자동 포맷
        document.getElementById('cardNumber').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\s/g, '');
            let formattedValue = value.match(/.{1,4}/g)?.join('-') || value;
            e.target.value = formattedValue;
        });

        // 유효기간 자동 포맷
        document.getElementById('cardExpiry').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\//g, '');
            if (value.length >= 2) {
                e.target.value = value.slice(0, 2) + '/' + value.slice(2, 4);
            } else {
                e.target.value = value;
            }
        });

        // 결제 처리
        function processPayment() {
            if (!document.getElementById('paymentButton').disabled) {
                // 실제로는 PG사 결제 API 호출
                alert('결제 처리 중...');
                setTimeout(() => {
                    window.location.href = `payment-success.html?plan=${plan}&billing=${billing}`;
                }, 1500);
            }
        }
    </script>
</body>
</html>
