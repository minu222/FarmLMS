<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>비밀번호 변경 - UrbanGreen</title>
    <style>
        :root {
            --primary: #5cb85f;
            --primary-dark: #4caf50;
            --primary-light: #70c373;
            --gray: #757575;
            --light-gray: #f5f3ed;
            --cream: #fcfbf8;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            color: var(--text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .logo-header {
            padding: 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -1px;
            text-decoration: none;
        }

        .main-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
        }

        .change-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 500px;
            border: 1px solid rgba(92, 184, 95, 0.1);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.1);
        }

        .change-header {
            text-align: center;
            margin-bottom: 2.5rem;
            color: #000000;
        }

        .change-header h1 {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            color: #000000;
        }

        .change-header p {
            font-size: 1rem;
            color: #000000;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        label {
            font-weight: 600;
            color: #000000;
            margin-bottom: 0.5rem;
            display: block;
        }

        input[type="password"] {
            width: 100%;
            padding: 1rem;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 1rem;
            background: var(--light-gray);
            transition: border-color 0.3s, background-color 0.3s;
            color: #000000;
        }

        input[type="password"]:focus {
            border-color: var(--primary);
            background: white;
            outline: none;
            box-shadow: 0 0 0 3px rgba(92, 184, 95, 0.1);
        }

        button.change-btn {
            width: 100%;
            padding: 1.2rem;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.3);
            margin-top: 1rem;
        }

        button.change-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(92, 184, 95, 0.4);
        }

        footer {
            background: #2d3436;
            color: white;
            padding: 2rem 3rem;
            text-align: center;
            margin-top: 5rem;
        }

        footer p {
            color: rgba(255, 255, 255, 0.7);
            font-size: 0.9rem;
            margin: 0;
        }

        footer a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
        }

        footer a:hover {
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="logo-header">
        <a href="/main/urbangreen.html" class="logo">UrbanGreen</a>
    </div>

    <div class="main-container">
        <div class="change-card">
            <div class="change-header">
                <h1>비밀번호 변경</h1>
                <p>안전한 비밀번호로 변경해주세요</p>
            </div>
            <form id="passwordChangeForm" novalidate>
                <div>
                    <label for="newPassword">새 비밀번호</label>
                    <input type="password" id="newPassword" required minlength="6" placeholder="새 비밀번호 입력" />
                </div>
                <div>
                    <label for="confirmPassword">새 비밀번호 확인</label>
                    <input type="password" id="confirmPassword" required minlength="6" placeholder="새 비밀번호 다시 입력" />
                </div>
                <div id="passwordMatchMessage"
                    style="font-size: 0.9rem; margin-top: -1rem; margin-bottom: 1rem; display: none;"></div>
                <br>
                <div style="color: var(--gray); font-size: 0.9rem; margin-top: -1rem; margin-bottom: 1rem;">
                    영문/숫자/특수문자 2종 이상 포함 8–20자로 설정해야 합니다.<br>
                    다른 사이트와 동일하게 설정할 경우 보안에 취약할 수 있습니다.
                </div>
                <button type="submit" class="change-btn">비밀번호 변경</button>
            </form>
        </div>
    </div>

    <footer class="footer">
        <p>
            대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
            연락처: 0507-1422-2402 |
            © 2025 UrbanGreen. All rights reserved.
        </p>
    </footer>

    <script>
        const form = document.getElementById('passwordChangeForm');
        form.addEventListener('submit', e => {
            e.preventDefault();

            const currentPassword = document.getElementById('currentPassword').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();
            const confirmPassword = document.getElementById('confirmPassword').value.trim();

            if (currentPassword.length < 6) {
                alert('현재 비밀번호를 6자 이상 입력하세요.');
                return;
            }
            if (newPassword.length < 6) {
                alert('새 비밀번호를 6자 이상 입력하세요.');
                return;
            }
            if (newPassword !== confirmPassword) {
                alert('새 비밀번호와 확인이 일치하지 않습니다.');
                return;
            }

            // TODO: 실제 비밀번호 변경 처리 (서버 연동)
            alert('비밀번호가 변경되었습니다.');
            form.reset();
        });
        const newPasswordInput = document.getElementById('newPassword');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const message = document.getElementById('passwordMatchMessage');

        function checkPasswordsMatch() {
            if (confirmPasswordInput.value === '') {
                message.style.display = 'none';
                message.textContent = '';
                return;
            }
            if (newPasswordInput.value === confirmPasswordInput.value) {
                message.style.color = 'green';
                message.textContent = '비밀번호가 일치합니다.';
                message.style.display = 'block';
            } else {
                message.style.color = '#dc3545';
                message.textContent = '비밀번호가 일치하지 않습니다!';
                message.style.display = 'block';
            }
        }

        newPasswordInput.addEventListener('input', checkPasswordsMatch);
        confirmPasswordInput.addEventListener('input', checkPasswordsMatch);
    </script>
</body>

</html>
