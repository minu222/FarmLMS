<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>UrbanGreen - 작물 퀴즈 풀기</title>
    <style>
        :root {
            --primary: #5cb85f;
            --primary-dark: #4caf50;
            --primary-light: #70c373;
            --gray: #757575;
            --light-gray: #f5f3ed;
            --cream: #fcfbf8;
            --text: #212121;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #faf9f6 0%, #f5f3ed 100%);
            color: var(--text);
            line-height: 1.6;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 1000;
            background: rgba(255, 255, 255, 0.98);
            border-bottom: 1px solid #e9ecef;
            transition: all 0.3s ease;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary);
            letter-spacing: -0.5px;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 2rem;
        }

        nav a {
            color: var(--text);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s;
            position: relative;
        }

        nav a:hover,
        nav a.active {
            color: var(--primary);
        }

        nav a.active::after {
            content: '';
            position: absolute;
            bottom: -8px;
            left: 0;
            right: 0;
            height: 3px;
            background: var(--primary);
            border-radius: 2px;
        }

        .main-container {
            max-width: 600px;
            margin: 0 auto;
            padding: 8rem 2rem 5rem;
        }

        .quiz-title {
            font-weight: 800;
            font-size: 2rem;
            margin-bottom: 1.5rem;
            text-align: center;
        }

        .quiz-progress {
            text-align: right;
            color: var(--gray);
            margin-bottom: 2rem;
            font-size: 1rem;
        }

        .quiz-card {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 20px;
            padding: 2.5rem 2rem 2rem;
            border: 1px solid #e9ecef;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.06);
            margin-bottom: 2.5rem;
            animation: fadeInUp 0.4s;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .quiz-question {
            font-size: 1.25rem;
            font-weight: 700;
            margin-bottom: 2rem;
        }

        .quiz-choices {
            display: flex;
            flex-direction: column;
            gap: 1.1rem;
            margin-bottom: 2rem;
        }

        .quiz-choice-btn {
            padding: 1.1rem 1.5rem;
            background: var(--light-gray);
            border: 2px solid #e9ecef;
            border-radius: 12px;
            font-size: 1.08rem;
            text-align: left;
            transition: all 0.23s;
            font-weight: 500;
            cursor: pointer;
            outline: none;
            color: var(--text);
        }

        .quiz-choice-btn:hover {
            background: rgba(92, 184, 95, 0.10);
            border-color: var(--primary);
        }

        .quiz-choice-btn.selected {
            background: linear-gradient(135deg, var(--primary-light) 0%, var(--primary) 100%);
            color: white;
            border-color: var(--primary);
        }

        .quiz-result {
            text-align: center;
            margin-top: 2rem;
            font-size: 1.4rem;
            font-weight: 600;
        }

        .quiz-action-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-top: 2rem;
        }

        .btn {
            padding: 0.9rem 2.1rem;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-decoration: none;
            display: inline-block;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            box-shadow: 0 10px 30px rgba(92, 184, 95, 0.10);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--light-gray);
            color: var(--text);
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: rgba(92, 184, 95, 0.10);
            border-color: var(--primary);
        }

        /* 푸터 */
        footer {
            background: #2d3436;
            color: white;
            padding: 3rem 2rem 2rem;
            margin-top: 5rem;
        }

        .footer-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 1fr;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .footer-about h3 {
            font-size: 1.3rem;
            margin-bottom: 1rem;
            color: var(--primary);
        }

        .footer-about p {
            color: rgba(255, 255, 255, 0.7);
            line-height: 1.6;
        }

        .footer-links h4 {
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .footer-links ul {
            list-style: none;
        }

        .footer-links li {
            margin-bottom: 0.5rem;
        }

        .footer-links a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            transition: color 0.3s;
        }

        .footer-links a:hover {
            color: var(--primary);
        }

        .footer-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 2rem;
            text-align: center;
            color: rgba(255, 255, 255, 0.6);
            font-size: 0.9rem;
        }

        .service-list {
            display: flex;
            flex-wrap: wrap;
            max-width: 180px;
            gap: 0.3rem 1.5rem;
            list-style: none;
            padding: 0;
        }

        .service-list li {
            width: 33.3%;
            margin-bottom: 0.5rem;
        }
    </style>
</head>

<body>
    <header id="header">
        <div class="header-container">
            <a href="http://127.0.0.1:5500/main/main.html" class="logo">UrbanGreen</a>
            <nav>
                <a href="http://127.0.0.1:5500/board/class.html" class="active">강의</a>
                <a href="http://127.0.0.1:5500/board//notice.htmll">공지사항</a>
                <a href="http://127.0.0.1:5500/board/chat.html">채팅</a>
                <a href="/AI/aichoice.html">AI</a>
                <a href="/main/game.html">게임</a>
                <a href="http://127.0.0.1:5500/account/login.html">로그인</a>
            </nav>
        </div>
    </header>
    
    <main class="main-container">
        <div class="quiz-title">작물재배 퀴즈</div>
        <div class="quiz-progress" id="quizProgress">1 / 3 문제</div>
        <div class="quiz-card" id="quizCard">
            <div class="quiz-question" id="quizQuestion"></div>
            <div class="quiz-choices" id="quizChoices"></div>
        </div>
        <div class="quiz-action-group" id="quizActionGroup">
            <button class="btn btn-primary" id="submitBtn">제출</button>
        </div>
        <div class="quiz-result" id="quizResult" style="display:none;"></div>
    </main>
    
    <footer>
        <div class="footer-container">
            <div class="footer-about">
                <h3>UrbanGreen</h3>
                <p>청년 귀농인을 위한 작물재배 교육 플랫폼입니다.</p>
            </div>

            <div class="footer-links">
                <h4>서비스</h4>
                <ul class="service-list">
                    <li><a href="http://127.0.0.1:5500/board/class.html">강의</a></li>
                    <li><a href="http://127.0.0.1:5500/board//notice.html">공지사항</a></li>
                    <li><a href="http://127.0.0.1:5500/board/chat.html">채팅</a></li>
                    <li><a href="/AI/aichoice.html">AI</a></li>
                    <li><a href="/main/game.html">게임</a></li>
                </ul>
            </div>

            <div class="footer-links">
                <h4>고객지원</h4>
                <ul>
                    <li><a href="http://127.0.0.1:5500/main/faq.html">FAQ</a></li>
                    <li><a href="http://127.0.0.1:5500/main/terms.html">이용약관</a></li>
                    <li><a href="http://127.0.0.1:5500/main/privacy.html">개인정보처리방침</a></li>
                </ul>
            </div>
        </div>

        <div class="footer-bottom">
            <p>
                대전광역시 중구 선화동 중앙로121번길 20 방산빌딩 3층 |
                연락처: 0507-1422-2402 |
                © 2025 UrbanGreen. All rights reserved.
            </p>
        </div>
    </footer>
    
    <script>
        const quizData = [
            {
                question: "딸기 스마트팜에서 온·습도를 관리하는 장비는?",
                choices: ["조도 센서", "양액 탱크", "환경 컨트롤러", "양액 이송펌프"],
                answer: 2
            },
            {
                question: "토마토 재배에 가장 적합한 pH 범위는?",
                choices: ["4.0~4.5", "5.5~6.5", "7.5~8.0", "6.8~7.3"],
                answer: 1
            },
            {
                question: "벼 이앙 후 수확까지의 대표 시기는?",
                choices: ["60~80일", "90~110일", "120~140일", "150~180일"],
                answer: 2
            },
        ];

        let current = 0;
        let selected = null;
        let score = 0;

        function showQuiz(idx) {
            const q = quizData[idx];
            document.getElementById('quizQuestion').textContent = q.question;
            document.getElementById('quizChoices').innerHTML = q.choices.map((txt, i) =>
                `<button class="quiz-choice-btn${selected === i ? ' selected' : ''}" data-idx="${i}">${txt}</button>`
            ).join('');
            document.getElementById('quizProgress').textContent = (idx + 1) + ' / ' + quizData.length + ' 문제';
            document.getElementById('quizResult').style.display = 'none';
            document.getElementById('submitBtn').textContent = idx === quizData.length - 1 ? '최종 제출' : '제출';
            // 선택 이벤트
            [...document.querySelectorAll('.quiz-choice-btn')].forEach(btn => {
                btn.onclick = (e) => {
                    selected = Number(btn.dataset.idx);
                    showQuiz(current);
                };
            });
        }
        showQuiz(current);

        document.getElementById('submitBtn').onclick = () => {
            if (selected == null) {
                alert('답을 선택하세요.');
                return;
            }
            // 정답 체크
            if (selected === quizData[current].answer) score++;
            // 다음 or 결과
            if (current < quizData.length - 1) {
                current++; selected = null;
                showQuiz(current);
            } else {
                // 결과 보여주기
                document.getElementById('quizCard').innerHTML = '';
                document.getElementById('quizActionGroup').innerHTML =
                    `<a href="#" class="btn btn-secondary" onclick="window.location.reload();return false;">다시 풀기</a>`;
                document.getElementById('quizResult').style.display = 'block';
                document.getElementById('quizResult').textContent =
                    `총 ${quizData.length}문제 중 ${score}개 맞췄습니다!`;
            }
        };
    </script>
</body>

</html>
